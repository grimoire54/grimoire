function CharacterSheet({ heroName, heroConcept, gameState, tokenUsage, itemRarities, itemWeights, equipment, npcReputations, factionReputations, onOpenEquipment, onOpenQuests, onSelectItem, onGiftNpc, t }) {
  const isEmpty =
    !gameState.time &&
    gameState.effects.length === 0 &&
    gameState.inventory.length === 0 &&
    gameState.currency === 0 &&
    gameState.npcs.length === 0 &&
    gameState.quests.length === 0;
  const equippedNames = new Set(equipment ? Object.values(equipment).filter(Boolean) : []);
  const activeSets = equipment ? computeActiveEquipmentSets(equipment, gameState.inventory, itemRarities) : {};
  const activeSetSlotCount = Object.keys(activeSets).length;
  const totalWeight = computeTotalWeight(gameState.inventory, itemWeights || {});
  const carryCapacity = computeCarryCapacity(gameState.stats.strength, equipment, itemRarities);
  const isOverweight = totalWeight > carryCapacity;
  // Identically-named items (spare rings, a matching weapon pair, stacked
  // potions) are still separate entries in gameState.inventory — see
  // dropItem/useConsumable/equipItemFromDetail/giftItemToNpc, which act on
  // exactly one array index so a stack of 3 potions loses only 1. Grouped
  // here via the shared groupInventoryByName helper (see PURE HELPERS),
  // also used by GiftItemModal's own item picker.
  const inventoryGroups = groupInventoryByName(gameState.inventory);
  // Sort/filter are pure display state — never touches gameState.inventory
  // or its ordering, so save data, drop-by-index, and everything else that
  // relies on inventory order is untouched. Reset is unnecessary: an empty
  // result for the current filter is shown as its own message rather than
  // silently falling back to "all".
  const [inventorySort, setInventorySort] = useState('default');
  const [inventoryFilter, setInventoryFilter] = useState('all');
  // Which factions are expanded to show their known members — keyed by
  // lowercased faction name, same normalization as findFactionReputation,
  // so a click toggles regardless of how the name is cased anywhere else.
  const [expandedFactions, setExpandedFactions] = useState(() => new Set());
  // Which NPC rows are expanded to reveal their note/gift-link — collapsed
  // by default (see the header-only onClick below) so a long roster of
  // characters doesn't turn into a wall of prose; name + reputation bar
  // stay visible either way, only the descriptive/action parts hide.
  // Keyed by lowercased name rather than index so a toggle survives the
  // list re-sorting or gaining/losing entries between renders.
  const [expandedNpcs, setExpandedNpcs] = useState(() => new Set());
  const presentSlotTypes = Array.from(new Set(inventoryGroups.map(g => g.item.slot)))
    .filter(slot => ITEM_SLOT_LABEL_KEYS[slot]);
  const visibleGroups = inventoryGroups.filter(g => inventoryFilter === 'all' || g.item.slot === inventoryFilter);
  const sortedGroups = [...visibleGroups].sort((a, b) => {
    if (inventorySort === 'weight') {
      return findItemWeight(b.item.name, itemWeights) - findItemWeight(a.item.name, itemWeights);
    }
    if (inventorySort === 'rarity') {
      const rarityIndex = key => RARITY_TIERS.findIndex(tier => tier.key === key);
      return rarityIndex(findItemRarity(b.item.name, itemRarities) || 'common') - rarityIndex(findItemRarity(a.item.name, itemRarities) || 'common');
    }
    if (inventorySort === 'name') {
      return a.item.name.localeCompare(b.item.name);
    }
    return 0;
  });

  return (
    <div className="sheet">
      <div className="sheet-hero">
        <p className="sheet-hero-name">{heroName || t('heroFallback')}</p>
        {heroConcept && <p className="sheet-hero-concept">{heroConcept}</p>}
      </div>

      {onOpenEquipment && (
        <button onClick={onOpenEquipment} className="btn btn-ghost sheet-equipment-btn" type="button">
          🎽 {t('equipmentButton')}
          {activeSetSlotCount > 0 && <span className="sheet-set-indicator" title={t('setBonusLabel')}> 🔗{activeSetSlotCount}</span>}
        </button>
      )}

      <div className="sheet-vitals">
        <div className="sheet-vital-row">
          <span className="sheet-stat-label">{t('healthLabel')}</span>
          <span className="sheet-vital-value">{gameState.health}</span>
        </div>
        <div className="sheet-vital-row">
          <span className="sheet-stat-label">{t('psycheLabel')}</span>
          <span className="sheet-vital-value">{gameState.psyche}</span>
        </div>
        {gameState.time && (
          <div className="sheet-vital-row">
            <span className="sheet-stat-label">{t('timeLabel')}</span>
            <span className="sheet-vital-value">{gameState.time}</span>
          </div>
        )}
      </div>

      <div className="sheet-section">
        <p className="sheet-heading">{t('statsHeading')}</p>
        <div className="sheet-stat-row">
          <span className="sheet-stat-label">{t('strengthLabel')}</span>
          <span className="sheet-stat-value">{gameState.stats.strength}</span>
        </div>
        <div className="sheet-stat-row">
          <span className="sheet-stat-label">{t('agilityLabel')}</span>
          <span className="sheet-stat-value">{gameState.stats.agility}</span>
        </div>
        <div className="sheet-stat-row">
          <span className="sheet-stat-label">{t('intelligenceLabel')}</span>
          <span className="sheet-stat-value">{gameState.stats.intelligence}</span>
        </div>
      </div>

      {isEmpty && <p className="sheet-empty">{t('sheetEmpty')}</p>}

      {gameState.effects.length > 0 && (
        <div className="sheet-section">
          <p className="sheet-heading">{t('effectsHeading')}</p>
          {gameState.effects.map((e, i) => (
            <p key={i} className="sheet-list-item">— {e}</p>
          ))}
        </div>
      )}

      <div className="sheet-section">
        <p className="sheet-heading">{t('inventoryHeading')}</p>
        <div className="sheet-currency-row">
          <span className="sheet-stat-label">🪙 {t('currencyLabel')}</span>
          <span className="sheet-currency-value">{gameState.currency}</span>
        </div>
        {gameState.inventory.length > 0 && (
            <>
              <div className="sheet-weight-row">
                <span className="sheet-stat-label">{t('weightLabel')}</span>
                <span className={'sheet-weight-value' + (isOverweight ? ' sheet-weight-over' : '')}>{totalWeight} / {carryCapacity} {t('weightUnit')}</span>
              </div>
              <div className="weight-bar-track">
                <div
                  className={'weight-bar-fill' + (isOverweight ? ' weight-bar-over' : '')}
                  style={{ width: Math.min(100, (totalWeight / Math.max(1, carryCapacity)) * 100) + '%' }}
                />
              </div>
              {isOverweight && <p className="hint-text warning-text">{t('overweightWarning')}</p>}
              {inventoryGroups.length > 1 && (
                <div className="sheet-inventory-controls">
                  <InlineSelect
                    label={t('inventorySortLabel')}
                    value={inventorySort}
                    onChange={setInventorySort}
                    options={[
                      { value: 'default', label: t('inventorySortDefault') },
                      { value: 'weight', label: t('inventorySortWeight') },
                      { value: 'rarity', label: t('inventorySortRarity') },
                      { value: 'name', label: t('inventorySortName') }
                    ]}
                  />
                  {presentSlotTypes.length > 1 && (
                    <InlineSelect
                      label={t('inventoryFilterLabel')}
                      value={inventoryFilter}
                      onChange={setInventoryFilter}
                      options={[
                        { value: 'all', label: t('inventoryFilterAll') },
                        ...presentSlotTypes.map(slot => ({ value: slot, label: t(ITEM_SLOT_LABEL_KEYS[slot]) }))
                      ]}
                    />
                  )}
                </div>
              )}
              {sortedGroups.length === 0 && (
                <p className="sheet-empty">{t('inventoryFilterEmpty')}</p>
              )}
              {sortedGroups.map((group, gi) => {
                const { item, firstIndex, count } = group;
                const rarity = findItemRarity(item.name, itemRarities);
                const isEquipped = equippedNames.has(item.name);
                const weight = findItemWeight(item.name, itemWeights);
                const armorDefense = getArmorDefenseForSlot(item.slot, rarity || 'common');
                const weaponDamage = getWeaponDamageForSlot(item.slot, rarity || 'common', item.twoHanded);
                const statBadge = armorDefense !== null ? `🛡️${armorDefense}` : weaponDamage !== null ? `⚔️${weaponDamage}` : null;
                return (
                  <p
                    key={gi}
                    className="sheet-list-item sheet-list-item-clickable"
                    style={rarity ? { color: rarityColor(rarity) } : undefined}
                    onClick={() => onSelectItem && onSelectItem(firstIndex)}
                  >
                    [{item.name}]{isEquipped ? ' ✓' : ''}
                    <span className="sheet-item-meta"> · {weight} {t('weightUnit')}{statBadge ? ' · ' + statBadge : ''}{count > 1 ? ' ×' + count : ''}</span>
                  </p>
                );
              })}
            </>
          )}
        </div>

      {gameState.quests.length > 0 && (
        <div className="sheet-section">
          <div className="sheet-section-header">
            <p className="sheet-heading">{t('questsHeading')}</p>
            {onOpenQuests && <button onClick={onOpenQuests} className="sheet-heading-link" type="button">📜 {t('questsButton')}</button>}
          </div>
          {gameState.quests.filter(q => q.status === 'active').map(q => (
            <div key={q.id} className="sheet-quest">
              <p className="sheet-quest-title">{q.title}</p>
              <p className="sheet-quest-meta">{q.giver}{q.reward ? ' · ' + q.reward : ''}</p>
            </div>
          ))}
          {gameState.quests.filter(q => q.status !== 'active').map(q => (
            <p key={q.id} className={'sheet-quest-resolved' + (q.status === 'completed' ? ' sheet-quest-completed' : ' sheet-quest-failed')}>
              {q.title} — {q.status === 'completed' ? t('questStatusCompleted') : t('questStatusFailed')}
            </p>
          ))}
        </div>
      )}

      {gameState.npcs.length > 0 && (
        <div className="sheet-section">
          <p className="sheet-heading">{t('npcsHeading')}</p>
          {/* Present-with-the-hero characters float to the top, everyone
              elsewhere sinks to the bottom — Array.sort is stable in every
              engine this runs on, so within each of those two groups the
              original relative order (whatever gameState.npcs already had)
              is preserved rather than shuffled turn to turn. */}
          {[...gameState.npcs].sort((a, b) => (b.presentNow === true ? 1 : 0) - (a.presentNow === true ? 1 : 0)).map((n, i) => {
            const reputation = findNpcReputation(n.name, npcReputations || {});
            const hostile = isHostileReputation(reputation);
            const resentful = isResentfulReputation(reputation);
            // Fill has two regimes, split at neutral (0) rather than one
            // formula across the whole -100..100 range — so a middling
            // value like 10 reads as barely-filled (10%) instead of
            // "almost halfway", which is what the old (reputation+100)/2
            // mapping gave it. On the friendly side (>= 0) the fill IS the
            // value: 0% at neutral, climbing to 100% at full trust. The
            // moment standing dips below neutral, the bar snaps to fully
            // filled (100%, now red) — crossing into hostile territory
            // fills the tank — and drains back down toward empty as it
            // sinks further, reaching 0% at fully hostile (-100). Color is
            // a separate, continuous read on the same value via
            // reputationColor (red/yellow/green), so it no longer takes a
            // discrete hostile/resentful/normal class.
            const barPercent = reputation >= 0
              ? Math.max(0, Math.min(100, reputation))
              : Math.max(0, Math.min(100, 100 + reputation));
            const barColor = reputationColor(reputation);
            // Drives both the location dot and the gift link just below:
            // true only for a character the narrator just placed physically
            // with the hero this scene (see "presentNow" in
            // buildStateAndEventsSystemPrompt/reconcileNpcs) — someone merely
            // tracked from earlier in the story, but not currently in the
            // scene, reads as away (grey dot, no gift link).
            const isPresent = n.presentNow === true;
            const npcKey = n.name.trim().toLowerCase();
            const isNpcExpanded = expandedNpcs.has(npcKey);
            return (
              <div key={i} className="sheet-npc">
                <div className="sheet-npc-header" onClick={() => {
                  setExpandedNpcs(prev => {
                    const next = new Set(prev);
                    if (next.has(npcKey)) next.delete(npcKey); else next.add(npcKey);
                    return next;
                  });
                }}>
                  <span className="sheet-npc-toggle">{isNpcExpanded ? '▾' : '▸'}</span>
                  <span className={'sheet-npc-name' + (hostile ? ' sheet-npc-hostile' : resentful ? ' sheet-npc-resentful' : '')}>{n.name}{typeof n.role === 'string' && n.role.trim() ? ' - ' + n.role.trim() : ''}{hostile ? ' ⚔' : resentful ? ' 🚫' : ''}</span>
                  <span
                    className={'sheet-npc-dot' + (isPresent ? ' sheet-npc-dot-present' : ' sheet-npc-dot-away')}
                    aria-label={isPresent ? t('npcHereLabel') : t('npcAwayLabel')}
                    title={isPresent ? t('npcHereLabel') : t('npcAwayLabel')}
                  />
                </div>
                <p className="reputation-bar-caption">{t('reputationLabel')}</p>
                <div className="reputation-bar-track" aria-label={t('reputationLabel') + ': ' + reputation}>
                  <div className="reputation-bar-fill" style={{ width: barPercent + '%', backgroundColor: barColor }} />
                  <span className="reputation-bar-label">{reputation} / 100</span>
                </div>
                {isNpcExpanded && (
                  <>
                    {isPresent && onGiftNpc && (
                      <button onClick={() => onGiftNpc(n.name)} className="sheet-heading-link sheet-gift-link" type="button">🎁 {t('giftItemLink')}</button>
                    )}
                    <p className="sheet-npc-note">{n.note}</p>
                  </>
                )}
              </div>
            );
          })}
        </div>
      )}

      {gameState.factions.length > 0 && (
        <div className="sheet-section">
          <p className="sheet-heading">{t('factionsHeading')}</p>
          {gameState.factions.map((f, i) => {
            const key = f.name.trim().toLowerCase();
            const reputation = findFactionReputation(f.name, factionReputations || {});
            const hostile = isFactionHostile(reputation);
            const resentful = isFactionResentful(reputation);
            // Same two-regime fill as the NPC bars above, just split at
            // FACTION_DEFAULT_REPUTATION (0, true neutral) instead of the
            // NPC baseline — see the comment on the npcs bar above for why
            // the shape works this way.
            const barPercent = reputation >= 0
              ? Math.max(0, Math.min(100, reputation))
              : Math.max(0, Math.min(100, 100 + reputation));
            const barColor = reputationColor(reputation);
            // True only when this faction controls the location the hero
            // is standing in RIGHT NOW (see currentMapNode in
            // buildNarrativeSystemPrompt for the mechanic this mirrors) —
            // drives the small territory badge below, the player-facing
            // surface of the "region" half of this system.
            const currentMapNode = gameState.map && gameState.map.currentId ? (gameState.map.nodes || []).find(n => n.id === gameState.map.currentId) : null;
            const isCurrentTerritory = !!(currentMapNode && currentMapNode.faction && currentMapNode.faction.trim().toLowerCase() === key);
            // Every tracked NPC whose "faction" (see reconcileNpcs) matches
            // this entry — the roster revealed on expand. Membership is a
            // read of the npcs list itself, not stored on the faction, so
            // it can never drift out of sync with who the story has
            // actually shown belonging to this group.
            const members = gameState.npcs.filter(n => typeof n.faction === 'string' && n.faction.trim().toLowerCase() === key);
            const isExpanded = expandedFactions.has(key);
            return (
              <div key={i} className="sheet-npc sheet-faction-row" onClick={() => {
                setExpandedFactions(prev => {
                  const next = new Set(prev);
                  if (next.has(key)) next.delete(key); else next.add(key);
                  return next;
                });
              }}>
                <span className="sheet-faction-toggle">{isExpanded ? '▾' : '▸'}</span>
                <span className={'sheet-npc-name' + (hostile ? ' sheet-npc-hostile' : resentful ? ' sheet-npc-resentful' : '')}>{f.name}{hostile ? ' ⚔' : resentful ? ' 🚫' : ''}</span>
                <span className="sheet-faction-rank">{t(factionStandingLabelKey(reputation))}</span>
                {isCurrentTerritory && (
                  <span className="sheet-npc-dot sheet-npc-dot-present" aria-label={t('currentTerritoryLabel')} title={t('currentTerritoryLabel')} />
                )}
                <p className="reputation-bar-caption">{t('reputationLabel')}</p>
                <div className="reputation-bar-track" aria-label={t('reputationLabel') + ': ' + reputation}>
                  <div className="reputation-bar-fill" style={{ width: barPercent + '%', backgroundColor: barColor }} />
                  <span className="reputation-bar-label">{reputation} / 100</span>
                </div>
                <p className="sheet-npc-note">{f.note}</p>
                {isExpanded && (
                  <div className="sheet-faction-members" onClick={e => e.stopPropagation()}>
                    {members.length === 0 ? (
                      <p className="sheet-empty">{t('factionNoMembersText')}</p>
                    ) : (
                      members.map((n, mi) => {
                        const memberRep = findNpcReputation(n.name, npcReputations || {});
                        const memberHostile = isHostileReputation(memberRep);
                        const memberResentful = isResentfulReputation(memberRep);
                        return (
                          <div key={mi} className="sheet-faction-member">
                            <span className={'sheet-npc-name' + (memberHostile ? ' sheet-npc-hostile' : memberResentful ? ' sheet-npc-resentful' : '')}>{n.name}{typeof n.role === 'string' && n.role.trim() ? ' - ' + n.role.trim() : ''}</span>
                            <span
                              className={'sheet-npc-dot' + (n.presentNow === true ? ' sheet-npc-dot-present' : ' sheet-npc-dot-away')}
                              aria-label={n.presentNow === true ? t('npcHereLabel') : t('npcAwayLabel')}
                              title={n.presentNow === true ? t('npcHereLabel') : t('npcAwayLabel')}
                            />
                          </div>
                        );
                      })
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {typeof tokenUsage === 'number' && tokenUsage > 0 && (
        <div className="sheet-section">
          <p className="sheet-heading">{t('tokenUsageLabel')}</p>
          <p className="sheet-token-value">~{tokenUsage}</p>
        </div>
      )}
    </div>
  );
}

// Lets the player deepen a relationship on the spot by handing over one
// inventory item, or a chosen sum of currency, to a character sharing the
// hero's current location (see the gift link in CharacterSheet, gated on
// presentNow). Internal "stage" walks: 'pick' (item list + a money entry,
// if the hero has any) -> either 'confirm-item' straight away, or
// 'amount' -> 'confirm-currency' for money, since an amount has to be
// chosen before there's anything to confirm. Neither the backdrop nor any
// cancel button touches inventory/currency/reputation — onConfirm
// (confirmGift, in App()) is the only path that actually does, and it only
// ever fires from the two 'confirm-*' stages once the player has
// explicitly said yes. When skipGiftConfirm is already on (see
// GIFT_CONFIRM_SKIP_KEY), both paths shortcut straight past the
// confirmation stage into onConfirm.
function GiftItemModal({ npcName, gameState, itemRarities, itemWeights, skipGiftConfirm, onConfirm, onCancel, t }) {
  const [stage, setStage] = useState('pick');
  const [selectedIndex, setSelectedIndex] = useState(null);
  const [amountInput, setAmountInput] = useState('');
  const [dontShowAgain, setDontShowAgain] = useState(false);

  function pickItem(index) {
    if (skipGiftConfirm) { onConfirm({ type: 'item', index }, false); return; }
    setSelectedIndex(index);
    setDontShowAgain(false);
    setStage('confirm-item');
  }

  function startCurrencyGift() {
    setAmountInput(String(Math.min(gameState.currency, Math.max(1, Math.round(gameState.currency / 10)))));
    setStage('amount');
  }

  function proceedWithAmount() {
    const amt = Math.round(Number(amountInput));
    if (!Number.isFinite(amt) || amt <= 0 || amt > gameState.currency) return;
    if (skipGiftConfirm) { onConfirm({ type: 'currency', amount: amt }, false); return; }
    setDontShowAgain(false);
    setStage('confirm-currency');
  }

  if (stage === 'confirm-item') {
    const selectedItem = gameState.inventory[selectedIndex];
    const rarity = findItemRarity(selectedItem.name, itemRarities);
    return (
      <div className="modal-backdrop" onClick={e => { if (e.target === e.currentTarget) onCancel(); }}>
        <div className="modal-card">
          <h2 className="modal-title">{t('giftModalTitle')} — {npcName}</h2>
          <p className="hint-text hint-text-block warning-text">{t('giftConfirmQuestionItem').replace('{item}', selectedItem.name)}</p>
          <p className="sheet-list-item gift-confirm-item" style={rarity ? { color: rarityColor(rarity) } : undefined}>[{selectedItem.name}]</p>
          <div className="sheet-stat-row">
            <span className="sheet-stat-label">{t('giftRecipientLabel')}</span>
            <span className="sheet-stat-value">{npcName}</span>
          </div>
          <p className="hint-text hint-text-block">{t('giftReputationHint')}</p>
          <label className="checkbox-row">
            <input type="checkbox" checked={dontShowAgain} onChange={e => setDontShowAgain(e.target.checked)} />
            <span>{t('dontShowAgainLabel')}</span>
          </label>
          <div className="modal-actions">
            <button onClick={onCancel} className="btn btn-ghost" type="button">{t('cancelButton')}</button>
            <button onClick={() => onConfirm({ type: 'item', index: selectedIndex }, dontShowAgain)} className="btn btn-primary" type="button">{t('giftConfirmButton')}</button>
          </div>
        </div>
      </div>
    );
  }

  if (stage === 'confirm-currency') {
    const amt = Math.round(Number(amountInput));
    return (
      <div className="modal-backdrop" onClick={e => { if (e.target === e.currentTarget) onCancel(); }}>
        <div className="modal-card">
          <h2 className="modal-title">{t('giftModalTitle')} — {npcName}</h2>
          <p className="hint-text hint-text-block warning-text">{t('giftConfirmQuestionCurrency').replace('{amount}', amt)}</p>
          <div className="sheet-stat-row">
            <span className="sheet-stat-label">{t('giftRecipientLabel')}</span>
            <span className="sheet-stat-value">{npcName}</span>
          </div>
          <p className="hint-text hint-text-block">{t('giftCurrencyReputationHint')}</p>
          <label className="checkbox-row">
            <input type="checkbox" checked={dontShowAgain} onChange={e => setDontShowAgain(e.target.checked)} />
            <span>{t('dontShowAgainLabel')}</span>
          </label>
          <div className="modal-actions">
            <button onClick={onCancel} className="btn btn-ghost" type="button">{t('cancelButton')}</button>
            <button onClick={() => onConfirm({ type: 'currency', amount: amt }, dontShowAgain)} className="btn btn-primary" type="button">{t('giftConfirmButton')}</button>
          </div>
        </div>
      </div>
    );
  }

  if (stage === 'amount') {
    const amt = Math.round(Number(amountInput)) || 0;
    const invalid = amountInput === '' || amt <= 0 || amt > gameState.currency;
    return (
      <div className="modal-backdrop" onClick={e => { if (e.target === e.currentTarget) onCancel(); }}>
        <div className="modal-card">
          <h2 className="modal-title">{t('giftModalTitle')} — {npcName}</h2>
          <div className="sheet-stat-row">
            <span className="sheet-stat-label">{t('giftCurrencyAvailableLabel')}</span>
            <span className="sheet-stat-value">🪙 {gameState.currency}</span>
          </div>
          <div className="gift-currency-row">
            <input
              type="number"
              className="text-field gift-currency-input"
              min="1"
              max={gameState.currency}
              value={amountInput}
              onChange={e => setAmountInput(e.target.value)}
              autoFocus
            />
            <button onClick={() => setAmountInput(String(gameState.currency))} className="btn btn-ghost gift-currency-max-btn" type="button">{t('giftCurrencyMaxButton')}</button>
          </div>
          <div className="modal-actions">
            <button onClick={onCancel} className="btn btn-ghost" type="button">{t('cancelButton')}</button>
            <button onClick={proceedWithAmount} disabled={invalid} className="btn btn-primary" type="button">{t('continueButton')}</button>
          </div>
        </div>
      </div>
    );
  }

  const groups = groupInventoryByName(gameState.inventory);
  return (
    <div className="modal-backdrop" onClick={e => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="modal-card">
        <h2 className="modal-title">{t('giftModalTitle')} — {npcName}</h2>
        {gameState.currency > 0 && (
          <p className="sheet-list-item sheet-list-item-clickable gift-currency-option" onClick={startCurrencyGift}>
            💰 {t('giftCurrencyOption')}
            <span className="sheet-item-meta"> · {gameState.currency}</span>
          </p>
        )}
        {groups.length === 0 ? (
          gameState.currency === 0 && <p className="hint-text hint-text-block">{t('giftEmptyInventory')}</p>
        ) : (
          <div className="gift-item-list">
            {groups.map((group, gi) => {
              const { item, firstIndex, count } = group;
              const rarity = findItemRarity(item.name, itemRarities);
              const weight = findItemWeight(item.name, itemWeights);
              return (
                <p
                  key={gi}
                  className="sheet-list-item sheet-list-item-clickable"
                  style={rarity ? { color: rarityColor(rarity) } : undefined}
                  onClick={() => pickItem(firstIndex)}
                >
                  [{item.name}]

function EquipSlotPicker({ equippedName, currentStat, candidates, itemRarities, onEquip, onUnequip, t }) {
  const selectable = candidates.filter(c => c.name !== equippedName);
  return (
    <div className="equip-picker">
      {equippedName && (
        <button onClick={onUnequip} className="equip-picker-item equip-picker-unequip" type="button">
          ✕ {t('unequipButton')} [{equippedName}]
        </button>
      )}
      {selectable.map((c, i) => {
        const rarity = findItemRarity(c.name, itemRarities);
        const armorDefense = getArmorDefenseForSlot(c.slot, rarity || 'common');
        const weaponDamage = getWeaponDamageForSlot(c.slot, rarity || 'common', c.twoHanded);
        const stat = armorDefense !== null ? armorDefense : weaponDamage;
        const statIcon = armorDefense !== null ? '🛡️' : weaponDamage !== null ? '⚔️' : null;
        const diff = (stat !== null && currentStat !== null) ? stat - currentStat : null;
        return (
          <button
            key={i}
            onClick={() => onEquip(c.name)}
            className="equip-picker-item"
            type="button"
            style={rarity ? { color: rarityColor(rarity) } : undefined}
          >
            [{c.name}]{c.twoHanded ? ' 🤲' : ''}
            {stat !== null && (
              <span className="equip-picker-stat">
                {' '}{statIcon}{stat}
                {!!diff && (
                  <span className={diff > 0 ? 'equip-picker-diff-up' : 'equip-picker-diff-down'}>
                    {' '}({diff > 0 ? '+' : ''}{diff})
                  </span>
                )}
              </span>
            )}
          </button>
        );
      })}
      {selectable.length === 0 && !equippedName && (
        <p className="equip-picker-empty">{t('equipNoneAvailable')}</p>
      )}
    </div>
  );
}

function EquipmentModal({ gameState, equipment, itemRarities, pickerSlot, weaponLeftDisabled, onOpenPicker, onEquip, onUnequip, onClose, t }) {
  const activeSets = computeActiveEquipmentSets(equipment, gameState.inventory, itemRarities);
  return (
    <div className="modal-backdrop" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-card equipment-card">
        <h2 className="modal-title">{t('equipmentModalTitle')}</h2>
        <div className="equipment-grid">
          {EQUIPMENT_SLOT_CONFIG.map(slot => {
            if (slot.spacer) {
              return <div key={slot.key} className="equip-slot-wrap equip-slot-spacer" aria-hidden="true" />;
            }
            const disabled = slot.key === 'weaponLeft' && weaponLeftDisabled;
            const equippedName = disabled ? null : equipment[slot.key];
            const rarity = equippedName ? findItemRarity(equippedName, itemRarities) : null;
            const setBonus = equippedName ? getSetBonusForSlot(slot.key, activeSets) : { defense: 0, size: 0 };
            const baseArmorDefense = equippedName ? getArmorDefenseForSlot(slot.matchSlot, rarity || 'common') : null;
            const armorDefense = baseArmorDefense !== null ? baseArmorDefense + setBonus.defense : null;
            const equippedItem = equippedName ? gameState.inventory.find(it => it.name === equippedName && it.slot === slot.matchSlot) : null;
            const baseWeaponDamage = equippedName ? getWeaponDamageForSlot(slot.matchSlot, rarity || 'common', equippedItem && equippedItem.twoHanded) : null;
            const weaponDamage = baseWeaponDamage;
            const candidates = gameState.inventory.filter(it => {
              if (it.slot !== slot.matchSlot) return false;
              if (slot.key === 'weaponLeft') {
                // One-handed weapons default to the right hand only; the left
                // hand slot is for dual-wielding a matching pair, so it only
                // offers a weapon here when the hero owns at least two items
                // with that exact name.
                if (it.twoHanded) return false;
                const pairCount = gameState.inventory.filter(other => other.slot === 'weapon' && other.name === it.name).length;
                if (pairCount < 2) return false;
              }
              return true;
            });
            return (
              <div key={slot.key} className="equip-slot-wrap">
                <button
                  onClick={() => onOpenPicker(slot.key)}
                  className={'equip-slot-btn' + (disabled ? ' equip-slot-btn-disabled' : '') + (equippedName ? ' equip-slot-btn-filled' : '')}

// Tapping an inventory row opens this: the item's rolled weight, a note if
// it's the one currently equipped, and a Drop action. Drop itself doesn't
// remove anything here — it just hands off to DropConfirmModal below, so a
// stray tap can never lose an item without a second, explicit confirmation.


// ---- Map ----

const MAP_CELL = 92;
// How far a node is allowed to wobble off its exact grid intersection, in
// pixels — and how strongly a road between two nodes is allowed to bow into
// a curve, as a fraction of that road's own length. Both are derived from a
// stable hash of an id (the node's own id for jitter, the sorted pair of
// ids for a road's curve) rather than Math.random(), so the same node or
// road always lands on the same wobble/bend on every render — the map
// doesn't "jump" between openings, and the underlying gx/gy grid (see the
// note by findFreeGridCell) stays the exact integers the narrator reasons
// about; only the pixels drawn on screen come off-grid.
const MAP_JITTER_PX = 16;
const MAP_CURVE_STRENGTH = 0.22;

function hashStringToInt(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  return h >>> 0;
}

// Single source of truth for "grid cell -> screen pixel", used by every
// piece of map rendering that needs a node's position: edges, node icons
// (both discovered and fog), the route highlight, off-screen edge arrows,
// and camera centering. Keeping it in one place means a jitter tweak can
// never leave one of those pieces (say, an arrow) pointing at the old,
// un-jittered spot while everything else has moved.
function mapNodePixel(n) {
  const h = hashStringToInt(n.id);
  const jx = ((h & 0xffff) / 0xffff - 0.5) * 2 * MAP_JITTER_PX;
  const jy = (((h >>> 16) & 0xffff) / 0xffff - 0.5) * 2 * MAP_JITTER_PX;
  return { x: n.gx * MAP_CELL + jx, y: n.gy * MAP_CELL + jy };
}

// A quadratic-bezier path between two already-jittered pixel points, bowed
// out perpendicular to the line by an amount derived from `key` (an edge's
// sorted-pair id, so the bend is stable across renders and differs from
// road to road instead of every road bending the same way).
function curvedEdgePath(x1, y1, x2, y2, key) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const h = hashStringToInt(key);
  const bend = ((h / 0xffffffff) - 0.5) * 2 * MAP_CURVE_STRENGTH * len;
  const mx = (x1 + x2) / 2 + nx * bend;
  const my = (y1 + y2) / 2 + ny * bend;
  return `M${x1},${y1} Q${mx},${my} ${x2},${y2}`;
}
const MAP_KIND_ICONS = { settlement: '🏠', wilderness: '🌲', dungeon: '💀', landmark: '⛩️' };
// Fog nodes deliberately withhold name/description (see reconcileMap) so the
// player can't read ahead of what the hero has actually found — but the kind
// is coarse enough (one of four buckets) to reveal without spoiling anything,
// so tapping a "?" marker shows just this label instead of staying inert.
const MAP_KIND_LABEL_KEYS = { settlement: 'mapKindSettlement', wilderness: 'mapKindWilderness', dungeon: 'mapKindDungeon', landmark: 'mapKindLandmark' };

// Pan/zoom is imperative DOM (a ref + direct style.transform writes on
// pointer/wheel events) rather than React state, the same way the rest of
// this file avoids re-rendering on every mouse-move-scale value — putting
// panX/panY/scale in useState would re-render the whole node list on every
// pixel of drag. Node layout itself (gx/gy) is plain data and rendered
// normally through React; only the transform that pans/zooms the world is
// pushed straight to the DOM.
function MapModal({ map, quests, factionReputations, onClose, onRequestTravel, onCancelTravel, pendingMapTravel, t }) {
  const viewportRef = useRef(null);
  const worldRef = useRef(null);
  const centerOnHeroRef = useRef(() => {});
  // Current pan/scale, written by the pan/zoom effect below on every
  // transform update, and read by updateArrowPositions (redefined fresh
  // every render, see below) so the off-screen arrows always reflect
  // where the world is actually sitting right now — without needing pan
  // state in React and re-rendering the node list on every drag pixel.
  const viewStateRef = useRef({ panX: 0, panY: 0, scale: 0.95 });
  const updateArrowsRef = useRef(() => {});
  const heroArrowRef = useRef(null);
  const questArrowRefs = useRef(new Map());
  const [openNodeId, setOpenNodeId] = useState(null);
  const currentNode = map.nodes.find(n => n.id === map.currentId);

  useEffect(() => {
    const viewport = viewportRef.current;
    const world = worldRef.current;
    if (!viewport || !world) return undefined;
    let scale = 0.95, panX = 0, panY = 0;
    const current = map.nodes.find(n => n.id === map.currentId);
    const apply = () => {
      world.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
      viewStateRef.current = { panX, panY, scale };
      updateArrowsRef.current();
    };
    const centerOn = (x, y) => {
      const r = viewport.getBoundingClientRect();
      panX = r.width / 2 - x * scale;
      panY = r.height / 2 - y * scale;
      apply();
    };
    const heroPixel = () => current ? mapNodePixel(current) : { x: 0, y: 0 };
    const p0 = heroPixel();
    centerOn(p0.x, p0.y);
    // Manual "recenter on hero" button reads this ref rather than touching
    // panX/panY itself — those live only inside this effect's closure, so
    // this is the one door out to the button in the JSX below. Re-pointed
    // every time the effect reruns (new viewport size, or the hero moved to
    // a new node) so it never calls a stale closure.
    centerOnHeroRef.current = () => { const p = heroPixel(); centerOn(p.x, p.y); };

    const pts = {};
    let dragging = false, startX = 0, startY = 0, startPanX = 0, startPanY = 0;
    let pinchDist = 0, pinchScale = 1, pinchMid = { x: 0, y: 0 }, pinchPan = { x: 0, y: 0 };
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const midpoint = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

    const onDown = e => {
      if (e.target.closest && e.target.closest('.map-node-desc, .map-recenter-btn')) return;
      viewport.setPointerCapture(e.pointerId);
      pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      const ids = Object.keys(pts);
      if (ids.length === 1) {
        dragging = true; startX = e.clientX; startY = e.clientY; startPanX = panX; startPanY = panY;
        viewport.style.cursor = 'grabbing';
      } else if (ids.length === 2) {
        dragging = false;
        const a = pts[ids[0]], b = pts[ids[1]];
        pinchDist = dist(a, b); pinchScale = scale; pinchMid = midpoint(a, b); pinchPan = { x: panX, y: panY };
      }
    };
    const onMove = e => {
      if (!(e.pointerId in pts)) return;
      pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      const ids = Object.keys(pts);
      if (ids.length === 2) {
        const a = pts[ids[0]], b = pts[ids[1]];
        const r = viewport.getBoundingClientRect();
        const newDist = dist(a, b);
        const newScale = Math.max(0.5, Math.min(2.4, pinchScale * (newDist / pinchDist)));
        const wx = (pinchMid.x - r.left - pinchPan.x) / pinchScale;
        const wy = (pinchMid.y - r.top - pinchPan.y) / pinchScale;
        const nowMid = midpoint(a, b);
        scale = newScale;
        panX = (nowMid.x - r.left) - wx * scale;
        panY = (nowMid.y - r.top) - wy * scale;
        apply();
      } else if (ids.length === 1 && dragging) {
        panX = startPanX + (e.clientX - startX);
        panY = startPanY + (e.clientY - startY);
        apply();
      }
    };
    const release = e => {
      delete pts[e.pointerId];
      const ids = Object.keys(pts);
      if (ids.length === 0) { dragging = false; viewport.style.cursor = 'grab'; }
      else if (ids.length === 1) { dragging = true; const p = pts[ids[0]]; startX = p.x; startY = p.y; startPanX = panX; startPanY = panY; }
    };
    const onWheel = e => {
      if (e.target.closest && e.target.closest('.map-node-desc')) return;
      e.preventDefault();
      const r = viewport.getBoundingClientRect();
      const cx = r.width / 2, cy = r.height / 2;
      const wx = (cx - panX) / scale, wy = (cy - panY) / scale;
      scale = Math.max(0.5, Math.min(2.4, scale * (e.deltaY < 0 ? 1.1 : 0.9)));
      panX = cx - wx * scale; panY = cy - wy * scale;
      apply();
    };
    viewport.addEventListener('pointerdown', onDown);
    viewport.addEventListener('pointermove', onMove);
    viewport.addEventListener('pointerup', release);
    viewport.addEventListener('pointercancel', release);
    viewport.addEventListener('wheel', onWheel, { passive: false });
    return () => {
      viewport.removeEventListener('pointerdown', onDown);
      viewport.removeEventListener('pointermove', onMove);
      viewport.removeEventListener('pointerup', release);
      viewport.removeEventListener('pointercancel', release);
      viewport.removeEventListener('wheel', onWheel);
    };
  }, [map.currentId]);

  const nodeById = id => map.nodes.find(n => n.id === id);
  const edgeKey = (a, b) => [a, b].sort().join('|');
  const walkedKeys = new Set(map.visitedEdges.map(([a, b]) => edgeKey(a, b)));
  const drawnEdges = new Set();
  const lines = [];
  map.nodes.forEach(n => {
    n.connections.forEach(otherId => {
      const key = edgeKey(n.id, otherId);
      if (drawnEdges.has(key)) return;
      drawnEdges.add(key);
      const other = nodeById(otherId);
      if (!other || !n.discovered || !other.discovered) return;
      const walked = walkedKeys.has(key);
      const p1 = mapNodePixel(n), p2 = mapNodePixel(other);
      lines.push(
        <path key={key} d={curvedEdgePath(p1.x, p1.y, p2.x, p2.y, key)} fill="none"
          className={walked ? 'map-edge map-edge-walked' : 'map-edge'} />
      );
    });
  });

  const openNode = openNodeId ? nodeById(openNodeId) : null;
  const openNodeIsAdjacent = !!(openNode && currentNode && openNode.id !== currentNode.id && currentNode.connections.includes(openNode.id));
  const isQueuedOpenNode = !!(openNode && pendingMapTravel && pendingMapTravel.id === openNode.id);
  // Whether the travel-offer row has anything to show right now. The row
  // itself is always rendered (see the JSX below) and just toggles
  // visibility rather than mounting/unmounting, so opening or closing a
  // node's popup never changes the map card's height — and, since the
  // backdrop centers the card, never makes the whole window jump.
  const travelRowVisible = !!(openNode && (isQueuedOpenNode || openNodeIsAdjacent));

  // Discovered nodes carrying an active quest, other than wherever the hero
  // currently stands (that one already gets the hero's own arrow below) —
  // each gets its own off-screen indicator once the map is panned/zoomed
  // away from it.
  const questArrowNodes = map.nodes.filter(n =>
    n.discovered && (!currentNode || n.id !== currentNode.id) && n.questId &&
    quests.some(q => q.id === n.questId && q.status === 'active')
  );

  // Positions (and shows/hides) the small edge arrows for the hero and any
  // active quest markers currently panned out of the viewport. Rebuilt on
  // every render so it always closes over this render's nodes/quests, but
  // it reads panX/panY/scale from viewStateRef — the live values kept
  // current by the pan/zoom effect's own apply() — rather than from React
  // state, so it stays cheap to call on every drag/wheel/pinch tick.
  updateArrowsRef.current = () => {
    const viewport = viewportRef.current;
    if (!viewport) return;
    const { panX, panY, scale } = viewStateRef.current;
    const w = viewport.clientWidth, h = viewport.clientHeight;
    const edgeMargin = 16; // roughly half an icon, so the arrow only shows once the icon is fully hidden
    const inset = 18; // how far in from the viewport edge the arrow itself sits
    const place = (el, x, y) => {
      if (!el) return;
      const tx = panX + x * scale;
      const ty = panY + y * scale;
      const onScreen = tx >= edgeMargin && tx <= w - edgeMargin && ty >= edgeMargin && ty <= h - edgeMargin;
      if (onScreen) { el.classList.remove('map-edge-arrow-visible'); return; }
      const dx = tx - w / 2, dy = ty - h / 2;
      const sx = dx !== 0 ? (w / 2 - inset) / Math.abs(dx) : Infinity;
      const sy = dy !== 0 ? (h / 2 - inset) / Math.abs(dy) : Infinity;
      const s = Math.min(sx, sy);
      const ax = w / 2 + dx * s, ay = h / 2 + dy * s;
      const angle = Math.atan2(dy, dx) * 180 / Math.PI + 90;
      el.style.left = `${ax}px`;
      el.style.top = `${ay}px`;
      el.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
      el.classList.add('map-edge-arrow-visible');
    };
    if (currentNode) { const p = mapNodePixel(currentNode); place(heroArrowRef.current, p.x, p.y); }
    questArrowRefs.current.forEach((el, id) => {
      const n = nodeById(id);
      if (n) { const p = mapNodePixel(n); place(el, p.x, p.y); }
    });
  };
  useEffect(() => { updateArrowsRef.current(); });

  // A queued destination (or, absent one, whichever adjacent node's popup
  // is currently open, as a preview before confirming) gets its own
  // pulsing overlay line on top of the plain edge above, pointing the
  // player toward where a trip would actually take them.
  const routeTargetNode = pendingMapTravel ? nodeById(pendingMapTravel.id) : (openNodeIsAdjacent ? openNode : null);
  const routeFromPixel = currentNode ? mapNodePixel(currentNode) : { x: 0, y: 0 };
  const routeToPixel = routeTargetNode ? mapNodePixel(routeTargetNode) : { x: 0, y: 0 };
  const routeFromX = routeFromPixel.x, routeFromY = routeFromPixel.y;
  const routeToX = routeToPixel.x, routeToY = routeToPixel.y;
  // Same key as the underlying road's own <path> above, so the highlight
  // (and the dot that travels along it) bows along the exact same curve
  // instead of cutting a straight line across it.
  const routeKey = currentNode && routeTargetNode ? edgeKey(currentNode.id, routeTargetNode.id) : null;
  const routePathD = routeKey ? curvedEdgePath(routeFromX, routeFromY, routeToX, routeToY, routeKey) : '';
  // A soft radial-gradient blob glides along the straight line from the
  // hero to the queued (or previewed) destination, fading in near the
  // start and out near the end — the same gentle glow-and-fade language
  // as the hero's radar pulse above, just unrolled onto a line instead of
  // pulsing in place.
  const routeHighlightLine = routeTargetNode && currentNode ? (
    <>
      <defs>
        <radialGradient id="mapRouteWaveGradient" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="#7dd3fc" stopOpacity="0.95" />
          <stop offset="55%" stopColor="#38bdf8" stopOpacity="0.5" />
          <stop offset="100%" stopColor="#38bdf8" stopOpacity="0" />
        </radialGradient>
      </defs>
      <path d={routePathD} fill="none" className="map-route-highlight-base" />
      <circle r="9" className="map-route-wave-dot">
        <animateMotion
          dur="1.7s"
          repeatCount="indefinite"
          calcMode="linear"
          path={routePathD}
        />
      </circle>
    </>
  ) : null;

  return (
    <div className="modal-backdrop" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-card map-card">
        <h2 className="modal-title">{t('mapModalTitle')}</h2>
        <div className="map-legend">
          <span className="map-legend-item"><span className="map-dot map-dot-hero" />{t('mapLegendHero')}</span>
          <span className="map-legend-item"><span className="map-dot map-dot-quest" />{t('mapLegendQuest')}</span>
          <span className="map-legend-item"><span className="map-dash" />{t('mapLegendRoute')}</span>
          <span className="map-legend-item"><span className="map-legend-ring map-legend-ring-resentful" />{t('mapLegendResentfulTerritory')}</span>
          <span className="map-legend-item"><span className="map-legend-ring map-legend-ring-hostile" />{t('mapLegendHostileTerritory')}</span>
        </div>
        <div className="map-viewport" ref={viewportRef}>
          <div className="map-world" ref={worldRef}>
            <svg className="map-svg">{lines}{routeHighlightLine}</svg>
            {map.nodes.filter(n => n.discovered).map(n => {
              const isCurrent = n.id === map.currentId;
              const quest = n.questId ? quests.find(q => q.id === n.questId && q.status === 'active') : null;
              const open = openNodeId === n.id;
              const p = mapNodePixel(n);
              // Territory coloring: purely a read of this node's own
              // "faction" against factionReputations, same thresholds as
              // everywhere else (isFactionHostile/isFactionResentful) — a
              // location with no faction, or one the hero hasn't soured
              // with, never gets a ring. Skipped for the hero's own node
              // (isCurrent already renders as a plain dot, not a
              // bordered circle, and standing there is already surfaced
              // via the character sheet's "current territory" line).
              const territoryRep = n.faction ? findFactionReputation(n.faction, factionReputations || {}) : null;
              const territoryHostile = !isCurrent && n.faction && isFactionHostile(territoryRep);
              const territoryResentful = !isCurrent && n.faction && isFactionResentful(territoryRep);
              return (
                <div key={n.id}
                  className="map-node"
                  style={{ left: p.x, top: p.y }}
                  role="button" tabIndex={0} aria-expanded={open}
                  onClick={() => setOpenNodeId(open ? null : n.id)}
                  onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setOpenNodeId(open ? null : n.id); } }}>
                  <span className="map-node-icon-wrap">
                    {isCurrent && <span className="map-node-radar map-node-radar-hero"><span /><span /></span>}
                    {!isCurrent && quest && <span className="map-node-radar map-node-radar-quest"><span /><span /></span>}
                    <span className={'map-node-icon' + (isCurrent ? ' map-node-icon-hero' : quest ? ' map-node-icon-quest' : '') + (territoryHostile ? ' map-node-icon-hostile-territory' : territoryResentful ? ' map-node-icon-resentful-territory' : '')} title={n.faction || undefined}>
                      {isCurrent ? '' : (MAP_KIND_ICONS[n.kind] || '📍')}
                    </span>
                  </span>
                  <span className={'map-node-label' + (isCurrent ? ' map-node-label-hero' : '')}>{n.name}</span>
                  {open && n.description && <div className="map-node-desc" onClick={e => e.stopPropagation()}>{n.description}</div>}
                </div>
              );
            })}
            {map.nodes.filter(n => !n.discovered).map(n => {
              const open = openNodeId === n.id;
              const p = mapNodePixel(n);
              return (
                <div key={n.id}
                  className="map-node map-node-fog"
                  style={{ left: p.x, top: p.y }}
                  role="button" tabIndex={0} aria-expanded={open} aria-label={t('mapFogLabel')}
                  onClick={() => setOpenNodeId(open ? null : n.id)}
                  onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setOpenNodeId(open ? null : n.id); } }}>
                  <span className="map-node-icon map-node-icon-fog">?</span>
                  {open && (
                    <div className="map-node-desc">
                      {(MAP_KIND_ICONS[n.kind] || '📍') + ' ' + t(MAP_KIND_LABEL_KEYS[n.kind] || 'mapKindLandmark')}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          <div
            ref={heroArrowRef}
            className="map-edge-arrow map-edge-arrow-hero"
            aria-hidden="true"
          />
          {questArrowNodes.map(n => (
            <div
              key={n.id}
              ref={el => { if (el) questArrowRefs.current.set(n.id, el); else questArrowRefs.current.delete(n.id); }}
              className="map-edge-arrow map-edge-arrow-quest"
              aria-hidden="true"
            />
          ))}
          <button
            type="button"
            className="map-recenter-btn"
            onClick={() => centerOnHeroRef.current()}
            aria-label={t('mapRecenterAria')}
            title={t('mapRecenterAria')}
          >🎯</button>
        </div>
        <div className="item-offers map-travel-offer">
          <div className="item-offer-group">
            <div className="item-offer-row" style={{ visibility: travelRowVisible ? 'visible' : 'hidden' }}>
              <span className="item-offer-label">🧭 {openNode ? openNode.name : '\u00A0'}</span>
              <div className="item-offer-choice">
                <button
                  onClick={() => { if (!travelRowVisible) return; isQueuedOpenNode ? onCancelTravel() : onRequestTravel(openNode); }}
                  className={'item-choice-btn map-travel-toggle-btn' + (isQueuedOpenNode ? ' item-choice-active-take' : '')}
                  aria-pressed={isQueuedOpenNode}
                  aria-label={t(isQueuedOpenNode ? 'removeMapTravelAria' : 'mapTravelConfirmAria')}
                  type="button"
                >➜</button>
              </div>
            </div>
            <p className="map-travel-queued-note" style={{ visibility: isQueuedOpenNode ? 'visible' : 'hidden' }}>{t('mapTravelQueuedBadge')}</p>
          </div>
        </div>
        <p className="map-hint">{t('mapHint')}</p>
        {map.nodes.length === 0 && <p className="map-empty">{t('mapEmptyText')}</p>}
        <div className="modal-actions">
          <button onClick={onClose} className="btn btn-primary" type="button">{t('closeButton')}</button>
        </div>
      </div>
    </div>
  );
}

// The quest journal: every quest the hero has ever picked up, grouped by
// status (active/completed/failed — always in that order, matching the
// player's natural priority), each row collapsed to just its title until
// tapped. The sort button only reorders quests WITHIN each status group
// (by acceptance order, i.e. array order — quests are only ever appended,
// never reordered elsewhere) since the active/completed/failed grouping
// itself is the one ordering the player actually depends on to find things.
function QuestJournalModal({ quests, onClose, t }) {
  const [openId, setOpenId] = useState(null);
  const [newestFirst, setNewestFirst] = useState(true);

  const groups = [
    { key: 'active', heading: t('questActiveHeading'), list: quests.filter(q => q.status === 'active') },
    { key: 'completed', heading: t('questCompletedHeading'), list: quests.filter(q => q.status === 'completed') },
    { key: 'failed', heading: t('questFailedHeading'), list: quests.filter(q => q.status === 'failed') }
  ];

  return (
    <div className="modal-backdrop" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-card quest-journal-card">
        <div className="quest-journal-header">
          <h2 className="modal-title">{t('questJournalModalTitle')}</h2>
          {quests.length > 0 && (
            <button onClick={() => setNewestFirst(v => !v)} className="btn btn-ghost quest-sort-btn" type="button">
              ↕ {newestFirst ? t('questSortButtonNewestFirst') : t('questSortButtonOldestFirst')}
            </button>
          )}
        </div>
        {quests.length === 0 && <p className="quest-journal-empty">{t('questJournalEmptyText')}</p>}
        {groups.map(group => group.list.length === 0 ? null : (
          <div key={group.key} className="quest-journal-group">
            <p className="sheet-heading">{group.heading}</p>
            {(newestFirst ? [...group.list].reverse() : group.list).map(q => {
              const open = openId === q.id;
              return (
                <div key={q.id} className="quest-journal-item">
                  <button
                    onClick={() => setOpenId(open ? null : q.id)}
                    className={'quest-journal-row quest-journal-row-' + q.status}
                    type="button"
                    aria-expanded={open}
                  >
                    <span className="quest-journal-title">{q.title}</span>
                    <span className="quest-journal-caret">{open ? '▾' : '▸'}</span>
                  </button>
                  {open && (
                    <div className="quest-journal-detail">
                      {q.description && <p className="quest-journal-description">{q.description}</p>}
                      <p className="quest-journal-log-heading">{t('questLogHeading')}</p>
                      {q.log.length > 0 ? (
                        <ul className="quest-journal-log">
                          {q.log.map((entry, i) => <li key={i}>{entry}</li>)}
                        </ul>
                      ) : (
                        <p className="quest-journal-log-empty">{t('questLogEmptyText')}</p>
                      )}
                      <p className="quest-journal-reward">{t('questRewardLabel')}: {q.reward || '—'}</p>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        ))}
        <div className="modal-actions">
          <button onClick={onClose} className="btn btn-primary" type="button">{t('closeButton')}</button>
        </div>
      </div>
    </div>
  );
}

  // Rolling prose summary of everything older than RECENT_TURN_WINDOW, kept

  // How many history entries are already folded into narrativeSummaryRef —

  const summarizedUpToRef = useRef(0);

  // -- Derived values --

  // ---- EFFECTS: load saved language/settings/campaign on mount; keep scroll & turn-index in sync ----

      } catch (e) {

      } catch (e) {

      try {
        const saveResult = await window.storage.get(SAVE_KEY, false);
        if (!cancelled && saveResult && saveResult.value) {
          const saved = JSON.parse(saveResult.value);
          setWorldSetting(saved.worldSetting || '');
          setHeroName(saved.heroName || '');
          setHeroConcept(saved.heroConcept || '');

          setGameState(normalizeGameState(saved.gameState));
          setItemRarities(saved.itemRarities || {});
          setItemWeights(saved.itemWeights || {});
          setNpcReputations(saved.npcReputations || {});
          setNpcKindnessCooldowns(saved.npcKindnessCooldowns || {});
          setFactionReputations(saved.factionReputations || {});
          setEquipment(normalizeEquipment(saved.equipment));
          narrativeSummaryRef.current = saved.narrativeSummary || '';
          summarizedUpToRef.current = saved.summarizedUpTo || 0;

        }
      } catch (e) {
        // no save found
      } finally {
        if (!cancelled) setInitializing(false);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
  }, [currentTurnIndex, loading]);

  useEffect(() => {
    if (totalTurns > 0) setCurrentTurnIndex(totalTurns);
  }, [totalTurns]);

  useEffect(() => {
    setTurnInputValue(String(currentTurnIndex));
  }, [currentTurnIndex]);


  // ---- TURN NAVIGATION & SETTINGS/SAVE PERSISTENCE ----
  function goToTurn(n) {
    const clamped = Math.max(1, Math.min(totalTurns || 1, n));
    setCurrentTurnIndex(clamped);
  }

  async function setLanguage(lang) {
    setUiLang(lang);
    try {
      await window.storage.set(LANG_KEY, lang, false);
    } catch (e) {
      // storage unavailable — language choice just won't persist
    }

    } catch (e) {

  async function setApiKey(key) {

    } catch (e) {
      // storage unavailable — key just won't persist across reloads
    }
  }

  async function setModel(model) {

    try {
      await window.storage.set(MODEL_STORAGE_KEY, model, false);
    } catch (e) {
      // storage unavailable — model choice just won't persist
    }
  }

  async function saveGame(nextMessages, nextState, nextItemRarities, nextEquipment, nextItemWeights, nextNpcReputations, nextFactionReputations, nextNpcKindnessCooldowns) {
    try {
      await window.storage.set(
        SAVE_KEY,
        JSON.stringify({
          worldSetting, heroName, heroConcept,
          messages: nextMessages,
          gameState: nextState,
          itemRarities: nextItemRarities !== undefined ? nextItemRarities : itemRarities,
          itemWeights: nextItemWeights !== undefined ? nextItemWeights : itemWeights,
          npcReputations: nextNpcReputations !== undefined ? nextNpcReputations : npcReputations,
          npcKindnessCooldowns: nextNpcKindnessCooldowns !== undefined ? nextNpcKindnessCooldowns : npcKindnessCooldowns,
          factionReputations: nextFactionReputations !== undefined ? nextFactionReputations : factionReputations,
          equipment: nextEquipment !== undefined ? nextEquipment : equipment,
          narrativeSummary: narrativeSummaryRef.current,
          summarizedUpTo: summarizedUpToRef.current
        }),
        false
      );
    } catch (e) {
      // storage unavailable — autosave just won't persist; the player can
      // still fall back to a manual export/download.
    }
  }

  // A generation can take a while (streamed narrative plus several
  // follow-up calls), and on a phone the single biggest reason the tab gets
  // backgrounded mid-turn is the screen simply timing out and locking while
  // the player waits. Holding a screen wake lock for the duration of a turn
  // prevents that specific case. It can't do more than that: a wake lock is
  // released by the browser the moment the player actually switches away to
  // another app or the tab itself loses visibility, and no page-level API
  // can force a truly backgrounded tab to keep running — that's an OS/browser
  // platform limit, the same for any website, not something specific to
  // this app. Unsupported browsers simply skip this with no effect either way.

  // ---- SCREEN WAKE LOCK — keeps the tab awake mid-turn on mobile ----
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLockRef.current = await navigator.wakeLock.request('screen');
      }
    } catch (e) {
      // not supported, or permission/state doesn't allow it right now — fine either way
    }
  }

  function releaseWakeLock() {
    if (wakeLockRef.current) {
      try { wakeLockRef.current.release(); } catch (e) { /* already released */ }
      wakeLockRef.current = null;
    }
  }

  // A wake lock is auto-released by the browser on hide and isn't reacquired
  // automatically on return — if a turn is still generating when the player
  // comes back, grab it again so the screen doesn't immediately re-time-out.
  useEffect(() => {
    function handleVisibilityChange() {
      if (document.visibilityState === 'visible' && loading && !wakeLockRef.current) {
        requestWakeLock();
      }
    }
    document.addEventListener('visibilitychange', handleVisibilityChange);
    return () => document.removeEventListener('visibilitychange', handleVisibilityChange);
  }, [loading]);

  // Calls Google's Gemini API directly from the browser, using a Gemini API
  // key the player pastes into Settings (see geminiApiKey/setApiKey above) —
  // this is a standalone website now, not a Claude.ai artifact, so there's no
  // platform bridge handling auth for us. The key travels straight from this
  // browser to generativelanguage.googleapis.com in a request header and
  // nowhere else — there's no backend server in this architecture to send it
  // through. maxOutputTokens is set to 2048, comfortably above what any one
  // focused call actually needs — the old 1000-token ceiling was specific to
  // the Claude.ai artifact bridge, not a real requirement, so there's no
  // reason to carry it over. The turn is still split into several focused
  // calls (narrative, then secrets/state/events separately) since that split
  // is about keeping each call's job simple, not about a token budget. A
  // response that still comes back truncated (finishReason "MAX_TOKENS") gets
  // one silent retry for a chance at a cleaner result, but never blocks:
  // whatever text came back is still usable — better to show it than to
  // interrupt the player with an error.

  // ---- GEMINI API CALL HELPERS ----
  function geminiEndpoint(model, method) {
    return `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model || DEFAULT_GEMINI_MODEL)}:${method}`;
  }

  // Internal turn roles here are 'user' | 'assistant' (built by
  // generateNarrative and the other call sites below) — Gemini calls the
  // assistant's turn 'model' instead of 'assistant', everything else maps
  // straight across into Gemini's {role, parts:[{text}]} content shape.
  function toGeminiContents(messages) {
    return messages.map(m => ({
      role: m.role === 'assistant' ? 'model' : 'user',
      parts: [{ text: m.content }]
    }));
  }

  function throwApiError(data) {
    const status = data && data.error && data.error.status;
    const message = (data && data.error && data.error.message) || 'API request failed';
    const err = new Error(message);
    if (status === 'RESOURCE_EXHAUSTED' || status === 'UNAVAILABLE') {
      err.code = 'rate_limit';
    }
    throw err;
  }

  function describeError(e, prefixKey) {
    return e.code === 'rate_limit' ? t('rateLimitError') : t(prefixKey) + e.message;
  }

  async function callGemini(system, messages, retriesLeft) {
    if (retriesLeft === undefined) retriesLeft = 1;
    const response = await fetch(geminiEndpoint(geminiModel, 'generateContent'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': geminiApiKey },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: system }] },
        contents: toGeminiContents(messages),
        generationConfig: { maxOutputTokens: 2048 }
      })
    });
    const data = await response.json();
    if (!response.ok) throwApiError(data);
    if (data.usageMetadata) {
      usageAccumulatorRef.current.output += data.usageMetadata.candidatesTokenCount || 0;
    }
    const candidate = data.candidates && data.candidates[0];
    // A part can carry only a thought signature and no text — .text is
    // undefined there, and '' + undefined would corrupt the join, so fall
    // back to '' per part rather than filtering the array.
    const parts = (candidate && candidate.content && candidate.content.parts) || [];
    const text = parts.map(p => p.text || '').join('');
    if (!text && data.promptFeedback && data.promptFeedback.blockReason) {
      throw new Error('blocked: ' + data.promptFeedback.blockReason);
    }
    if (candidate && candidate.finishReason === 'MAX_TOKENS' && retriesLeft > 0) {
      try {
        return await callGemini(system, messages, retriesLeft - 1);
      } catch (e) {
        return text;
      }
    }
    return text;
  }

  // Same as callGemini but streams the response via Gemini's SSE mode
  // (streamGenerateContent?alt=sse) so the narrative can be shown as it's
  // written instead of appearing all at once at the end. Falls back to the
  // non-streaming call transparently if streaming fails for any reason —
  // onChunk simply never fires in that case and the caller still gets the
  // complete text once it's done.
  async function callGeminiStreaming(system, messages, onChunk) {
    const response = await fetch(geminiEndpoint(geminiModel, 'streamGenerateContent') + '?alt=sse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': geminiApiKey },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: system }] },
        contents: toGeminiContents(messages),
        generationConfig: { maxOutputTokens: 2048 }
      })
    });
    if (!response.ok) {
      let data = null;
      try { data = await response.json(); } catch (e) { /* error body wasn't JSON */ }
      throwApiError(data);
    }
    if (!response.body || !response.body.getReader) throw new Error('no stream support');
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';
    let sawDelta = false;
    let outputTokens = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const dataStr = line.slice(5).trim();
        if (!dataStr) continue;
        try {
          const evt = JSON.parse(dataStr);
          const cand = evt.candidates && evt.candidates[0];
          const parts = cand && cand.content && cand.content.parts;
          if (parts) {
            let addedText = false;
            for (const p of parts) {
              if (p.text) {
                fullText += p.text;
                addedText = true;
              }
            }
            if (addedText) {
              sawDelta = true;
              onChunk(fullText);
            }
          }
          if (evt.usageMetadata) {
            // Each chunk's usageMetadata is the running total so far, not a
            // per-chunk delta — just keep the latest one, never sum these.
            outputTokens = evt.usageMetadata.candidatesTokenCount || outputTokens;
          }
        } catch (e) {
          // partial/malformed SSE fragment — skip it, next chunk will complete it
        }
      }
    }
    if (!sawDelta) throw new Error('no deltas received');
    usageAccumulatorRef.current.output += outputTokens;
    return fullText;
  }


  // ---- SYSTEM PROMPT BUILDERS ----
  function sharedContext(state) {
    const narrativeLanguage = uiLang === 'en' ? 'English' : 'Russian';
    const summarySection = narrativeSummaryRef.current
      ? `

  // or six times, on top of cutting five API round-trips down to one — see
  // generateStateAndEvents, which parses the one JSON blob this produces
  // back into the same per-concern shapes the old separate calls returned,
  // so nothing downstream of it had to change. Combat asks for a "tier"
  // rather than raw stat numbers now too (see ENEMY_TIERS/rollEnemyStatsForTier)

    const mapContext = mapNodes.length > 0
      ? `\n\nKNOWN LOCATIONS ON THE MAP SO FAR (for "location" and "travelOffer" below — if the hero is at, mentions, or is invited to one of these, reuse its name EXACTLY, character for character; do not create a near-duplicate with slightly different wording):\n${mapNodes.map(n => `- "${n.name}" (${n.kind}${n.faction ? ', controlled by: ' + n.faction : ''}${n.id === state.map.currentId ? ', hero is currently here' : ''})`).join('\n')}`

      ? `, "itemOffers": [{"groupId": "short_id", "selectionMode": "single", "items": [{"id": "short_id", "label": "item name as it appears in the scene, in the scene's own language", "slot": "weapon", "twoHanded": false}]}]`
      : '';
    const itemOffersSection = itemInteractionEnabled
      ? `

=== EVENT: ITEM OFFERS ===
"itemOffers" detects takeable items offered to the hero in THIS scene (a found object, something a character offers, a choice between alternatives like several weapons or garments) — extract them as structured data, or an empty list if none. Never create an entry here for plain currency/money — a purse, a handful of coins, a cash reward — even when it's offered alongside real items as one of the choices; leave money out of this list entirely and let it flow through "currencyChange" once the scene actually shows the hero taking it. "selectionMode" is "single" if the items in that group are alternatives where the hero can take at most one; "multi" if each item can be independently taken or left (including a single standalone item). Group items together only if presented as a related set (offered by the same character at the same moment, or explicit alternatives to each other) — unrelated items get separate groups. "id"/"groupId": short, lowercase, ascii, unique slugs. Every item needs a "slot": exactly one of "weapon", "armor", "helmet", "amulet", "gloves", "boots", "ring", "cloak", "backpack", "consumable", or "none" for anything else. "cloak" is an outer garment (cape, mantle); "backpack" is a worn container (bag, satchel, pack) — a separate slot from "cloak", the hero can wear both at once; "consumable" is single-use (potion, food, scroll). "twoHanded" is true only for a weapon needing both hands — omit or false otherwise, omit entirely for non-weapon items.`

    return `You are the game-state engine for a text role-playing game. You are not the narrator — never write prose, only the JSON described below. Given the scene that just happened, you both (A) return the full updated structured state and (B) detect any of several distinct kinds of moment the scene may contain.

"time" is ONLY the current in-story date/time of day, stated as plainly and briefly as possible (e.g. "Evening, third day since departure"). It must contain nothing but the date/time itself — no reasoning, no metaphors, no sensory or atmospheric description, no commentary on what is happening. Advance it plausibly based on what happened in the scene; it should change at least subtly turn to turn unless the scene explicitly covers no time passing.
