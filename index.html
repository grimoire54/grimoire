"psyche" is an integer from 1 to 1000 representing the hero's mental/spiritual fortitude — in settings with magic, this doubles as the hero's magical reserve (spend it on spellcasting, replenish it with rest). Use the same calibration as health: an ordinary person sits around 50, the hundreds are for truly exceptional willpower or magical power, and 1000 is reserved for a deity-tier being. Adjust it based on emotional strain, trauma, willpower, fear, or spellcasting.
"stats" has exactly three integers from 1 to 100: "strength", "agility", "intelligence" — the hero's innate physical and mental attributes. Calibration is DIFFERENT from health/psyche: an ordinary person's physical/mental attributes are NOT around 50 — they're modest, generally no higher than about 10, unless the world/hero description above explicitly establishes the hero as unusually strong, agile, or intelligent (only then can that specific attribute run meaningfully higher, scaled to how exceptional the description implies). Never default to 50 for these three out of habit. These represent lasting capability, not momentary condition, so change them rarely and only for a real reason (significant training, a crippling injury, a transformative event) — never fluctuate them scene to scene the way health/psyche do.
"effects" is a list of short phrases for the hero's current ongoing conditions — injuries, illnesses, poisons, curses, or similar lingering effects (e.g. "deep gash on the left arm", "mild poisoning", "cursed with rotten luck"). Add a new entry when the scene introduces one, and remove an entry once the scene resolves or heals it. This is separate from the health/psyche numbers — those track overall condition, this tracks what specifically is currently affecting the hero. Leave it as an empty list when nothing is currently affecting the hero.
Nothing else belongs in "stats" — no other attributes, skills, or invented characteristics.
Each "inventory" entry has a "name", a "slot", and (for weapons only) "twoHanded". "slot" must be exactly one of: "weapon", "armor", "helmet", "amulet", "gloves", "boots", "ring", "cloak", "backpack", "consumable", or "none" for anything else (a document, key, or valuable that's neither worn nor used up). "cloak" is an outer garment worn over the shoulders/back (a cape, mantle); "backpack" is specifically a worn container for carrying more (a bag, satchel, pack) — the hero can wear a cloak and a backpack at once, they are separate slots; "consumable" is anything single-use (a potion, food, a scroll). "twoHanded" is true only for a weapon that needs both hands (greatsword, longbow, staff, etc.) — omit or set false for a one-handed weapon, and omit entirely for non-weapon items.
Only include an item in "inventory" if the scene explicitly settles the hero as now possessing it — already carried over from before, explicitly handed over and accepted, explicitly picked up, or (opening scene only) established as starting kit. An item that was merely offered, noticed, or nearby but not yet resolved does NOT belong in "inventory" yet — leave it out rather than assuming the hero took it. Never include the hero's own currency here in any form — a purse, a pouch of coins, a stack of chits, a sum of cash — no matter how the scene describes receiving or carrying it; money is never an inventory item in this system, it is tracked ONLY through "currencyChange" below.
"currencyChange" reports ONLY what changed THIS turn for the hero's universal in-game currency — one field that exists identically in every setting regardless of genre (the narrative prose can call it gold, credits, shells, or whatever fits the world, but the tracked value underneath is always this same single field). "amount" is a signed integer: positive for a gain, negative for a loss, 0 (or omit the whole field) if nothing changed. This is a DELTA for the scene just played, NEVER the running total — the app adds it to what the hero already has, so restating the full sum is not just unnecessary but wrong. Only set a nonzero amount when the scene explicitly and concretely shows currency changing hands with a specific stated quantity — a payment received, a price paid, money found and picked up, a bribe or toll, winnings or a loss from a wager, an outright theft. Never estimate, round to a "plausible" figure, or invent an amount the scene didn't actually state; if the scene only vaguely gestures at wealth or poverty with no concrete number, leave this at 0. "reason" is a short, dry phrase for what happened (e.g. "sold the pelts", "paid for a room"), omitted along with the rest of the field when amount is 0.
"npcs" lists ONLY named characters who matter to the ongoing story — people the hero has met, spoken with, or who otherwise play an ongoing role (allies, quest givers, recurring figures, named rivals). Each entry has a "name", a short "note" on who they are or their relationship to the hero, and an "inventory" — a short list of item names for what they carry, wear, or are ever shown using (a weapon, a piece of armor, a distinctive belonging). This is for durable belongings only — never list a sum of money or a purse/pouch of coins as one of these entries, even if the scene mentions this character having or handling some; a character's wealth is flavor for their "note", not a trackable item. Each entry also has "presentNow": true only if this character is physically there with the hero, face to face, in the scene that was JUST played — set it false (or simply omit it) if they are elsewhere, merely mentioned, remembered, or reached at a distance, or otherwise absent from this specific turn even though they remain a tracked character; judge this fresh from the scene just played alone every time, never carried over from an earlier turn, so a character who was present last turn but doesn't reappear in this one is NOT presentNow. Each entry also has \"location\" — the name of the place this character is currently at, reusing an exact known location name from the map context above where possible, or the literal string \"with the hero\" if they are actively travelling alongside the hero right now (a companion, someone being escorted, someone giving active chase). A character is anchored to their last known \"location\" by default — carry it forward unchanged turn after turn, the same as inventory above — and change it ONLY when the scene itself clearly shows this character actually leaving for, or arriving at, somewhere else; never update it just because the hero moved on without them, and never drift it back to match wherever the hero happens to be. \"presentNow\" must stay consistent with this: it can only be true when \"location\" equals the hero's own current location this turn, or is \"with the hero\" — a character cannot be physically present with the hero while anchored to a different place. THE FIRST TIME a character is added to this list, invent a plausible, modest starting inventory fitting their role and the scene (a guard has a sidearm, a trader has wares and a knife, a beggar has nothing worth naming) — this becomes that character's FIXED belongings from now on; an empty list is fine for someone genuinely established as having nothing. On every later turn this character appears in, return their inventory EXACTLY as already established (it is in the current game state above) UNLESS the scene itself explicitly shows them gaining something (found, given, looted, bought) or losing something (dropped, stolen, destroyed, handed over) — only then update the list to reflect that specific change. A character must never produce, use, or lose an item that isn't already in their stored inventory, and must never conjure a new item out of nowhere — if the story needs them to have something new, that has to be shown happening on-scene first. If a character already tracked under a placeholder — a role or description like "the carter", "the guard captain" — has their real name revealed for the first time in this scene, rename that SAME entry to the real name (never add a second entry for the same person) and set "previousName" to exactly the old placeholder label as it appears in the state above; omit "previousName" every other turn, including every later turn about this now-named character. Keep each list short and skip mundane items with no narrative weight (ordinary clothing, pocket lint). Do NOT include monsters, beasts, or any anonymous combat opponent here, even if the scene names its species or gives it a description — a creature that exists only to be fought or fled from, with no ongoing role in the story beyond that encounter, is "factionReputationHits" is the same idea as "reputationHits" immediately above, but for a FACTION as a whole rather than one tracked person — reserve it for something the scene shows rising to the level of the group as an institution noticing and caring, not just the one individual on the receiving end. An insult traded with a single guard is a "reputationHits" entry for that guard, not automatically a hit against the whole legion he serves — only flag the faction too when the act is clearly directed at, done in the name of, or witnessed in a way that would credibly reach the faction as a whole (defying a direct order issued in the faction's name, sabotaging something that belongs to them collectively, publicly humiliating their authority, risking real danger to save several of their people at once, a notable public act of loyalty or generosity toward them as a group). Each entry has "faction" (exactly as tracked) and the same "type" values as above: "insult", "hostile", "kindness", "help". Just as rare as "reputationHits", if not rarer — leave it empty on the large majority of turns.
"location" tracks where the hero currently is, for a map the player can gradually explore. "current" is the name of the hero's present location — if it matches somewhere in the known list above, reuse that exact name (do not rename or rephrase it); only give a new name if this is genuinely a place the story hasn't visited before. "kind" is exactly one of "settlement", "wilderness", "dungeon", "landmark". "description" is one short evocative sentence — include it ONLY the first time this name appears (it's cached after that, so repeating it later is wasted). "questId" links this place to one of the active quest ids above ONLY when the scene establishes it as that quest's actual objective or destination — omit otherwise. "directionFromPrevious" is a rough compass heading (N, NE, E, SE, S, SW, W, or NW) from the hero's previous location to this one — needed only when "current" is a brand-new name. "nearbyMentioned" lists any OTHER named places the scene mentions as visible, nearby, or rumored but not currently occupied by the hero — each needs "name", "kind", "direction" (heading from the current location) and, first mention only, "description". Whenever this scene has a character name or clearly imply a specific place where a quest — new or already active — actually needs to be carried out, that place MUST be reported here (as "current" if the hero is already standing there, otherwise as an entry in "nearbyMentioned") with "questId" set to that quest's id, even if the hero's own position didn't change and nothing else about "location" would otherwise be worth reporting. Only omit "location" entirely on a turn where neither the hero's place changed nor any quest's destination was named. "faction" (on "current" and on each "nearbyMentioned" entry) is the name of whichever faction visibly controls or holds authority over that place — a garrison's banner, a guild's sign, whose law is enforced there — reusing an exact known faction name from the list below where possible; omit it for anywhere with no clear controlling faction (a lawless waystop, untouched wilderness). Once a place has a faction, it stays that faction's territory turn after turn — repeat the SAME value every time this place is reported as "current" (an omitted "faction" on a later turn leaves it unchanged, it does NOT clear it) and only give a genuinely different value the turn the story itself shows control actually changing hands (a conquest, a garrison driven out, a new authority moving in).
"factions" lists ONLY named GROUPS that matter to the ongoing story — a legion, guild, cult, noble house, gang, cartel, order, or anything else the story treats as acting with one will, never a whole nation or people. Skip anything mentioned only once in passing with no ongoing role. Each entry has a "name" and a short "note" — one sentence on what this group is, does, or wants. Include an entry here for EVERY faction referenced anywhere else this turn (as a "location.faction", a "nearbyMentioned[].faction", or an "npcs[].faction") the first time it's established, so the registry never falls out of sync with what's actually controlling places or backing characters. This field is returned in full each turn, the same as "npcs": carry forward existing entries that are still relevant (repeat them even if this specific scene doesn't touch them), and only add a "note" update when the scene genuinely reveals something new about them.

=== EVENT: NEW QUESTS AND REWARDS ===
"newQuestOffers"/"rewardOffers" each detect a distinct kind of moment, either of which may or may not be present: (1) a NEW quest being offered — a character proposing a task, asking for help, or pointing the hero toward some goal, where the scene's dialogue explicitly states a concrete reward (a specific sum, item, favor, or other tangible thing — never merely implied or left vague); only count it if the scene stops at the offer itself, not something the hero has already agreed to and is now acting on. If the scene has a character propose a task WITHOUT the dialogue stating a concrete reward, do not emit a newQuestOffers entry for it at all. (2) a REWARD being handed over for one of the hero's ACTIVE quests listed above, now that the scene shows it resolved and the giver following through on payment.
For "newQuestOffers.title": must NOT be a literal restatement of the dialogue — invent a short, evocative name the way a chapter title would read (e.g. if a character says "we're trapped in this cave, we need to find a way out", the title could be "Path to Freedom", not "Find a way out of the cave"). "description" is the opposite: plain and dry, not evocative — state the objective in one short sentence, the way a quest log entry would. No atmosphere, no flavor text there.
"id"/"questId": short, lowercase, ascii, unique slugs. "questId" must exactly match one of the active quest ids given above — never invent one, and never put a brand-new quest in "rewardOffers".
If this scene names a specific place where a quest must be carried out — a brand-new quest offered just now, or one already active — also report that place under this turn's "location" above (see its "questId" rule) so the map picks it up the moment the quest itself does.
Both arrays are usually empty — only include an entry when the scene clearly contains that kind of moment.

=== EVENT: TRAVEL OFFER ===
"travelOffer" detects whether the scene explicitly offers the hero the chance to travel to a specific place right now: a character proposing going somewhere together, a path or doorway presented as a choice to take right now, or the hero otherwise clearly invited to head to a specific named place — and the scene stops there, without the hero having already set off. Do NOT count a scene where the hero is already traveling, has already arrived, or where a place is merely mentioned in passing with no real choice being offered right now.
If no such offer is present: "travelOffer": null. If present: "travelOffer": {"id": "short_id", "label": "destination name as it appears in the scene", "kind": "settlement"}. "label": if this matches a known location above, reuse that exact name; otherwise use the name as the scene itself calls it. "kind" is exactly one of "settlement", "wilderness", "dungeon", "landmark". "id": short, lowercase, ascii, unique slug.

=== EVENT: COMBAT ===
"combat" detects whether the scene puts the hero into a hostile fight calling for turn-based combat right now — an enemy attacking the hero, or the hero clearly initiating violence against someone who will fight back — as opposed to mere tension, a threat, or an argument that hasn't turned physical. If several hostile enemies act together, represent them as a single combined opponent (e.g. "the bandits") with a tier reflecting the group as a whole — this system fights one named opponent at a time. If the scene shows a fight ending, being narrowly avoided, or resolved entirely in prose already, return {"combat": false} — this is only for a fight that is starting and still needs to be played out.
If no fight is starting: "combat": {"combat": false}.
If a fight is starting: "combat": {"combat": true, "enemyName": "short name or description as used in the scene", "enemyDescription": "very short phrase describing them", "weaponDescription": "short noun phrase for what they attack with", "tier": "average", "bodyParts": ["head", "torso", "leftArm", "rightArm", "leftLeg", "rightLeg"]}.
"enemyName" must be in ${narrativeLanguage}, matching how the scene refers to them. "weaponDescription" is a short noun phrase, in ${narrativeLanguage}, for whatever this opponent attacks with — e.g. "claws", "a rusty spear", "its tail", "bare fists" — a plain noun phrase, not a full sentence.
"tier" is exactly one of "weak", "average", "strong", "exceptional", "legendary" — a qualitative judgment of this opponent's overall combat capability, using the exact same calibration as the hero's own health/stats elsewhere: "average" is an ordinary person, "weak" is something below that (a small animal, someone unarmed or already hurt), "strong" is a trained/dangerous fighter or beast, "exceptional" is a powerful monster or elite combatant, "legendary" is reserved for a deity-tier being. Rate this honestly against what the story has actually established about the opponent — do not soften it toward something the hero is likely to beat.
"bodyParts" lists which of these six parts this specific opponent actually has: head, torso, leftArm, rightArm, leftLeg, rightLeg. A humanoid opponent normally has all six. A creature without human-like anatomy should list only what makes sense for its body — e.g. a slime or ooze might be just ["torso"], a snake might be ["head", "torso"]. Always include "torso" — every opponent has a central mass that can be struck.${itemOffersSection}

=== SUGGESTIONS ===
"suggestions" always has exactly 3 short, concrete, varied possible next actions the hero could take next — each no more than a short sentence. Always exactly 3, no matter what: even if the scene ends on an offered item, a question, or any other pause awaiting the player's choice — that pending choice (if any) is handled through the event fields above, so your 3 suggestions should be things the hero could do next regardless of how that choice resolves (talk to someone present, examine something, move on, ask a question), not a restatement of the choice itself.

All text inside these fields must be written in ${narrativeLanguage}, matching the story's language.`;

  async function generateNarrative(historyMessages, currentState) {

    // hasn't been folded into the summary yet would simply vanish from
    // context for a few turns. This keeps that window's actual size a
    // little elastic instead, so nothing the summary hasn't caught up to
    // yet is ever silently dropped.
    const windowSize = Math.max(RECENT_TURN_WINDOW, historyMessages.length - summarizedUpToRef.current);
    const apiMessages = historyMessages.slice(-windowSize).map(m => {
      let prefix = '';
      if (m.itemTag) prefix += m.itemTag + '\n\n';
      if (m.role === 'director') {
        return { role: 'user', content: prefix + "[DIRECTOR NOTE, not the hero's action or line]: " + m.text };

      return { role: m.role === 'player' ? 'user' : 'assistant', content: prefix + m.text };

    const justUsed = pendingJustUsedRef.current;
    pendingJustUsedRef.current = [];
    const justQuestEvents = pendingQuestEventsRef.current;
    pendingQuestEventsRef.current = [];
    const justTravelEvents = pendingTravelEventRef.current;
    pendingTravelEventRef.current = [];

      const text = await callGeminiStreaming(system, apiMessages, setStreamingText);
      if (text) return text;
    } catch (e) {
      if (e.code === 'rate_limit') throw e;
      // streaming unsupported or failed for some other reason — fall back to a normal call below
    }
    const text = await callGemini(system, apiMessages);
    if (!text) throw new Error(t('fallbackNarrative'));
    return text;

- Preserve concrete facts a game master must not contradict later: names, relationships, promises made, unresolved threads, locations, established world/plot facts.
- Drop atmospheric prose, exact dialogue wording, and minor color that won't matter to future scenes.
- Plain prose, no headings or lists.

${narrativeSummaryRef.current || '(none yet)'}

NEW EXCERPT TO FOLD IN:

    try {
      const updated = await callGemini(system, [{ role: 'user', content: userMsg }]);
      if (updated && updated.trim()) {
        narrativeSummaryRef.current = updated.trim();
        summarizedUpToRef.current = cutoff;
        saveGame(fullHistory, currentState);
      }
    } catch (e) {
      // best-effort — see comment above the function
    }
  }

  async function generateSecrets(narrativeText, currentState) {
    const raw = await callGemini(buildSecretsSystemPrompt(currentState), [{ role: 'user', content: 'Scene:\n\n' + narrativeText }]);
    const trimmed = (raw || '').trim();
    return /^\(none\)$/i.test(trimmed) ? '' : trimmed;
  }

  // Reads whatever the PRECEDING narrator turn offered and what the player
  // actually clicked ✓ on for it, keyed by lowercase label -> the slot/
  // twoHanded that were already established when the item was offered (see
  // the item-offers section of buildStateAndEventsSystemPrompt) — this is
  // the single source of truth for "was this item actually confirmed," so
  // generateStateAndEvents never has to trust its own guess about whether
  // something was taken.

  // ---- STATE EXTRACTION & RECONCILIATION (inventory, quests, map) ----
  function collectJustConfirmedItems(precedingNarrator) {
    const taken = new Map();
    if (!precedingNarrator || !precedingNarrator.itemOffers) return taken;
    const resolutions = precedingNarrator.itemResolutions || {};
    for (const group of precedingNarrator.itemOffers) {
      for (const offerItem of group.items) {
        if (resolutions[offerItem.id] === true) {
          taken.set(offerItem.label.trim().toLowerCase(), {
            label: offerItem.label.trim(),
            slot: EQUIPMENT_SLOT_TYPES.includes(offerItem.slot) ? offerItem.slot : 'none',
            twoHanded: offerItem.twoHanded === true
          });
        }
      }
    }
    return taken;
  }

  // generateStateAndEvents re-reads the whole scene fresh each turn, which means it
  // could in principle "notice" the hero holding something new purely from
  // its own reading of the prose — a found object mentioned in passing, or
  // the model quietly resolving an offer it was told to leave open. Items
  // cannot enter the inventory that way: anything new gets kept ONLY if it
  // was already in the inventory, or the player explicitly confirmed it via
  // an item offer (see collectJustConfirmedItems above). Anything else is
  // held back as a "surprise" for callGameMaster to turn into its own
  // confirmable offer instead of merging silently — this also covers a
  // scene where someone secretly plants something on the hero: the item
  // still surfaces, just as something to confirm/discard rather than an
  // unannounced inventory change. Only skipped for the opening turn, where
  // there is no prior inventory or offer to confirm against — starting kit
  // is established directly, as it always has been — and when the player
  // has turned item-interaction off entirely, in which case they've opted
  // out of confirmation and the model's inventory is trusted as before.
  function reconcileInventory(rawInventory, currentState, precedingNarrator, isOpeningTurn) {
    if (!itemInteractionEnabled || isOpeningTurn) {
      return { inventory: rawInventory, surpriseItems: [] };
    }
    const priorNames = new Set(currentState.inventory.map(it => it.name.trim().toLowerCase()));
    const justTaken = collectJustConfirmedItems(precedingNarrator);
    const inventory = [];
    const surpriseItems = [];
    const fulfilledTakenKeys = new Set();
    for (const it of rawInventory) {
      const key = it.name.trim().toLowerCase();
      if (priorNames.has(key)) { inventory.push(it); continue; }
      let matchedKey = justTaken.has(key) ? key : null;
      let info = justTaken.get(key);
      if (!info) {
        for (const [takenKey, takenInfo] of justTaken) {
          if (key.includes(takenKey) || takenKey.includes(key)) { info = takenInfo; matchedKey = takenKey; break; }
        }
      }
      if (info) {
        inventory.push({ name: it.name, slot: info.slot, twoHanded: info.twoHanded });
        fulfilledTakenKeys.add(matchedKey);
      } else {
        surpriseItems.push(it);
      }
    }
    // A player-confirmed item (✓ on an offer) is guaranteed to end up in
    // the inventory even if generateStateAndEvents's own read of the new scene
    // leaves it out entirely — that confirmation is the player's explicit
    // decision, not something a separate, independent read gets to
    // silently override by omission. Mirrors reconcileQuests below, which
    // has always worked this way for quest offers; inventory items didn't
    // get the same guarantee until now, which is exactly how a confirmed
    // item could previously vanish instead of appearing.
    for (const [key, info] of justTaken) {
      if (!fulfilledTakenKeys.has(key) && !priorNames.has(key)) {
        inventory.push({ name: info.label, slot: info.slot, twoHanded: info.twoHanded });
      }
    }
    return { inventory, surpriseItems };
  }

  // Mirrors collectJustConfirmedItems, for quest offers: which newQuestOffers
  // on the preceding narrator turn did the player actually accept (✓).
  function collectJustConfirmedQuests(precedingNarrator) {
    const confirmed = new Map();
    if (!precedingNarrator || !precedingNarrator.questOffers) return confirmed;
    const resolutions = precedingNarrator.questOfferResolutions || {};
    for (const offer of precedingNarrator.questOffers) {
      if (resolutions[offer.id] === true) {
        confirmed.set(offer.id, { title: offer.title, giver: offer.giver, reward: offer.reward, description: offer.description || '' });
      }
    }
    return confirmed;
  }

  // A quest enters gameState.quests ONLY through an explicitly-accepted
  // questOffer (see collectJustConfirmedQuests) — never because the state
  // model happened to mention one, mirroring reconcileInventory's rationale
  // exactly. Status progress on quests already active IS trusted from the
  // model (like inventory removal, resolving one isn't something that needs
  // player consent) and generates the reputation deltas the caller applies
  // via applyReputationDeltas. Unlike inventory, a quest the model simply
  // doesn't mention this turn stays exactly as it was rather than vanishing
  // — losing a tracked commitment to one forgetful extraction would be a
  // much worse failure mode than a stray inventory item.
  //
  // "log" is append-only and feeds the quest journal: a fresh "progress"
  // note from the state model (if any) is appended first, then a fixed,
  // translated tag if this turn is also the one that resolved the quest —
  // so the journal always ends on a clear completed/failed marker rather
  // than trailing off on whatever prose the model last reported.
  function reconcileQuests(rawQuests, currentState, precedingNarrator, isOpeningTurn) {
    if (isOpeningTurn) return { quests: [], reputationDeltas: {}, factionReputationDeltas: {} };
    const statusById = new Map(rawQuests.map(q => [q.id, q.status]));
    const progressById = new Map(rawQuests.map(q => [q.id, typeof q.progress === 'string' ? q.progress.trim() : '']));
    const reputationDeltas = {};
    const bumpReputation = (giver, delta) => {
      const key = giver.trim().toLowerCase();
      reputationDeltas[key] = (reputationDeltas[key] || 0) + delta;
    };
    // Parallel channel to bumpReputation above, at a smaller magnitude
    // (see the FACTION_QUEST_* constants) — only fires when the quest's
    // giver is a tracked NPC with a known faction (see findNpcFaction), so
    // a quest from someone with no faction tag simply doesn't ripple
    // anywhere beyond their own personal standing.
    const factionReputationDeltas = {};
    const bumpFactionReputation = (giver, delta) => {
      const faction = findNpcFaction(giver, currentState.npcs);
      if (!faction) return;
      const key = faction.trim().toLowerCase();
      factionReputationDeltas[key] = (factionReputationDeltas[key] || 0) + delta;
    };
    const quests = currentState.quests.map(prior => {
      const reportedStatus = statusById.get(prior.id);
      const status = QUEST_STATUSES.includes(reportedStatus) ? reportedStatus : prior.status;
      const newEntries = [];
      const progress = progressById.get(prior.id);
      if (progress) newEntries.push(progress);
      if (prior.status === 'active' && status === 'completed') {
        bumpReputation(prior.giver, QUEST_COMPLETE_REPUTATION_DELTA);
        bumpFactionReputation(prior.giver, FACTION_QUEST_COMPLETE_REPUTATION_DELTA);
        newEntries.push(t('questLogCompletedEntry'));
      } else if (prior.status === 'active' && status === 'failed') {
        bumpReputation(prior.giver, QUEST_FAIL_REPUTATION_DELTA);
        bumpFactionReputation(prior.giver, FACTION_QUEST_FAIL_REPUTATION_DELTA);
        newEntries.push(t('questLogFailedEntry'));
      }
      if (status === prior.status && newEntries.length === 0) return prior;
      return { ...prior, status, log: newEntries.length > 0 ? [...prior.log, ...newEntries] : prior.log };
    });
    const justConfirmed = collectJustConfirmedQuests(precedingNarrator);
    const priorIds = new Set(currentState.quests.map(q => q.id));
    for (const [offerId, info] of justConfirmed) {
      if (!priorIds.has(offerId)) {
        quests.push({ id: offerId, title: info.title, giver: info.giver, reward: info.reward, description: info.description, status: 'active', log: [t('questLogAcceptedEntry')] });
      }
    }
    return { quests, reputationDeltas, factionReputationDeltas };
  }

  // Sentinel "location" value for a character actively travelling
  // alongside the hero right now (a companion, an escort, active pursuit)
  // — see the npcs field rules in buildStateAndEventsSystemPrompt. Exempts
  // them from the "location must match the hero's own" check below, since
  // they move wherever the hero does rather than being anchored to one
  // named place.
  const NPC_WITH_HERO_LOCATION = 'with the hero';

  // Strips the transient "previousName" hint (see the npcs field rules in
  // buildStateAndEventsSystemPrompt) out of the persisted npcs list before it's
  // stored — that field only ever matters for the one turn a placeholder's
  // real name gets resolved, never as a lasting part of the schema — and
  // collects it separately as {from, to} pairs for migrateNpcReputations to
  // carry that character's already-tracked reputation over to their new
  // name instead of it silently resetting to DEFAULT_REPUTATION.
  //
  // Also owns "location": characters are anchored to wherever they were
  // last actually placed, carried forward here exactly like inventory
  // above whenever the model doesn't restate a change — and, regardless of
  // what the model reports for "presentNow", that flag is force-corrected
  // to false whenever this character's location doesn't match the hero's
  // own current location this turn (unless they're explicitly travelling
  // "with the hero"). This is what stops a character left behind in a
  // location the hero has since departed from lingering as "present" —
  // whether from the model simply forgetting to update them, or from a
  // map jump the narrative itself never got around to depicting.
  function reconcileNpcs(parsedNpcs, currentNpcs, currentLocationName) {
    if (!Array.isArray(parsedNpcs)) return { npcs: currentNpcs, renames: [] };
    const priorByName = new Map((currentNpcs || []).map(n => [n.name.trim().toLowerCase(), n]));
    const renames = [];
    const npcs = parsedNpcs.map(n => {
      if (!n || typeof n !== 'object') return n;
      const { previousName, ...rest } = n;
      const hasPreviousName = typeof previousName === 'string' && previousName.trim();
      if (
        hasPreviousName &&
        typeof n.name === 'string' && n.name.trim() &&
        previousName.trim().toLowerCase() !== n.name.trim().toLowerCase()
      ) {
        renames.push({ from: previousName.trim(), to: n.name.trim() });
      }
      const priorKey = (hasPreviousName ? previousName : (n.name || '')).trim().toLowerCase();
      const prior = priorByName.get(priorKey) || priorByName.get((n.name || '').trim().toLowerCase());
      const location = (typeof n.location === 'string' && n.location.trim())
        ? n.location.trim()
        : (prior && prior.location) || null;
      const isWithHero = typeof location === 'string' && location.toLowerCase() === NPC_WITH_HERO_LOCATION;
      // No known location for this character, or no known location for the
      // hero this turn, means there's nothing to check against — default
      // to trusting the model rather than blocking a legitimate character.
      const locationMatchesHero = !location || !currentLocationName || isWithHero ||
        location.toLowerCase() === currentLocationName.trim().toLowerCase();
      // Drives the gift-item link in the sheet (see CharacterSheet /
      // GiftItemModal) — coerced to a strict boolean exactly like twoHanded
      // above, so an unexpected value from the model, or its plain absence
      // on an npc carried over from an older save, reads as "not present"
      // rather than a stale truthy leftover.
      return { ...rest, location, presentNow: n.presentNow === true && locationMatchesHero };
    });
    return { npcs, renames };
  }

  // Case-insensitive substring lookup into a reconciled npcs list for the
  // faction a named character serves, if any and if known — used by
  // reconcileQuests to ripple a completed/failed quest's reputation effect
  // onto the giver's faction too, not just the giver personally. Same
  // matching style as resolveNpcReputationKey, applied to names instead of
  // dictionary keys.
  function findNpcFaction(name, npcs) {
    if (!Array.isArray(npcs) || !name) return null;
    const normalized = name.trim().toLowerCase();
    const match = npcs.find(n => n && typeof n.name === 'string' &&
      (n.name.trim().toLowerCase() === normalized || n.name.trim().toLowerCase().includes(normalized) || normalized.includes(n.name.trim().toLowerCase())));
    return (match && typeof match.faction === 'string' && match.faction.trim()) ? match.faction.trim() : null;
  }

  // "factions" mirrors "npcs" at a much simpler grain: named GROUPS that
  // matter to the story (a legion, guild, cult, noble house, gang) worth
  // tracking, each with just a "name" and a short descriptive "note" — no
  // inventory or single physical location, since a faction isn't one body
  // in one place the way an NPC is. Trusted directly from the model each
  // turn exactly like npcs' own name/note fields are (see reconcileNpcs) —
  // the model is instructed to restate the full list, carrying forward
  // whatever's still relevant. This is purely the descriptive registry;
  // the hero's actual STANDING with a faction lives in the separate
  // factionReputations state, mirroring how npcReputations sits apart from
  // the npcs list itself.
  function reconcileFactions(parsedFactions, currentFactions) {
    if (!Array.isArray(parsedFactions)) return currentFactions;
    return parsedFactions
      .filter(f => f && typeof f.name === 'string' && f.name.trim())
      .map(f => ({ name: f.name.trim(), note: typeof f.note === 'string' ? f.note.trim() : '' }));
  }

  // A separate, narrower channel from quest-driven reputation above: the
  // state model flags, per turn, whether the hero insulted or acted with
  // outright hostility toward a named character in the scene just played
  // (see "reputationHits" in buildStateAndEventsSystemPrompt). Exactly like quest
  // deltas, item rarity, and item weight, the MAGNITUDE is never trusted
  // from the model — only the category ("insult" vs "hostile"), which maps
  // here to a fixed constant, so a run can't be talked into an oversized
  // reputation swing by a dramatically-worded scene.
  const REPUTATION_HIT_DELTAS = { insult: INSULT_REPUTATION_DELTA, hostile: HOSTILE_ACT_REPUTATION_DELTA, kindness: KINDNESS_REPUTATION_DELTA, help: HELP_REPUTATION_DELTA };
  // Besides the per-NPC deltas, this also returns factionRippleDeltas — the
  // automatic FACTION_NPC_RIPPLE_RATIO ripple onto whichever faction each
  // affected NPC is tagged with, if any (see findNpcFaction and the
  // FACTION_NPC_RIPPLE_RATIO comment above for the full rationale). Needs
  // the current npcs list to resolve each hit's target to a faction tag.
  // turnIndex is the 1-based count of turns played including this one (see
  // callGameMaster, which derives it from buildTurns so a regenerated turn
  // always recomputes the exact same index it had originally). A "kindness"
  // hit only ever lands here if the target isn't still inside their
  // KINDNESS_REPUTATION_COOLDOWN_TURNS window from the last time they got
  // one — read from npcKindnessCooldowns, which the caller updates via
  // applyKindnessCooldowns for whichever keys come back in
  // kindnessCooldownNpcs below. A hit blocked by cooldown is dropped
  // entirely: no reputation delta, no faction ripple, and no change to the
  // cooldown record itself, exactly as if the model hadn't flagged it.
  function reconcileReputationHits(rawHits, isOpeningTurn, npcs, turnIndex) {
    const deltas = {};
    const factionRippleDeltas = {};
    const kindnessCooldownNpcs = new Set();
    if (isOpeningTurn || !Array.isArray(rawHits)) return { deltas, factionRippleDeltas, kindnessCooldownNpcs: [] };
    for (const hit of rawHits) {
      if (!hit || typeof hit.name !== 'string' || !hit.name.trim()) continue;
      const delta = REPUTATION_HIT_DELTAS[hit.type];
      if (!delta) continue;
      const key = hit.name.trim().toLowerCase();
      if (hit.type === 'kindness') {
        const lastGrantedTurn = npcKindnessCooldowns[key];
        if (typeof lastGrantedTurn === 'number' && turnIndex - lastGrantedTurn < KINDNESS_REPUTATION_COOLDOWN_TURNS) continue;
        kindnessCooldownNpcs.add(key);
      }
      deltas[key] = (deltas[key] || 0) + delta;
      const faction = findNpcFaction(hit.name, npcs);
      if (faction) {
        const factionKey = faction.trim().toLowerCase();
        const rippleDelta = Math.sign(delta) * Math.round(Math.abs(delta) * FACTION_NPC_RIPPLE_RATIO);
        if (rippleDelta !== 0) factionRippleDeltas[factionKey] = (factionRippleDeltas[factionKey] || 0) + rippleDelta;
      }
    }
    return { deltas, factionRippleDeltas, kindnessCooldownNpcs: [...kindnessCooldownNpcs] };
  }

  // Faction-level mirror of reconcileReputationHits immediately above, fed
  // by its own "factionReputationHits" field (see buildStateAndEventsSystemPrompt)
  // rather than derived from reputationHits — reserved for something the
  // model itself judges to be about the FACTION as an institution noticing
  // and caring, not tied to any one member. This runs ALONGSIDE, not
  // instead of, the automatic per-member ripple above — the two are
  // independent and additive, one requiring the model's narrative
  // judgment, the other requiring none at all. Same never-trust-the-magnitude
  // rule as its NPC counterpart, just at the smaller FACTION_* constants.
  const FACTION_REPUTATION_HIT_DELTAS = { insult: FACTION_INSULT_REPUTATION_DELTA, hostile: FACTION_HOSTILE_ACT_REPUTATION_DELTA, kindness: FACTION_KINDNESS_REPUTATION_DELTA, help: FACTION_HELP_REPUTATION_DELTA };
  function reconcileFactionReputationHits(rawHits, isOpeningTurn) {
    const deltas = {};
    if (isOpeningTurn || !Array.isArray(rawHits)) return deltas;
    for (const hit of rawHits) {
      if (!hit || typeof hit.faction !== 'string' || !hit.faction.trim()) continue;
      const delta = FACTION_REPUTATION_HIT_DELTAS[hit.type];
      if (!delta) continue;
      const key = hit.faction.trim().toLowerCase();
      deltas[key] = (deltas[key] || 0) + delta;
    }
    return deltas;
  }

  // Currency is tracked as a DELTA per turn, never a restated running total.
  // health/psyche work the other way (the model re-judges the full value
  // fresh each turn) because they're a holistic read of current condition;
  // a cumulative currency total is exactly the kind of number an LLM tends
  // to drift on across a long campaign, so the client owns the arithmetic
  // (same instinct as reconcileQuests's append-only "log") and the model
  // only ever has to judge what changed in the one scene just played.
  // Unlike reconcileReputationHits, the magnitude here IS trusted — a currency
  // amount has to vary far more than a fixed reputation nudge — but only
  // because buildStateAndEventsSystemPrompt requires a concrete, scene-
  // stated figure before the model may report anything nonzero at all.
  // Floored at 0: the hero can never carry negative currency.
  function reconcileCurrency(rawChange, currentState) {
    if (!rawChange || typeof rawChange !== 'object') return currentState.currency;
    const delta = Number(rawChange.amount);
    if (!Number.isFinite(delta) || delta === 0) return currentState.currency;
    return Math.max(0, currentState.currency + Math.round(delta));
  }

  // Parses the single combined JSON blob from buildStateAndEventsSystemPrompt
  // back into the exact same per-concern shapes the old generateStateAndEvents/
  // generateSuggestions/generateQuestOffers/generateCombatSetup/
  // generateTravelOffer/generateItemOffers each used to return on their own
  // — callGameMaster below assembles its final result from this exactly as
  // it used to assemble it from six separate Promise.all results, so no
  // downstream consumer of that result shape had to change.
  async function generateStateAndEvents(narrativeText, currentState, precedingNarrator, isOpeningTurn, turnIndex) {
    const raw = await callGemini(buildStateAndEventsSystemPrompt(currentState, itemInteractionEnabled), [{ role: 'user', content: 'Scene:\n\n' + narrativeText }]);
    const parsed = extractJsonObject(raw);
    if (!parsed) throw new Error('unparsable state/events response');

    // --- state (unchanged from the old generateStateAndEvents) ---
    const parsedStats = parsed.stats && typeof parsed.stats === 'object' && !Array.isArray(parsed.stats) ? parsed.stats : null;
    const rawInventory = Array.isArray(parsed.inventory) ? normalizeInventory(parsed.inventory) : currentState.inventory;
    const { inventory, surpriseItems } = reconcileInventory(rawInventory, currentState, precedingNarrator, isOpeningTurn);
    const currency = reconcileCurrency(parsed.currencyChange, currentState);
    const rawQuests = Array.isArray(parsed.quests) ? parsed.quests.filter(q => q && typeof q.id === 'string') : [];
    const { quests, reputationDeltas: questDeltas, factionReputationDeltas: questFactionDeltas } = reconcileQuests(rawQuests, currentState, precedingNarrator, isOpeningTurn);
    const { deltas: reputationHitDeltas, factionRippleDeltas: npcHitFactionRippleDeltas, kindnessCooldownNpcs } = reconcileReputationHits(parsed.reputationHits, isOpeningTurn, currentState.npcs, turnIndex);
    const reputationDeltas = { ...questDeltas };
    for (const key of Object.keys(reputationHitDeltas)) reputationDeltas[key] = (reputationDeltas[key] || 0) + reputationHitDeltas[key];
    const factionReputationHitDeltas = reconcileFactionReputationHits(parsed.factionReputationHits, isOpeningTurn);
    const factionReputationDeltas = { ...questFactionDeltas };
    for (const key of Object.keys(factionReputationHitDeltas)) factionReputationDeltas[key] = (factionReputationDeltas[key] || 0) + factionReputationHitDeltas[key];
    for (const key of Object.keys(npcHitFactionRippleDeltas)) factionReputationDeltas[key] = (factionReputationDeltas[key] || 0) + npcHitFactionRippleDeltas[key];
    // Resolved ahead of npcs below (rather than inline in the state object,
    // as it used to be) because reconcileNpcs needs to know the hero's
    // FINAL current location this turn — including a forced map jump from
    // applyPlayerChosenDestination that the narrative text itself might
    // not have depicted — to correctly decide who's actually still present.
    const map = revealActiveQuestNodes(
      applyPlayerChosenDestination(
        applyConfirmedTravel(reconcileMap(parsed.location, currentState), precedingNarrator, isOpeningTurn),
        pendingMapDestinationRef.current
      ),
      quests
    );
    const currentLocationName = (map.nodes.find(n => n.id === map.currentId) || {}).name || null;
    const { npcs, renames: npcRenames } = reconcileNpcs(parsed.npcs, currentState.npcs, currentLocationName);
    const state = {
      time: parsed.time || currentState.time,
      health: clampVital(parsed.health, currentState.health),
      psyche: clampVital(parsed.psyche, currentState.psyche),
      stats: {
        strength: clampStat(parsedStats && parsedStats.strength, currentState.stats.strength),
        agility: clampStat(parsedStats && parsedStats.agility, currentState.stats.agility),
        intelligence: clampStat(parsedStats && parsedStats.intelligence, currentState.stats.intelligence)
      },
      effects: Array.isArray(parsed.effects) ? parsed.effects : currentState.effects,
      inventory,
      currency,
      npcs,
      quests,
      map,
      factions: reconcileFactions(parsed.factions, currentState.factions)
    };
    // Consumed for this turn — see requestMapTravel/pendingMapDestinationRef.
    pendingMapDestinationRef.current = null;

    // --- suggestions (was generateSuggestions) ---
    const suggestionsRaw = Array.isArray(parsed.suggestions)
      ? parsed.suggestions.filter(s => typeof s === 'string' && s.trim()).slice(0, 3)
      : [];
    const suggestions = suggestionsRaw.length > 0 ? suggestionsRaw : (FALLBACK_SUGGESTIONS[uiLang] || FALLBACK_SUGGESTIONS.ru);

    // --- quest offers (was generateQuestOffers) ---
    const activeQuests = currentState.quests.filter(q => q.status === 'active');
    const activeIds = new Set(activeQuests.map(q => q.id));
    const randomSlug = () => Math.random().toString(36).slice(2, 8);
    const newOffersRaw = Array.isArray(parsed.newQuestOffers) ? parsed.newQuestOffers : [];
    const questOffers = newOffersRaw
      .filter(o => o && typeof o.title === 'string' && o.title.trim() && typeof o.giver === 'string' && o.giver.trim())
      .map(o => ({
        id: typeof o.id === 'string' && o.id.trim() ? o.id.trim() : 'quest-' + randomSlug(),
        title: o.title.trim(),
        giver: o.giver.trim(),
        reward: typeof o.reward === 'string' ? o.reward.trim() : '',
        advance: typeof o.advance === 'string' && o.advance.trim() ? o.advance.trim() : null,
        description: typeof o.description === 'string' ? o.description.trim() : ''
      }));
    const rewardOffersRaw = Array.isArray(parsed.rewardOffers) ? parsed.rewardOffers : [];
    const rewardOffers = rewardOffersRaw
      .filter(o => o && typeof o.questId === 'string' && activeIds.has(o.questId))
      .map(o => {
        const sourceQuest = activeQuests.find(q => q.id === o.questId);
        return {
          id: typeof o.id === 'string' && o.id.trim() ? o.id.trim() : 'reward-' + randomSlug(),
          questId: o.questId,
          giver: (typeof o.giver === 'string' && o.giver.trim()) ? o.giver.trim() : (sourceQuest ? sourceQuest.giver : ''),
          reward: typeof o.reward === 'string' ? o.reward.trim() : ''
        };
      });

    // --- travel offer (was generateTravelOffer) ---
    const travelRaw = parsed.travelOffer && typeof parsed.travelOffer === 'object' ? parsed.travelOffer : null;
    const travelOffer = (travelRaw && typeof travelRaw.label === 'string' && travelRaw.label.trim())
      ? {
          id: typeof travelRaw.id === 'string' && travelRaw.id.trim() ? travelRaw.id.trim() : 'travel-' + randomSlug(),
          label: travelRaw.label.trim(),
          kind: MAP_NODE_KINDS.includes(travelRaw.kind) ? travelRaw.kind : 'landmark'
        }
      : null;

    // --- combat (was generateCombatSetup — now tier-based, see ENEMY_TIERS) ---
    const combatRaw = parsed.combat && typeof parsed.combat === 'object' ? parsed.combat : null;
    let combatEncounter = null;
    if (combatRaw && combatRaw.combat) {
      const enemyName = typeof combatRaw.enemyName === 'string' && combatRaw.enemyName.trim()
        ? combatRaw.enemyName.trim()
        : (uiLang === 'en' ? 'Enemy' : 'Противник');
      const weaponDescription = typeof combatRaw.weaponDescription === 'string' && combatRaw.weaponDescription.trim()
        ? combatRaw.weaponDescription.trim()
        : t('combatUnarmedEnemyLabel');
      const tier = ENEMY_TIERS[combatRaw.tier] ? combatRaw.tier : 'average';
      const rolled = rollEnemyStatsForTier(tier);
      combatEncounter = {
        enemyName,
        enemyDescription: typeof combatRaw.enemyDescription === 'string' ? combatRaw.enemyDescription.trim() : '',
        weaponDescription,
        tier,
        totalHp: rolled.totalHp,
        power: rolled.power,
        precision: rolled.precision,
        bodyParts: normalizeEnemyBodyParts(combatRaw.bodyParts)
      };
    }

    // --- item offers (was generateItemOffers) ---
    const itemOffersRaw = itemInteractionEnabled && Array.isArray(parsed.itemOffers) ? parsed.itemOffers : [];
    const itemOffers = itemOffersRaw.map(group => ({
      ...group,
      items: group.items.map(item => ({
        ...item,
        slot: EQUIPMENT_SLOT_TYPES.includes(item.slot) ? item.slot : 'none',
        twoHanded: item.slot === 'weapon' && item.twoHanded === true,
        rarity: rollItemRarity()
      }))
    }));

    return { state, surpriseItems, reputationDeltas, factionReputationDeltas, npcRenames, kindnessCooldownNpcs, suggestions, questOffers, rewardOffers, travelOffer, combatEncounter, itemOffers };
  }

  // Returns null when nothing in the story could revive the hero (also the
  // safe fallback on any parsing/network failure — see tryResurrection,
  // which treats null the same as an honest "no" rather than retrying
  // silently). Otherwise returns the narrative passage and post-revival
  // health for tryResurrection to apply.
  async function generateResurrectionCheck(currentState) {
    const storyText = messages.filter(m => m.role === 'narrator').map(m => m.text).join('\n\n');
    const raw = await callGemini(buildResurrectionCheckSystemPrompt(currentState), [{ role: 'user', content: 'Full story so far, ending with the hero\'s death:\n\n' + storyText }]);
    const parsed = extractJsonObject(raw);
    if (!parsed || !parsed.canRevive) return null;
    return {
      resurrectionNarrative: typeof parsed.resurrectionNarrative === 'string' ? parsed.resurrectionNarrative.trim() : '',
      healthAfter: clampVital(parsed.healthAfter, 20)
    };
  }

  // Post-victory loot: asks the model what a just-defeated opponent was
  // plausibly carrying, using nothing but the encounter's own name/
  // description/weapon (no need for the recent narrative text — the fight
  // played out entirely in the combat modal, not in prose). Rarity is
  // rolled locally exactly like the item-offers section of
  // generateStateAndEvents does, EXCEPT here each
  // item also gets an independent ~40% chance of coming out "broken" —
  // picked up but useless, shown to the player as [junk] regardless of
  // whatever rarity it would have otherwise rolled. This is deliberately a
  // flat chance per item, separate from RARITY_TIERS' own 20%-weighted
  // "junk" rarity tier — the two can stack (a broken item still keeps
  // whatever cosmetic rarity color it would have had, visually flattened to
  // grey via the broken flag) but are conceptually different: one is "this
  // kind of item is inherently low-tier," the other is "this specific
  // corpse-looted copy didn't survive the fight intact."
  function buildCombatLootSystemPrompt(state, finalCombat) {
    const { narrativeLanguage } = sharedContext(state);
    return `You determine what a defeated enemy in a text role-playing game was carrying that the hero can search the body and take.

You will be given a short description of the enemy who was just defeated in combat. Suggest 0 to 4 plausible items they were carrying — worn gear, a weapon, or a small belonging fitting their description — that the hero could take now.

Respond with ONLY valid JSON and nothing else (no markdown, no text before or after):
{"items": [{"id": "short_id", "label": "item name, in ${narrativeLanguage}", "slot": "weapon", "twoHanded": false}]}

Rules:
- "id": short, lowercase, ascii, unique slug.
- Every item needs a "slot", classified immediately: exactly one of "weapon", "armor", "helmet", "amulet", "gloves", "boots", "ring", "cloak", "backpack", "consumable", or "none" for anything else (a small valuable, trinket, or document).
- "twoHanded" is true only for a weapon needing both hands — omit or set false otherwise, and omit entirely for non-weapon items.
- Keep it plausible and modest for what was actually described — an ordinary bandit shouldn't drop what a war-hardened knight would carry, and a mindless beast or ooze has nothing worth taking.
- If the enemy plausibly carried nothing worth taking, return {"items": []}.`;
  }

  const LOOT_BROKEN_CHANCE = 0.4;

  // A "weak" opponent (a small animal, someone unarmed or already down) is
  // exactly the case buildCombatLootSystemPrompt already tells the model to
  // usually return nothing for — so skip the round-trip entirely for that
  // tier rather than spend a whole call to very likely get {"items": []}
  // back. Every other tier still asks the model, since fitting, plausible
  // loot for a named opponent genuinely needs it to look at what that
  // opponent actually was.
  async function generateCombatLoot(finalCombat) {
    if (finalCombat.enemyTier === 'weak') return [];
    const enemyLine = `Defeated enemy: ${finalCombat.enemyName}${finalCombat.enemyDescription ? ' — ' + finalCombat.enemyDescription : ''}. Fought with: ${finalCombat.enemyWeapon}.`;
    const raw = await callGemini(buildCombatLootSystemPrompt(gameState, finalCombat), [{ role: 'user', content: enemyLine }]);
    const parsed = extractJsonObject(raw);
    const items = parsed && Array.isArray(parsed.items) ? parsed.items : [];
    return items
      .map((item, i) => {
        const label = typeof item.label === 'string' ? item.label.trim() : '';
        if (!label) return null;
        const broken = Math.random() < LOOT_BROKEN_CHANCE;
        return {
          id: typeof item.id === 'string' && item.id.trim() ? item.id.trim() : 'loot_' + i,
          label,
          slot: EQUIPMENT_SLOT_TYPES.includes(item.slot) ? item.slot : 'none',
          twoHanded: item.slot === 'weapon' && item.twoHanded === true,
          broken,
          rarity: broken ? 'junk' : rollItemRarity()
        };
      })
      .filter(Boolean);
  }

  // Quest offers, reward offers, and the travel offer are now detected as
  // part of the single combined call — see buildStateAndEventsSystemPrompt/
  // generateStateAndEvents above. Both still need the same explicit ✓/✗
  // confirmation items get (see QuestOffers/toggleQuestOffer/toggleRewardOffer)
  // so nothing about quests, their payment, or where the hero travels gets
  // decided by the model on its own.

  // Turns items generateStateAndEvents held back (see reconcileInventory)
  // into an ordinary multi-select offer, so the ✓/✗ UI is the only path a
  // new item ever actually takes into the inventory.

  // ---- SURPRISE ITEMS & REPUTATION DELTA HELPERS ----
  function buildSurpriseOfferGroup(surpriseItems) {
    if (!surpriseItems || surpriseItems.length === 0) return null;
    const stamp = Date.now();
    return {
      groupId: 'surprise-' + stamp,
      selectionMode: 'multi',
      items: surpriseItems.map((it, i) => ({
        id: 'surprise-' + stamp + '-' + i,
        label: it.name,
        slot: it.slot,
        twoHanded: it.twoHanded,
        rarity: rollItemRarity()
      }))
    };
  }

  // Applies the reputation deltas generateStateAndEvents computed from quest
  // status transitions this turn (see reconcileQuests) — kept as a separate
  // step from generateStateAndEvents itself so that function stays pure/
  // side-effect-free, consistent with reconcileInventory.
  function applyReputationDeltas(deltas) {
    if (!deltas || Object.keys(deltas).length === 0) return;
    setNpcReputations(prev => {
      const next = { ...prev };
      for (const [key, delta] of Object.entries(deltas)) {
        const current = typeof next[key] === 'number' ? next[key] : DEFAULT_REPUTATION;
        next[key] = clampReputation(current + delta);
      }
      return next;
    });
  }

  // When generateStateAndEvents reports a {from, to} rename (a placeholder like "the
  // carter" resolved to a real name — see reconcileNpcs/buildStateAndEventsSystemPrompt),
  // gameState.npcs already reflects the new name on its own (the whole list
  // is replaced wholesale each turn), but npcReputations is a SEPARATE map
  // still keyed under the old label — left alone, it would silently reset to
  // DEFAULT_REPUTATION the moment nothing matches the new name anymore. This
  // relocates that tracked value once, right when the rename happens, using
  // the exact same loose matching findNpcReputation reads it back with.
  function migrateNpcReputations(renames) {
    if (!renames || renames.length === 0) return;
    setNpcReputations(prev => {
      let next = prev;
      for (const { from, to } of renames) {
        const oldKey = resolveNpcReputationKey(from, next);
        if (oldKey === null) continue;
        const newKey = to.trim().toLowerCase();
        if (!newKey || newKey === oldKey || typeof next[newKey] === 'number') continue;
        if (next === prev) next = { ...prev };
        next[newKey] = next[oldKey];
        delete next[oldKey];
      }
      return next;
    });
  }

  // Mirrors migrateNpcReputations immediately above, for the exact same
  // reason: npcKindnessCooldowns is its own map keyed by name, so left
  // alone a rename would silently lose track of when a character last got
  // a kindness-driven bump, quietly lifting their cooldown the moment
  // their real name is learned.
  function migrateNpcKindnessCooldowns(renames) {
    if (!renames || renames.length === 0) return;
    setNpcKindnessCooldowns(prev => {
      let next = prev;
      for (const { from, to } of renames) {
        const oldKey = resolveNpcReputationKey(from, next);
        if (oldKey === null) continue;
        const newKey = to.trim().toLowerCase();
        if (!newKey || newKey === oldKey || typeof next[newKey] === 'number') continue;
        if (next === prev) next = { ...prev };
        next[newKey] = next[oldKey];
        delete next[oldKey];
      }
      return next;
    });
  }

  // Regenerating a turn re-derives gameState/messages entirely fresh (both
  // get fully replaced each turn, so a second attempt naturally "forgets"
  // the first) — but npcReputations only ever accumulates via +/- deltas
  // (see applyReputationDeltas above), so without this, regenerating a
  // turn that completed a quest would stack that reputation bonus again on
  // top of what the turn's first telling already added, every time it's
  // regenerated. Reverses exactly what the turn being replaced actually
  // applied (see appliedReputationDeltas, stored on every narrator
  // message) before the fresh result's own deltas go on — see both
  // regenerateTurn and regenerateTurnWithEdits.
  function undoReputationDeltas(deltas) {
    if (!deltas || Object.keys(deltas).length === 0) return;
    const negated = {};
    for (const [key, delta] of Object.entries(deltas)) negated[key] = -delta;
    applyReputationDeltas(negated);
  }

  // Records, for each character reconcileReputationHits just granted a
  // kindness-driven gain to, the turn index that grant happened on — this
  // is exactly what reconcileReputationHits' own cooldown check (see
  // KINDNESS_REPUTATION_COOLDOWN_TURNS) reads back on every later turn.
  function applyKindnessCooldowns(npcKeys, turnIndex) {
    if (!npcKeys || npcKeys.length === 0) return;
    setNpcKindnessCooldowns(prev => {
      const next = { ...prev };
      for (const key of npcKeys) next[key] = turnIndex;
      return next;
    });
  }

  // Mirrors undoReputationDeltas above: regenerating a turn re-rolls it from
  // scratch, so a kindness cooldown that exact turn set has to be released
  // again before the fresh attempt runs — otherwise a turn that already
  // granted a character's kindness bump once would find that same character
  // still "on cooldown" from itself the moment it's retold, since a
  // regenerated turn always recomputes the identical turnIndex it had the
  // first time (see callGameMaster). Only clears an entry that still
  // matches the turn being undone, so an unrelated, later grant for the
  // same character — recorded on a turn that isn't the one being undone —
  // is never clobbered.
  function undoKindnessCooldowns(npcKeys, turnIndex) {
    if (!npcKeys || npcKeys.length === 0 || typeof turnIndex !== 'number') return;
    setNpcKindnessCooldowns(prev => {
      let next = prev;
      for (const key of npcKeys) {
        if (prev[key] === turnIndex) {
          if (next === prev) next = { ...prev };
          delete next[key];
        }
      }
      return next;
    });
  }

  // Faction mirrors of applyReputationDeltas/undoReputationDeltas immediately
  // above — same rationale, same shape, just against factionReputations/
  // clampFactionReputation/FACTION_DEFAULT_REPUTATION instead.
  function applyFactionReputationDeltas(deltas) {
    if (!deltas || Object.keys(deltas).length === 0) return;
    setFactionReputations(prev => {
      const next = { ...prev };
      for (const [key, delta] of Object.entries(deltas)) {
        const current = typeof next[key] === 'number' ? next[key] : FACTION_DEFAULT_REPUTATION;
        next[key] = clampFactionReputation(current + delta);
      }
      return next;
    });
  }

  function undoFactionReputationDeltas(deltas) {
    if (!deltas || Object.keys(deltas).length === 0) return;
    const negated = {};
    for (const [key, delta] of Object.entries(deltas)) negated[key] = -delta;
    applyFactionReputationDeltas(negated);
  }

  // Wraps one of the parallel per-turn sub-calls (secrets, state, quest
  // offers, suggestions, combat setup, item offers — see callGameMaster)
  // with a single retry specifically on rate-limit/overload. These five or
  // six all fire concurrently every turn, on top of the narrative call that
  // already just finished — a transient 429/"overloaded" response is far
  // more likely here than for a single sequential call, and unlike
  // generateNarrative (which surfaces a rate-limit error to the player so
  // they can just retry the turn) each of these has its own silent
  // fallback, so a dropped request here was invisible: suggestions would
  // quietly repeat the same static fallback text turn after turn, and a
  // quest ✓ offered in the original telling of a turn could silently fail
  // to reappear after a regenerate even though the new narrative still
  // offers it — not because the story changed, but because this specific
  // sub-call happened to lose the race that turn. One retry after a short
  // delay clears the vast majority of those without meaningfully slowing
  // the turn down; anything else (or a second failure) still falls through
  // to the caller's own fallback exactly as before.

  // ---- TURN ORCHESTRATION — ties generation, extraction, and offers into one turn ----
  async function withRateLimitRetry(fn) {
    try {
      return await fn();
    } catch (e) {
      if (e && e.code === 'rate_limit') {
        await new Promise(resolve => setTimeout(resolve, 1200));
        return fn();
      }
      throw e;
    }
  }

  // If the combined extraction call fails outright (unparsable JSON, a
  // dropped request even after withRateLimitRetry), we fall back to leaving
  // state as it was — EXCEPT for a confirmed travel offer. The player
  // already committed to that destination the moment they hit ✓ on the
  // TravelOffer widget, so it must still land even when this turn's own
  // read of the scene failed — the same guarantee applyConfirmedTravel
  // already gives the successful path, just extended to the failure path
  // too. Without this, a single flaky/oversized JSON response would
  // silently erase an accepted trip with no error shown to the player.
  const EMPTY_STATE_AND_EVENTS_FALLBACK = (currentState, precedingNarrator, isOpeningTurn) => ({
    state: {
      ...currentState,
      map: revealActiveQuestNodes(applyConfirmedTravel(currentState.map, precedingNarrator, isOpeningTurn), currentState.quests)
    },
    surpriseItems: [], reputationDeltas: {}, npcRenames: [], kindnessCooldownNpcs: [],
    suggestions: FALLBACK_SUGGESTIONS[uiLang] || FALLBACK_SUGGESTIONS.ru,
    questOffers: [], rewardOffers: [], travelOffer: null, combatEncounter: null, itemOffers: []
  });

  // Only two calls per turn now: the narrative itself, then secrets and the
  // combined state/events extraction in parallel (both only need the
  // narrative text, not each other) — see generateStateAndEvents for what
  // used to be five separate requests here.
  async function callGameMaster(historyMessages, currentState, isOpeningTurn) {
    usageAccumulatorRef.current = { output: 0 };
    // buildTurns(historyMessages).length is how many complete turns already
    // precede this one, so +1 is this turn's own 1-based index. historyMessages
    // is exactly what a regenerate truncates back to (see regenerateTurn/
    // regenerateTurnWithEdits), so re-generating a turn always recomputes
    // this identical number — which is what lets undoKindnessCooldowns below
    // reverse a kindness cooldown precisely, rather than guessing at it.
    const turnIndex = buildTurns(historyMessages).length + 1;
    const narrative = await generateNarrative(historyMessages, currentState);
    const precedingNarrator = [...historyMessages].reverse().find(m => m.role === 'narrator') || null;
    const [secrets, combined] = await Promise.all([
      withRateLimitRetry(() => generateSecrets(narrative, currentState)).catch(() => ''),
      withRateLimitRetry(() => generateStateAndEvents(narrative, currentState, precedingNarrator, isOpeningTurn, turnIndex)).catch(() => EMPTY_STATE_AND_EVENTS_FALLBACK(currentState, precedingNarrator, isOpeningTurn))
    ]);
    const tokenUsage = usageAccumulatorRef.current.output;
    const declaredOffers = combined.itemOffers;
    // A "surprise" item might also have its own proper declared offer this
    // same turn (same combined read of the scene) — if so, drop the
    // duplicate rather than showing the same item twice with two separate
    // ✓/✗ controls.
    const declaredLabels = [];
    for (const g of declaredOffers) for (const it of g.items) declaredLabels.push(it.label.trim().toLowerCase());
    const dedupedSurprises = (combined.surpriseItems || []).filter(it => {
      const key = it.name.trim().toLowerCase();
      return !declaredLabels.some(label => key.includes(label) || label.includes(key));
    });
    const surpriseGroup = buildSurpriseOfferGroup(dedupedSurprises);
    return {
      narrative,
      secrets,
      state: combined.state,
      suggestions: combined.suggestions,
      itemOffers: surpriseGroup ? [...declaredOffers, surpriseGroup] : declaredOffers,
      questOffers: combined.questOffers,
      rewardOffers: combined.rewardOffers,
      travelOffer: combined.travelOffer,
      reputationDeltas: combined.reputationDeltas || {},
      npcRenames: combined.npcRenames || [],
      kindnessCooldownNpcs: combined.kindnessCooldownNpcs || [],
      turnIndex,
      combatEncounter: combined.combatEncounter,
      tokenUsage
    };
  }

  // Builds the hidden context tag summarizing what the player decided about
  // any items offered on the immediately preceding narrator turn, so the
  // next scene can reflect the outcome without the item being re-litigated.

  // ---- OFFER RESOLUTION HANDLERS — item / quest / travel toggles ----
  function buildItemResolutionTag(precedingNarrator) {
    if (!precedingNarrator || !precedingNarrator.itemOffers || precedingNarrator.itemOffers.length === 0) return '';
    const resolutions = precedingNarrator.itemResolutions || {};
    const lines = [];
    for (const group of precedingNarrator.itemOffers) {
      for (const item of group.items) {
        lines.push(`${item.label}: ${resolutions[item.id] ? 'taken' : 'declined'}`);
      }
    }
    return lines.length ? '[ITEM DECISIONS FROM PREVIOUS TURN]: ' + lines.join('; ') : '';
  }

  function getUnresolvedItemOffers() {
    if (!itemInteractionEnabled) return [];
    const last = messages[messages.length - 1];
    if (!last || last.role !== 'narrator' || !last.itemOffers || last.itemOffers.length === 0) return [];
    const resolutions = last.itemResolutions || {};
    const unresolved = [];
    for (const group of last.itemOffers) {
      for (const item of group.items) {
        if (resolutions[item.id] === undefined) unresolved.push(item);
      }
    }
    return unresolved;
  }

  function toggleItemSelection(narratorIndex, groupId, itemId, selectionMode, takeValue) {
    const narratorMsg = messages[narratorIndex];
    let takenItem = null;
    if (takeValue === true && narratorMsg && narratorMsg.itemOffers) {
      const sourceGroup = narratorMsg.itemOffers.find(g => g.groupId === groupId);
      takenItem = sourceGroup && sourceGroup.items.find(it => it.id === itemId);
    }
    setMessages(prev => prev.map((m, i) => {
      if (i !== narratorIndex) return m;
      const resolutions = { ...(m.itemResolutions || {}) };
      if (selectionMode === 'single') {
        const group = m.itemOffers.find(g => g.groupId === groupId);
        if (group) group.items.forEach(it => { resolutions[it.id] = false; });
      }
      resolutions[itemId] = takeValue;
      return { ...m, itemResolutions: resolutions };
    }));
    if (takenItem && takenItem.rarity) {
      const key = takenItem.label.trim().toLowerCase();
      setItemRarities(prev => ({ ...prev, [key]: takenItem.rarity }));
    }
  }

  // Mirrors getUnresolvedItemOffers, but NOT gated by itemInteractionEnabled
  // — a quest is enough of a commitment that confirming it shouldn't depend
  // on the item-pickup convenience toggle. An advance only counts as
  // unresolved once its quest was actually accepted; declining the quest
  // makes the advance moot rather than something that blocks sending.
  function getUnresolvedQuestOffers() {
    const last = messages[messages.length - 1];
    if (!last || last.role !== 'narrator') return [];
    const unresolved = [];
    const questRes = last.questOfferResolutions || {};
    const advanceRes = last.advanceResolutions || {};
    const rewardRes = last.rewardResolutions || {};
    if (last.questOffers) {
      for (const offer of last.questOffers) {
        if (questRes[offer.id] === undefined) { unresolved.push({ label: offer.title }); continue; }
        if (questRes[offer.id] === true && offer.advance && advanceRes[offer.id] === undefined) {
          unresolved.push({ label: offer.title });
        }
      }
    }
    if (last.rewardOffers) {
      for (const offer of last.rewardOffers) {
        if (rewardRes[offer.id] === undefined) unresolved.push({ label: offer.reward });
      }
    }
    return unresolved;
  }

  // Mirrors getUnresolvedQuestOffers — a travel offer is enough of a
  // commitment (it decides where the hero ends up) that it needs an
  // explicit choice before another action can be sent, same as a quest.
  function getUnresolvedTravelOffer() {
    const last = messages[messages.length - 1];
    if (!last || last.role !== 'narrator' || !last.travelOffer) return [];
    if (last.travelOfferResolution !== undefined) return [];
    return [{ label: last.travelOffer.label }];
  }

  // Accept/decline an offer to travel somewhere right now. Doesn't move the
  // hero directly — that's applyConfirmedTravel, reading this resolution
  // back next turn — just records the choice and notes it for the
  // narrator's context on the next turn (see pendingTravelEventRef), the
  // same way toggleQuestOffer works for quests.
  function toggleTravelOffer(narratorIndex, accept) {
    const narratorMsg = messages[narratorIndex];
    const offer = narratorMsg && narratorMsg.travelOffer;
    setMessages(prev => prev.map((m, i) => (i === narratorIndex ? { ...m, travelOfferResolution: accept } : m)));
    if (offer) {
      const note = (accept ? 'decided to travel to "' : 'decided not to travel to "') + offer.label + '"' + (accept ? '' : ' and stayed put');
      if (!pendingTravelEventRef.current.includes(note)) pendingTravelEventRef.current = [...pendingTravelEventRef.current, note];
    }
  }

  // Queues a player-picked trip to an adjacent, already-discovered map node
  // (see MapModal — the travel button there only ever appears for a node
  // in the current location's own "connections" list) for the NEXT turn.
  // Unlike toggleTravelOffer above, this isn't the model proposing
  // somewhere to go — the player picked it directly off the map — so
  // besides queuing the same narrative-context note (for the journey to be
  // narrated), it also stashes the destination id in
  // pendingMapDestinationRef so generateStateAndEvents can force
  // map.currentId there once the turn resolves, regardless of how the
  // scene's own prose happens to describe arrival.
  function requestMapTravel(node) {
    const note = `decided to set out for "${node.name}" right now`;
    // Switching targets while a different trip is already queued: drop that
    // earlier note first, otherwise both would sit in the queue together
    // and the narrator would see two conflicting destinations next turn.
    if (pendingMapTravel && pendingMapTravel.note !== note) {
      pendingTravelEventRef.current = pendingTravelEventRef.current.filter(n => n !== pendingMapTravel.note);
    }
    pendingMapDestinationRef.current = node.id;
    setPendingMapTravel({ id: node.id, name: node.name, note });
    if (!pendingTravelEventRef.current.includes(note)) pendingTravelEventRef.current = [...pendingTravelEventRef.current, note];
  }

  // Cancels a still-unsent queued map trip. Only meaningful before the next
  // action goes out — once sendBatch/handleSend fires, the note has already
  // been read (and cleared) by generateNarrative, so there's nothing left
  // to pull back.
  function cancelMapTravel() {
    if (pendingMapTravel) {
      pendingTravelEventRef.current = pendingTravelEventRef.current.filter(n => n !== pendingMapTravel.note);
    }
    pendingMapDestinationRef.current = null;
    setPendingMapTravel(null);
  }

  // Accept/decline a new quest offer. The quest itself isn't added to
  // gameState.quests here — that only happens via reconcileQuests reading
  // this resolution back next turn (mirrors toggleItemSelection/inventory
  // exactly). Just records the choice and, either way, notes it for the
  // narrator's context on the next turn (see pendingQuestEventsRef).
  function toggleQuestOffer(narratorIndex, offerId, accept) {
    const narratorMsg = messages[narratorIndex];
    const offer = narratorMsg && narratorMsg.questOffers && narratorMsg.questOffers.find(o => o.id === offerId);
    setMessages(prev => prev.map((m, i) => {
      if (i !== narratorIndex) return m;
      const resolutions = { ...(m.questOfferResolutions || {}) };
      resolutions[offerId] = accept;
      return { ...m, questOfferResolutions: resolutions };
    }));
    if (offer) {
      const note = (accept ? 'accepted the quest "' : 'declined the quest "') + offer.title + '" from ' + offer.giver;
      if (!pendingQuestEventsRef.current.includes(note)) pendingQuestEventsRef.current = [...pendingQuestEventsRef.current, note];
    }
  }

  // Accept/decline an advance offered alongside an accepted quest. Purely
  // a narrative commitment — if the advance is a tangible item, it flows
  // through the ordinary item-offer pipeline separately once the narrator
  // reflects the handoff; this just records the choice as context for that.
  function toggleAdvanceOffer(narratorIndex, offerId, accept) {
    const narratorMsg = messages[narratorIndex];
    const offer = narratorMsg && narratorMsg.questOffers && narratorMsg.questOffers.find(o => o.id === offerId);
    setMessages(prev => prev.map((m, i) => {
      if (i !== narratorIndex) return m;
      const resolutions = { ...(m.advanceResolutions || {}) };
      resolutions[offerId] = accept;
      return { ...m, advanceResolutions: resolutions };
    }));
    if (offer) {
      const note = (accept ? 'accepted the advance for "' : 'declined the advance for "') + offer.title + '"';
      if (!pendingQuestEventsRef.current.includes(note)) pendingQuestEventsRef.current = [...pendingQuestEventsRef.current, note];
    }
  }

  // Accept/decline the material reward for an already-completed quest.
  // Declining it is the one reputation effect that's immediate rather than
  // routed through reconcileQuests — it's a direct, unambiguous consequence
  // of the player's own click, not something that needs the model's read on
  // a scene, so it's applied here on the spot (same rationale as caching an
  // item's rarity immediately in toggleItemSelection above).
  function toggleRewardOffer(narratorIndex, offerId, accept) {
    const narratorMsg = messages[narratorIndex];
    const offer = narratorMsg && narratorMsg.rewardOffers && narratorMsg.rewardOffers.find(o => o.id === offerId);
    setMessages(prev => prev.map((m, i) => {
      if (i !== narratorIndex) return m;
      const resolutions = { ...(m.rewardResolutions || {}) };
      resolutions[offerId] = accept;
      return { ...m, rewardResolutions: resolutions };
    }));
    if (offer) {
      const note = (accept ? 'accepted the reward ("' : 'declined the reward ("') + offer.reward + '") for a completed quest' + (accept ? '' : ' — declined out of generosity');
      if (!pendingQuestEventsRef.current.includes(note)) pendingQuestEventsRef.current = [...pendingQuestEventsRef.current, note];
      if (accept === false) {
        applyReputationDeltas({ [offer.giver.trim().toLowerCase()]: QUEST_REWARD_DECLINE_BONUS });
        const giverFaction = findNpcFaction(offer.giver, gameState.npcs);
        if (giverFaction) {
          applyFactionReputationDeltas({ [giverFaction.trim().toLowerCase()]: FACTION_QUEST_REWARD_DECLINE_BONUS });
        }
      }
    }
  }

  // Whether weaponRight currently holds a two-handed weapon — if so,
