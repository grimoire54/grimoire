<script>
  // Minimal localStorage-backed stand-in for the window.storage API that
  // Claude.ai artifacts provide. grimoire.jsx was written against that
  // interface (await window.storage.get/set/delete/list(key, shared)), so
  // this keeps every existing call working unchanged now that the app runs
  // as a plain website with no platform bridge behind it. Matches the real
  // API's behavior of throwing on a missing key rather than resolving to
  // null, since that's what the app's own try/catch blocks around every
  // read already expect. Everything stays local to this browser — nothing
  // here talks to a server.
    (function () {
      var PREFIX = 'grimoire:';
      window.storage = {
        get: function (key, shared) {
          return Promise.resolve().then(function () {
            var raw = localStorage.getItem(PREFIX + key);
            if (raw === null) throw new Error('storage key not found: ' + key);
            return { key: key, value: raw, shared: !!shared };
          });
        },
        set: function (key, value, shared) {
          return Promise.resolve().then(function () {
            localStorage.setItem(PREFIX + key, value);
            return { key: key, value: value, shared: !!shared };
          });
        },
        delete: function (key, shared) {
          return Promise.resolve().then(function () {
            localStorage.removeItem(PREFIX + key);
            return { key: key, deleted: true, shared: !!shared };
          });
        },
        list: function (prefix, shared) {
          return Promise.resolve().then(function () {
            var keys = [];
            var wanted = PREFIX + (prefix || '');
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && k.indexOf(wanted) === 0) keys.push(k.slice(PREFIX.length));
            }
            return { keys: keys, prefix: prefix, shared: !!shared };
          });
        }
      };
    })();
</script>

// ==============================================================================
// GAME STATE — schema, defaults, normalization
// ==============================================================================
const EMPTY_STATE = {
  time: '',
  health: 50,
  psyche: 50,
  stats: { strength: 10, agility: 10, intelligence: 10 },
  effects: [],
  inventory: [],
  currency: 0,
  npcs: [],
  quests: [],
  map: { nodes: [], currentId: null, visitedEdges: [] },
  factions: []
};

function clampStat(value, fallback) {
  const n = Number(value);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(1, Math.min(100, Math.round(n)));
}

function clampVital(value, fallback) {
  const n = Number(value);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(1, Math.min(1000, Math.round(n)));
}

// Unlike clampStat/clampVital, deliberately no upper bound — a long
// campaign's hero (or a dragon's hoard) should be able to accumulate
// currency without an arbitrary code-imposed ceiling. Floored at 0 since
// the hero can never carry negative currency.
function clampCurrency(value, fallback) {
  const n = Number(value);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(0, Math.round(n));
}

// Valid equipment slot types a state-tracked inventory item can carry.
// "none" covers ordinary non-equippable items (potions, keys, documents,
// quest items, etc.) as well as anything the model didn't classify.
const EQUIPMENT_SLOT_TYPES = ['weapon', 'armor', 'helmet', 'amulet', 'gloves', 'boots', 'ring', 'cloak', 'backpack', 'consumable', 'none'];

// Generic, filter/sort-facing label per item slot type — deliberately
// separate from EQUIPMENT_SLOT_CONFIG's labelKeys, which name a specific
// equip SLOT ("Weapon (right hand)") rather than the item TYPE ("Weapons")
// the inventory filter groups by.
const ITEM_SLOT_LABEL_KEYS = {
  weapon: 'itemSlotWeapon', armor: 'itemSlotArmor', helmet: 'itemSlotHelmet',
  amulet: 'itemSlotAmulet', gloves: 'itemSlotGloves', boots: 'itemSlotBoots',
  ring: 'itemSlotRing', cloak: 'itemSlotCloak', backpack: 'itemSlotBackpack',
  consumable: 'itemSlotConsumable', none: 'itemSlotNone'
};

// Accepts either the current {name, slot, twoHanded} shape or a bare string
// (an older save, or a state reply that skipped the object shape) so an
// unexpected shape degrades to a plain non-equippable item instead of
// getting dropped or crashing the sheet.
function normalizeInventoryItem(raw) {
  if (typeof raw === 'string') {
    return raw.trim() ? { name: raw.trim(), slot: 'none', twoHanded: false } : null;
  }
  if (!raw || typeof raw !== 'object' || typeof raw.name !== 'string' || !raw.name.trim()) return null;
  const slot = EQUIPMENT_SLOT_TYPES.includes(raw.slot) ? raw.slot : 'none';
  return { name: raw.name.trim(), slot, twoHanded: slot === 'weapon' && raw.twoHanded === true };
}

function normalizeInventory(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map(normalizeInventoryItem).filter(Boolean);
}

const QUEST_STATUSES = ['active', 'completed', 'failed'];

// A quest as tracked client-side once accepted (see reconcileQuests) —
// deliberately NOT the same shape as a questOffer: title/giver/reward/
// description are fixed at acceptance time and never re-guessed by the
// state model later. "log" is a short, dry, append-only trail of what's
// happened on this quest so far (see reconcileQuests/buildStateAndEventsSystemPrompt),
// used by the quest journal — never re-guessed or rewritten either, only
// appended to.
function normalizeQuest(raw) {
  if (!raw || typeof raw !== 'object' || typeof raw.id !== 'string' || !raw.id.trim()) return null;
  if (typeof raw.title !== 'string' || !raw.title.trim()) return null;
  if (typeof raw.giver !== 'string' || !raw.giver.trim()) return null;
  return {
    id: raw.id.trim(),
    title: raw.title.trim(),
    giver: raw.giver.trim(),
    reward: typeof raw.reward === 'string' ? raw.reward.trim() : '',
    description: typeof raw.description === 'string' ? raw.description.trim() : '',
    status: QUEST_STATUSES.includes(raw.status) ? raw.status : 'active',
    log: Array.isArray(raw.log) ? raw.log.filter(e => typeof e === 'string' && e.trim()).map(e => e.trim()) : []
  };
}

function normalizeQuests(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map(normalizeQuest).filter(Boolean);
}

const MAP_NODE_KINDS = ['settlement', 'wilderness', 'dungeon', 'landmark'];
const MAP_DIRECTION_VECTORS = {
  N: [0, -1], NE: [1, -1], E: [1, 0], SE: [1, 1],
  S: [0, 1], SW: [-1, 1], W: [-1, 0], NW: [-1, -1]
};

// Node identity/position is entirely client-owned — the state model is
// only ever trusted with a rough compass heading (see buildStateAndEventsSystemPrompt),
// never exact coordinates, because asking a model for stable pixel/grid
// coordinates turn after turn drifts and overlaps. slugifyMapId turns a
// reported name into a stable id, and findFreeGridCell walks outward from
// the anchor node on an integer grid until it lands on an empty cell, so
// the same sequence of turns always lays out the same way on reload.
function slugifyMapId(name, existingIds) {
  const base = name.trim().toLowerCase().replace(/[^a-z0-9а-яё]+/gi, '-').replace(/^-+|-+$/g, '') || 'loc';
  let id = base, n = 2;
  while (existingIds.has(id)) { id = `${base}-${n}`; n += 1; }
  return id;
}

function findFreeGridCell(fromGx, fromGy, direction, occupied) {
  const vec = MAP_DIRECTION_VECTORS[direction] || MAP_DIRECTION_VECTORS.E;
  for (let step = 1; step <= 12; step += 1) {
    const gx = fromGx + vec[0] * step;
    const gy = fromGy + vec[1] * step;
    if (!occupied.has(`${gx},${gy}`)) return { gx, gy };
  }
  return { gx: fromGx + vec[0] * 12, gy: fromGy + vec[1] * 12 };
}

function normalizeMapNode(raw) {
  if (!raw || typeof raw !== 'object' || typeof raw.id !== 'string' || !raw.id.trim()) return null;
  if (typeof raw.name !== 'string' || !raw.name.trim()) return null;
  return {
    id: raw.id.trim(),
    name: raw.name.trim(),
    kind: MAP_NODE_KINDS.includes(raw.kind) ? raw.kind : 'landmark',
    gx: Number.isFinite(raw.gx) ? raw.gx : 0,
    gy: Number.isFinite(raw.gy) ? raw.gy : 0,
    discovered: raw.discovered === true,
    questId: typeof raw.questId === 'string' && raw.questId.trim() ? raw.questId.trim() : null,
    description: typeof raw.description === 'string' ? raw.description : '',
    connections: Array.isArray(raw.connections) ? raw.connections.filter(c => typeof c === 'string') : [],
    // The faction/group that controls or holds authority over this
    // location, if any — see reconcileMap's upsert for how this gets set
    // and updated, and FACTION REPUTATION below for what reads it. null
    // (no faction) rather than '' so a falsy check reads cleanly everywhere.
    faction: typeof raw.faction === 'string' && raw.faction.trim() ? raw.faction.trim() : null
  };
}

function normalizeMapState(raw) {
  if (!raw || typeof raw !== 'object') return { nodes: [], currentId: null, visitedEdges: [] };
  const nodes = Array.isArray(raw.nodes) ? raw.nodes.map(normalizeMapNode).filter(Boolean) : [];
  const ids = new Set(nodes.map(n => n.id));
  return {
    nodes,
    currentId: typeof raw.currentId === 'string' && ids.has(raw.currentId) ? raw.currentId : (nodes[0] ? nodes[0].id : null),
    visitedEdges: Array.isArray(raw.visitedEdges)
      ? raw.visitedEdges.filter(e => Array.isArray(e) && e.length === 2 && ids.has(e[0]) && ids.has(e[1]))
      : []
  };
}

// Mirrors reconcileQuests's philosophy exactly: the state model reports
// what it currently sees (the hero's location, and any other named places
// just mentioned), but node identity, grid position, and the "discovered"
// history are all owned here — a forgetful model mentioning an existing
// place again should never spawn a duplicate node or lose what's already
// been revealed. A location the model doesn't mention this turn simply
// stays exactly as it was, same as an unmentioned quest.
function reconcileMap(rawLocation, currentState) {
  const prior = currentState.map || { nodes: [], currentId: null, visitedEdges: [] };
  if (!rawLocation || typeof rawLocation !== 'object' || typeof rawLocation.current !== 'string' || !rawLocation.current.trim()) {
    return prior;
  }
  const nodes = prior.nodes.map(n => ({ ...n, connections: [...n.connections] }));
  const byName = name => nodes.find(n => n.name.trim().toLowerCase() === name.trim().toLowerCase());
  const existingIds = new Set(nodes.map(n => n.id));
  const occupied = new Set(nodes.map(n => `${n.gx},${n.gy}`));
  const priorCurrent = prior.currentId ? nodes.find(n => n.id === prior.currentId) : null;

  // "faction" is deliberately handled differently from "description": a
  // description is locked in on first mention (cheap, never re-litigated),
  // but a location's controlling faction can genuinely change hands over
  // the course of a campaign (conquest, a garrison driven out), so a fresh
  // non-empty value here OVERWRITES whatever was there before rather than
  // only filling an empty slot. Omitting it (the model not re-stating
  // faction control on a turn that isn't about that) leaves the existing
  // value untouched either way — this is what turns "every location this
  // faction controls" into an emergent region, without a separate rigid
  // region hierarchy: standing with one faction reads the same everywhere
  // they hold ground, and that ground can shift over the story.
  function upsert(name, kind, description, questId, direction, fromNode, faction) {
    const existing = byName(name);
    if (existing) {
      if (!existing.description && description) existing.description = description;
      if (questId && !existing.questId) existing.questId = questId;
      if (typeof faction === 'string' && faction.trim()) existing.faction = faction.trim();
      return existing;
    }
    const id = slugifyMapId(name, existingIds);
    existingIds.add(id);
    const anchor = fromNode || { gx: 0, gy: 0 };
    const { gx, gy } = (nodes.length === 0 && !fromNode) ? { gx: 0, gy: 0 } : findFreeGridCell(anchor.gx, anchor.gy, direction, occupied);
    occupied.add(`${gx},${gy}`);
    const node = { id, name: name.trim(), kind: MAP_NODE_KINDS.includes(kind) ? kind : 'landmark', gx, gy, discovered: false, questId: questId || null, description: description || '', connections: [], faction: (typeof faction === 'string' && faction.trim()) ? faction.trim() : null };
    nodes.push(node);
    return node;
  }

  const currentNode = upsert(rawLocation.current, rawLocation.kind, rawLocation.description, rawLocation.questId, rawLocation.directionFromPrevious, priorCurrent, rawLocation.faction);
  currentNode.discovered = true;

  const visitedEdges = prior.visitedEdges.map(e => [...e]);
  if (priorCurrent && priorCurrent.id !== currentNode.id) {
    if (!priorCurrent.connections.includes(currentNode.id)) priorCurrent.connections.push(currentNode.id);
    if (!currentNode.connections.includes(priorCurrent.id)) currentNode.connections.push(priorCurrent.id);
    const alreadyWalked = visitedEdges.some(([a, b]) => (a === priorCurrent.id && b === currentNode.id) || (a === currentNode.id && b === priorCurrent.id));
    if (!alreadyWalked) visitedEdges.push([priorCurrent.id, currentNode.id]);
  }

  const nearby = Array.isArray(rawLocation.nearbyMentioned) ? rawLocation.nearbyMentioned : [];
  for (const spot of nearby) {
    if (!spot || typeof spot.name !== 'string' || !spot.name.trim()) continue;
    const node = upsert(spot.name, spot.kind, spot.description, spot.questId, spot.direction, currentNode, spot.faction);
    if (!node.connections.includes(currentNode.id)) node.connections.push(currentNode.id);
    if (!currentNode.connections.includes(node.id)) currentNode.connections.push(node.id);
  }

  return { nodes, currentId: currentNode.id, visitedEdges };
}

// Guarantees an explicitly-accepted travel offer (✓ on the TravelOffer
// widget — see toggleTravelOffer) actually moves the hero on the map, the
// same way collectJustConfirmedItems/collectJustConfirmedQuests guarantee
// their own confirmed choices even when this turn's own independent read
// of the scene (reconcileMap, above, driven by "location" in the state
// response) didn't happen to land on the same place — e.g. the narrator
// mentioned the arrival only in passing. Reuses reconcileMap's own
// name-matching/upsert conventions so a destination that's already a known
// node is reused rather than duplicated.
function applyConfirmedTravel(mapState, precedingNarrator, isOpeningTurn) {
  if (isOpeningTurn || !precedingNarrator || !precedingNarrator.travelOffer) return mapState;
  if (precedingNarrator.travelOfferResolution !== true) return mapState;
  const offer = precedingNarrator.travelOffer;
  const nodes = mapState.nodes.map(n => ({ ...n, connections: [...n.connections] }));
  const byName = name => nodes.find(n => n.name.trim().toLowerCase() === name.trim().toLowerCase());
  const priorCurrent = mapState.currentId ? nodes.find(n => n.id === mapState.currentId) : null;
  let destination = byName(offer.label);
  if (!destination) {
    const existingIds = new Set(nodes.map(n => n.id));
    const occupied = new Set(nodes.map(n => `${n.gx},${n.gy}`));
    const anchor = priorCurrent || { gx: 0, gy: 0 };
    const { gx, gy } = nodes.length === 0 ? { gx: 0, gy: 0 } : findFreeGridCell(anchor.gx, anchor.gy, 'E', occupied);
    destination = { id: slugifyMapId(offer.label, existingIds), name: offer.label, kind: MAP_NODE_KINDS.includes(offer.kind) ? offer.kind : 'landmark', gx, gy, discovered: false, questId: null, description: '', connections: [], faction: null };
    nodes.push(destination);
  }
  destination.discovered = true;
  const visitedEdges = mapState.visitedEdges.map(e => [...e]);
  if (priorCurrent && priorCurrent.id !== destination.id) {
    if (!priorCurrent.connections.includes(destination.id)) priorCurrent.connections.push(destination.id);
    if (!destination.connections.includes(priorCurrent.id)) destination.connections.push(priorCurrent.id);
    const alreadyWalked = visitedEdges.some(([a, b]) => (a === priorCurrent.id && b === destination.id) || (a === destination.id && b === priorCurrent.id));
    if (!alreadyWalked) visitedEdges.push([priorCurrent.id, destination.id]);
  }
  return { nodes, currentId: destination.id, visitedEdges };
}

// Force-applies a trip the player picked directly on the map (see
// requestMapTravel/pendingMapDestinationRef) rather than one the model
// proposed. Unlike applyConfirmedTravel above, there's no name-matching or
// new-node creation to do here — the map only ever offers a trip to a node
// that's already discovered AND already listed in the current node's own
// "connections" (i.e. adjacent), so the destination is guaranteed to
// already exist and already be linked. This just moves the current-position
// pointer and marks that edge walked, guaranteeing the hero actually arrives
// even if the scene's own prose was vague or silent about the journey.
function applyPlayerChosenDestination(mapState, destinationId) {
  if (!destinationId) return mapState;
  const destination = mapState.nodes.find(n => n.id === destinationId);
  if (!destination || mapState.currentId === destinationId) return mapState;
  const priorCurrent = mapState.nodes.find(n => n.id === mapState.currentId);
  const visitedEdges = mapState.visitedEdges.map(e => [...e]);
  if (priorCurrent) {
    const alreadyWalked = visitedEdges.some(([a, b]) => (a === priorCurrent.id && b === destinationId) || (a === destinationId && b === priorCurrent.id));
    if (!alreadyWalked) visitedEdges.push([priorCurrent.id, destinationId]);
  }
  const nodes = mapState.nodes.map(n => (n.id === destinationId ? { ...n, discovered: true } : n));
  return { ...mapState, nodes, currentId: destinationId, visitedEdges };
}

// Guarantees a quest's objective is actually visible on the map the
// instant the quest itself becomes active, rather than leaving it behind
// the map-wide fog-of-war (a node's own "discovered" flag, set by
// reconcileMap only once the hero has physically stood there). Fog is the
// right default for genuinely unexplored terrain, but once a quest names
// its destination, making the player stumble onto it in person defeats
// the point of a journal entry that already promises them a place — so
// any node carrying an active quest's id is force-revealed here, every
// turn, regardless of whether the state model happened to mark
// "discovered" (or even re-mention the place) this particular turn. Same
// "don't rely on the model to keep re-asserting something already true"
// spirit as reconcileQuests never re-guessing a quest's own title.
function revealActiveQuestNodes(mapState, quests) {
  const activeQuestIds = new Set(quests.filter(q => q.status === 'active').map(q => q.id));
  if (activeQuestIds.size === 0) return mapState;
  let changed = false;
  const nodes = mapState.nodes.map(n => {
    if (n.discovered || !n.questId || !activeQuestIds.has(n.questId)) return n;
    changed = true;
    return { ...n, discovered: true };
  });
  return changed ? { ...mapState, nodes } : mapState;
}


// A save made before the stats/health/psyche schema changed (free-text
// health, an arbitrary array of stats) would otherwise crash the sheet on
// load — e.g. gameState.effects.length throwing on an old save with no
// "effects" field at all. Loading always routes through this so an old save
// degrades gracefully (falling back to defaults for whatever doesn't fit
// the current shape) instead of breaking the app; the very next turn's
// state extraction re-establishes real numbers regardless.
function normalizeGameState(raw) {
  if (!raw || typeof raw !== 'object') return EMPTY_STATE;
  const rawStats = raw.stats && typeof raw.stats === 'object' && !Array.isArray(raw.stats) ? raw.stats : null;
  return {
    time: typeof raw.time === 'string' ? raw.time : '',
    health: clampVital(raw.health, EMPTY_STATE.health),
    psyche: clampVital(raw.psyche, EMPTY_STATE.psyche),
    stats: {
      strength: clampStat(rawStats && rawStats.strength, EMPTY_STATE.stats.strength),
      agility: clampStat(rawStats && rawStats.agility, EMPTY_STATE.stats.agility),
      intelligence: clampStat(rawStats && rawStats.intelligence, EMPTY_STATE.stats.intelligence)
    },
    effects: Array.isArray(raw.effects) ? raw.effects : [],
    inventory: normalizeInventory(raw.inventory),
    currency: clampCurrency(raw.currency, EMPTY_STATE.currency),
    npcs: Array.isArray(raw.npcs) ? raw.npcs : [],
    quests: normalizeQuests(raw.quests),
    map: normalizeMapState(raw.map),
    factions: normalizeFactions(raw.factions)
  };
}

// Mirrors npcs' own looseness: a name is required, "note" defaults to empty
// rather than dropping the entry, so a save from before this field existed
// (or a turn where the model's note came back malformed) degrades to a
// bare named entry instead of vanishing.
function normalizeFactions(raw) {
  if (!Array.isArray(raw)) return [];
  return raw
    .filter(f => f && typeof f.name === 'string' && f.name.trim())
    .map(f => ({ name: f.name.trim(), note: typeof f.note === 'string' ? f.note.trim() : '' }));
}

// ==============================================================================
// STORAGE KEYS & SESSION CONSTANTS
// ==============================================================================
const LANG_KEY = 'grimoire-ui-lang';
const ITEM_TOGGLE_KEY = 'grimoire-item-interaction';
const EDIT_WARNING_SKIP_KEY = 'grimoire-skip-edit-warning';
const GIFT_CONFIRM_SKIP_KEY = 'grimoire-skip-gift-confirm';
const SAVE_KEY = 'grimoire-save';
const API_KEY_STORAGE_KEY = 'grimoire-gemini-api-key';
const MODEL_STORAGE_KEY = 'grimoire-gemini-model';
const DEFAULT_GEMINI_MODEL = 'gemini-2.5-flash';
const MAX_UPLOAD_CHARS = 30000;
// How many recent history entries (player actions, director notes, narrator
// replies) get sent to the narrator model verbatim each turn. Every turn
// re-sends this whole slice as billed input tokens, so an unbounded log
// would get slower and pricier deep into a long campaign — that's the real
// reason for a cap, not the model's context window (Gemini's is large
// enough that this limit isn't anywhere close to it). Anything older than
// this window isn't just dropped: updateNarrativeSummary folds it into
// narrativeSummary (see sharedContext) so established facts survive past
// the window even though verbatim wording doesn't.
const RECENT_TURN_WINDOW = 40;
// How many messages must age past RECENT_TURN_WINDOW before
// updateNarrativeSummary actually spends a call folding them in — see the
// comment on that function. generateNarrative's own slice always covers
// everything back to summarizedUpToRef regardless of this, so batching this
// never drops content; it only means the "recent" slice sent to the
// narrator temporarily runs a little past RECENT_TURN_WINDOW while a batch
// is pending, shrinking back down right after each summary update lands.
const SUMMARY_BATCH_SIZE = 10;
const SAVE_PREFIX = 'GRIMOIRE-SAVE-v1:';
const SAVE_PREFIX_V2 = 'GRIMOIRE-SAVE-v2:';
const OPENING_TRIGGER = 'Begin the story: describe the setup and the first scene, and introduce the hero into the world.';

// Used whenever the "suggestions" field of generateStateAndEvents comes back
// empty for any reason (a
// parse failure the repair couldn't recover, an empty/short model reply, or
// the call failing outright) — the 3-suggestions row should never be empty,
// even in scenes that pause on an item offer or otherwise trail off.

// ==============================================================================
// FALLBACK CONTENT — used when a model call comes back empty
// ==============================================================================
const FALLBACK_SUGGESTIONS = {
  ru: ['Осмотреться внимательнее', 'Продолжить путь', 'Заговорить с тем, кто рядом'],
  en: ['Look around more closely', 'Move on', 'Talk to whoever is nearby']
};

// Item rarity tiers — a foundation for a future quest/reward system. Colors
// and odds are fixed here in code rather than left to the model, so the
// actual chances stay exactly what's specified below regardless of how any
// given scene is narrated. Rolled once per offered item at the moment it's
// introduced (see rollItemRarity), independent of whether the hero ends up
// taking it. Weights are percentages out of 100 — keep them summing to 100
// if adjusting.

// ==============================================================================
// ITEM ECONOMY — rarity, weight, carry capacity, healing
// ==============================================================================
const RARITY_TIERS = [
  { key: 'junk', color: '#9ca3af', weight: 20 },     // серый — хлам
  { key: 'common', color: '#e7e5e4', weight: 45 },   // белый — обычный
  { key: 'uncommon', color: '#4ade80', weight: 25 }, // зелёный — необычный
  { key: 'rare', color: '#60a5fa', weight: 7 },      // синий — редкий
  { key: 'unique', color: '#c084fc', weight: 2 },    // фиолетовый — уникальный
  { key: 'epic', color: '#f87171', weight: 0.7 },    // красный — эпический
  { key: 'mythic', color: '#fb923c', weight: 0.3 }   // оранжевый — мифический
];

function rollItemRarity() {
  const roll = Math.random() * 100;
  let cumulative = 0;
  for (const tier of RARITY_TIERS) {
    cumulative += tier.weight;
    if (roll < cumulative) return tier.key;
  }
  return RARITY_TIERS[RARITY_TIERS.length - 1].key;
}

// Starting kit gets its rarity rolled through this restricted pool instead
// of rollItemRarity — a fresh hero showing up already carrying something
// rare-or-better (the ~9% combined chance rollItemRarity would allow)
// undermines the point of those tiers being special finds rather than a
// starting-kit coin flip, and the opening narrative rule already keeps the
// prose itself to "plainly ordinary" gear — this keeps the mechanical
// rarity tag honest to that same promise. See handleStart, which seeds
// itemRarities with this for every opening-turn item before the general
// catch-up effect (using the unrestricted roll) ever sees them.
const STARTING_RARITY_TIERS = RARITY_TIERS.filter(t => ['junk', 'common', 'uncommon'].includes(t.key));
function rollStartingItemRarity() {
  const totalWeight = STARTING_RARITY_TIERS.reduce((sum, t) => sum + t.weight, 0);
  let roll = Math.random() * totalWeight;
  for (const tier of STARTING_RARITY_TIERS) {
    roll -= tier.weight;
    if (roll <= 0) return tier.key;
  }
  return STARTING_RARITY_TIERS[STARTING_RARITY_TIERS.length - 1].key;
}

// Enemy combat tiers — mirrors RARITY_TIERS' philosophy: the model only ever
// has to make a qualitative judgment call (which tier this opponent fits,
// given what the scene established about them), and the actual numbers are
// rolled locally from a fixed range. This is what lets combat setup ask for
// one word ("tier") instead of three separately-calibrated integers, cutting
// both the instructions the model needs and the output it has to produce.
// Ranges follow the exact same calibration buildStateAndEventsSystemPrompt
// uses for the hero's own health/stats: an ordinary person is "average",
// hundreds are reserved for genuinely superior combatants, 1000 is deity-tier.
const ENEMY_TIERS = {
  weak: { hp: [10, 34], power: [3, 6], precision: [3, 6] },
  average: { hp: [35, 69], power: [7, 13], precision: [7, 13] },
  strong: { hp: [70, 149], power: [14, 24], precision: [14, 24] },
  exceptional: { hp: [150, 399], power: [25, 54], precision: [25, 54] },
  legendary: { hp: [400, 1000], power: [55, 100], precision: [55, 100] }
};
function rollEnemyStatsForTier(tierKey) {
  const tier = ENEMY_TIERS[tierKey] || ENEMY_TIERS.average;
  const rollRange = ([min, max]) => Math.round(min + Math.random() * (max - min));
  return { totalHp: rollRange(tier.hp), power: rollRange(tier.power), precision: rollRange(tier.precision) };
}

function rarityColor(key) {
  const tier = RARITY_TIERS.find(tr => tr.key === key);
  return tier ? tier.color : null;
}

// The state-tracking model re-derives the inventory as plain prose-based
// strings each turn (see generateStateAndEvents) rather than referencing the original
// offer's exact id/label, so a taken item's rarity (recorded by label, see
// toggleItemSelection) is matched back onto inventory entries with a loose,
// case-insensitive substring check rather than an exact key lookup — good
// enough for this early version of the system without over-engineering a
// full text-matching layer.
// After the opening scene generates a starting inventory, auto-fill the
// paper-doll equipment slots from it (one item per wearable slot type,
// the first matching weapon into the right hand only — see the dual-wield
// rule on weaponLeft). Purely a convenience for turn one; nothing here
// stops the player from re-equipping afterward.
function autoEquipStartingGear(inventory) {
  const next = { ...EMPTY_EQUIPMENT };
  const used = new Set();
  const singleSlotKeys = [
    ['cloak', 'cloak'], ['backpack', 'backpack'], ['helmet', 'helmet'], ['amulet', 'amulet'],
    ['armor', 'armor'], ['gloves', 'gloves'], ['boots', 'boots']
  ];
  for (const [slotType, slotKey] of singleSlotKeys) {
    const found = inventory.find(it => it.slot === slotType && !used.has(it.name));
    if (found) { next[slotKey] = found.name; used.add(found.name); }
  }
  const weapon = inventory.find(it => it.slot === 'weapon' && !used.has(it.name));
  if (weapon) { next.weaponRight = weapon.name; used.add(weapon.name); }
  const rings = inventory.filter(it => it.slot === 'ring' && !used.has(it.name));
  if (rings[0]) { next.ringLeft = rings[0].name; used.add(rings[0].name); }
  if (rings[1]) { next.ringRight = rings[1].name; used.add(rings[1].name); }
  return next;
}

function findItemRarity(itemName, itemRarities) {
  const normalized = itemName.trim().toLowerCase();
  if (!normalized) return null;
  if (itemRarities[normalized]) return itemRarities[normalized];
  for (const key of Object.keys(itemRarities)) {
    if (normalized.includes(key) || key.includes(normalized)) return itemRarities[key];
  }
  return null;
}

// Item weight system — a compressed approximation of real-world weight, not
// a literal one. This is a loot-collecting RPG: if every dagger and ring
// were weighted exactly like reality, hoarding interesting finds would be a
// chore instead of the point of playing. So the numbers stay in the same
// rough ballpark as their real counterparts (a knife feels like a knife, not
// a feather or a boulder) but heavier gear — body armor especially — sits
// noticeably lighter than its real-world weight, so gearing up doesn't
// dominate carry capacity. Like rarity, a weight is rolled once per item
// name and cached (see itemWeights state) so it stays stable for the rest
// of the playthrough regardless of how the model re-describes the item on a
// later turn. Rolled from the item's equipment "slot" (see
// EQUIPMENT_SLOT_TYPES above) rather than anything the model supplies, so —
// again like rarity — the actual numbers stay exactly what's specified here
// no matter how any given scene is narrated.
const WEIGHT_RANGE_BY_SLOT = {
  weapon: [1, 3], armor: [3, 6], helmet: [1, 2], gloves: [1, 1],
  boots: [1, 2], amulet: [1, 1], ring: [1, 1], cloak: [1, 2], backpack: [1, 3],
  consumable: [1, 1], none: [1, 2]
};
const TWO_HANDED_WEIGHT_BONUS = 2;

function rollItemWeight(slot, twoHanded) {
  const [min, max] = WEIGHT_RANGE_BY_SLOT[slot] || WEIGHT_RANGE_BY_SLOT.none;
  const base = min + Math.round(Math.random() * (max - min));
  return twoHanded ? base + TWO_HANDED_WEIGHT_BONUS : base;
}

// Same loose, case-insensitive name matching as findItemRarity above, and
// for the same reason. Returns 0 (never a real rolled weight — the ranges
// above never go below 1) when nothing matches yet, so callers can treat a
// falsy result as "not rolled" without a separate found/not-found check.
function findItemWeight(itemName, itemWeights) {
  const normalized = itemName.trim().toLowerCase();
  if (!normalized) return 0;
  if (itemWeights[normalized]) return itemWeights[normalized];
  for (const key of Object.keys(itemWeights)) {
    if (normalized.includes(key) || key.includes(normalized)) return itemWeights[key];
  }
  return 0;
}

function computeTotalWeight(inventory, itemWeights) {
  return inventory.reduce((sum, item) => sum + findItemWeight(item.name, itemWeights), 0);
}

// A worn backpack (its own slot now — see EQUIPMENT_SLOT_CONFIG below, split
// from the cloak slot) adds bonus carry capacity scaled to its rarity tier,
// the same escalating logic as gear rarity itself: a better bag is
// genuinely worth chasing. The cloak slot is purely a separate garment and
// doesn't affect capacity — only the backpack does.
const BACKPACK_CAPACITY_BY_RARITY = {
  junk: 10, common: 20, uncommon: 30, rare: 40, unique: 50, epic: 60, mythic: 70
};
const CARRY_BASE = 20;
const CARRY_PER_STRENGTH = 2;

function computeCarryCapacity(strength, equipment, itemRarities) {
  let capacity = CARRY_BASE + strength * CARRY_PER_STRENGTH;
  const backpackName = equipment && equipment.backpack;
  if (backpackName) {
    const rarity = findItemRarity(backpackName, itemRarities);
    capacity += BACKPACK_CAPACITY_BY_RARITY[rarity] || BACKPACK_CAPACITY_BY_RARITY.common;
  }
  return capacity;
}

// How much health a "consumable" (food, medicine, potions) restores when
// used, scaled to its rarity tier the same way everything else on an item
// is — junk barely helps, mythic is a dramatic swing, but health is capped
// at 1000 either way (see useConsumable) so nothing overheals past the
// hero's actual limit.
const HEAL_RANGE_BY_RARITY = {
  junk: [1, 2], common: [5, 10], uncommon: [10, 15], rare: [15, 25],
  unique: [25, 40], epic: [40, 60], mythic: [60, 100]
};

function rollHealAmount(rarity) {
  const [min, max] = HEAL_RANGE_BY_RARITY[rarity] || HEAL_RANGE_BY_RARITY.common;
  return min + Math.round(Math.random() * (max - min));
}

// Which paper-doll slot key an inventory item's "slot" type maps to when
// equipped from the item detail popup (see ItemDetailModal): the single
// matching slot for most types, or a side-picking rule for the two types
// with a left/right pair — prefer whichever side is empty, otherwise fall
// back to a fixed default. Returns null for "consumable"/"none", which
// aren't equippable at all.
function pickEquipSlotForItem(itemSlot, equipment) {
  if (itemSlot === 'weapon') return 'weaponRight';
  if (itemSlot === 'ring') return !equipment.ringLeft ? 'ringLeft' : (!equipment.ringRight ? 'ringRight' : 'ringLeft');
  const entry = EQUIPMENT_SLOT_CONFIG.find(s => !s.spacer && s.matchSlot === itemSlot);
  return entry ? entry.key : null;
}

// Reputation (see npcReputations state): a -100 to 100 standing per
// character, tracked client-side and moved only by specific mechanical
// events, never freely set by the state model — same rationale as
// weight/rarity staying deterministic rather than trusting a fresh AI guess
// every turn. A character the hero has only just met starts wary, not
// neutral — they don't know yet what to expect from the hero, so they read
// at DEFAULT_REPUTATION rather than some comfortable middle value. From
// there: completing a quest raises their giver's standing, failing one
// lowers it, declining the material reward for a completed quest raises it
// further still on top of the completion bonus, and the narrative model
// flags (see "reputationHits" in buildStateAndEventsSystemPrompt) when the
// hero insults or acts with outright hostility toward someone on-scene,
// which lowers it, or shows someone unprompted kindness or real help, which
// raises it by the same mechanism. Below zero, standing is graduated rather
// than an on/off switch: anywhere in (RESENTFUL_REPUTATION_THRESHOLD, HOSTILE_REPUTATION_
// THRESHOLD] — i.e. negative but not yet -50 — a character is merely
// RESENTFUL (see isResentfulReputation): they'll insult the hero back and
// refuse to help or deal with them, but stop short of violence. Only once
// standing reaches HOSTILE_REPUTATION_THRESHOLD (-50) or lower do they turn
// fully HOSTILE (see isHostileReputation) and the hostile-character rule in
// buildNarrativeSystemPrompt has them turn on the hero in the story itself;
// that hostile scene is then what the combat-detection part of
// buildStateAndEventsSystemPrompt picks up to surface the fight button.

// ==============================================================================
// NPC REPUTATION
// ==============================================================================
const DEFAULT_REPUTATION = 10;
const QUEST_COMPLETE_REPUTATION_DELTA = 15;
const QUEST_FAIL_REPUTATION_DELTA = -15;
const QUEST_REWARD_DECLINE_BONUS = 10;
const INSULT_REPUTATION_DELTA = -10;
const HOSTILE_ACT_REPUTATION_DELTA = -25;
// Positive mirror of the two above — same detection mechanism (a spontaneous
// scene the narrative model flags, not a formal system like quests/gifts),
// so the magnitudes mirror theirs exactly: a kind word or small unprompted
// courtesy moves standing as much as an insult costs it, and real,
// meaningful help (defending them, a genuine sacrifice, saving them from
// harm) moves it as much as a hostile act costs — landing just under a full
// completed quest (QUEST_COMPLETE_REPUTATION_DELTA), same reasoning as
// GIFT_REPUTATION_BY_RARITY's top tier: a single scene, however generous,
// is still a smaller gesture than seeing a whole quest through.
const KINDNESS_REPUTATION_DELTA = 10;
const HELP_REPUTATION_DELTA = 25;
// A kind word costs the player nothing and is trivial to repeat every single
// turn, so unlike every other channel on this list, "kindness" is also
// gated by a per-character cooldown (see npcKindnessCooldowns state and
// reconcileReputationHits): once a character's standing has risen from
// kindness, it can't rise from kindness again for this many of the hero's
// own turns. "help" is deliberately exempt — it requires a costly,
// substantial act (real danger, a real sacrifice) that isn't something a
// player can spam through dialogue alone — and there is deliberately no
// cooldown at all on the negative side (insult/hostile): nothing here
// should stop a player from being genuinely and repeatedly cruel if that's
// really how they're playing, only from farming goodwill with empty
// flattery.
const KINDNESS_REPUTATION_COOLDOWN_TURNS = 6;
// How much handing a character a single inventory item nudges their
// standing (see giftItemToNpc) — scaled to that item's rarity tier the
// same way healing and backpack capacity are: a junk trinket barely
// registers, a mythic item is a genuinely generous gesture, but even that
// top tier stays a bit under a whole completed quest (QUEST_COMPLETE_
// REPUTATION_DELTA) since handing over one thing, however rare, is a
// smaller gesture than seeing a quest through. A fixed constant per tier,
// like every other reputation number here — never inflated by the model
// or by how the player frames the gift.
const GIFT_REPUTATION_BY_RARITY = { junk: 1, common: 2, uncommon: 4, rare: 6, unique: 9, epic: 12, mythic: 14 };
const RESENTFUL_REPUTATION_THRESHOLD = 0; // strictly below this (but above HOSTILE), a character resents the hero
const HOSTILE_REPUTATION_THRESHOLD = -50; // at or below this, a character turns fully hostile and attacks

function clampReputation(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return DEFAULT_REPUTATION;
  return Math.max(-100, Math.min(100, Math.round(n)));
}

function isHostileReputation(value) {
  return typeof value === 'number' && value <= HOSTILE_REPUTATION_THRESHOLD;
}

function isResentfulReputation(value) {
  return typeof value === 'number' && value < RESENTFUL_REPUTATION_THRESHOLD && value > HOSTILE_REPUTATION_THRESHOLD;
}

// Reputation bar color (see CharacterSheet): a continuous read on the exact
// -100..100 value, not the three fixed hostile/resentful/normal buckets
// above — those still drive the name suffix/color and the narrator's
// behavior rules, but the bar itself blends smoothly red (fully hostile)
// -> yellow (neutral, 0) -> green (fully friendly) so two values on the
// same side of a threshold (say -5 and -45, both merely "resentful") still
// read as visibly different in tone rather than sharing one flat color.
// Two linear interpolations meeting at 0, rather than one span across the
// full range, so the color actually sits on yellow exactly at the neutral
// midpoint instead of passing through it partway off-center.
const REPUTATION_COLOR_HOSTILE = [220, 38, 38];   // --red-600
const REPUTATION_COLOR_NEUTRAL = [251, 191, 36];  // --amber-400
const REPUTATION_COLOR_FRIENDLY = [5, 150, 105];  // --emerald-600

function reputationColor(value) {
  const clamped = Math.max(-100, Math.min(100, typeof value === 'number' ? value : 0));
  const [from, to, ratio] = clamped < 0
    ? [REPUTATION_COLOR_HOSTILE, REPUTATION_COLOR_NEUTRAL, (clamped + 100) / 100]
    : [REPUTATION_COLOR_NEUTRAL, REPUTATION_COLOR_FRIENDLY, clamped / 100];
  const mix = (a, b) => Math.round(a + (b - a) * ratio);
  return `rgb(${mix(from[0], to[0])}, ${mix(from[1], to[1])}, ${mix(from[2], to[2])})`;
}

// Same loose, case-insensitive name matching as findItemRarity/findItemWeight
// above, and for the same reason (the model may phrase a name slightly
// differently turn to turn). Untracked characters read as DEFAULT_REPUTATION
// — a character the hero has only just met, wary and unsure what to expect
// from them, not a comfortable neutral middle ground.
// Pulled out from findNpcReputation so migrateNpcReputations below can reuse
// the exact same matching to relocate a value rather than just read it.
function resolveNpcReputationKey(name, npcReputations) {
  const normalized = name.trim().toLowerCase();
  if (!normalized) return null;
  if (typeof npcReputations[normalized] === 'number') return normalized;
  for (const key of Object.keys(npcReputations)) {
    if (normalized.includes(key) || key.includes(normalized)) return key;
  }
  return null;
}

function findNpcReputation(name, npcReputations) {
  const key = resolveNpcReputationKey(name, npcReputations);
  return key !== null ? npcReputations[key] : DEFAULT_REPUTATION;
}

// ==============================================================================
// FACTION REPUTATION
// ==============================================================================
// Reputation with a faction (see factionReputations state): a -100..100
// standing per faction, same shape and mechanics as npcReputations above —
// tracked client-side, moved only by specific flagged events, never freely
// set by the state model — but for a GROUP rather than a single person. A
// faction is any named collective the story treats as acting with one will:
// a legion, a guild, a cult, a noble house, a gang. The registry of which
// factions exist and what they are lives in gameState.factions (see
// reconcileFactions) — this state is purely the numeric standing, same
// separation as npcs/npcReputations.
//
// Unlike an NPC — met face to face, and read as wary by default because
// they don't yet know what to expect from the hero — a faction is an
// abstraction the hero has no personal history with yet, so it starts at
// true neutral (FACTION_DEFAULT_REPUTATION = 0) rather than the wary
// individual baseline.
//
// A location can carry a controlling faction (see the "faction" field on
// map nodes, set via reconcileMap from the state model's
// "location.faction"/"nearbyMentioned[].faction"). Every location that
// shares the same controlling-faction name forms that faction's
// territory — an emergent region, without a separate rigid region
// hierarchy — so standing with one faction reads the same everywhere they
// hold ground. buildNarrativeSystemPrompt is told the controlling
// faction's standing whenever the hero is actually in that territory (see
// "THE HERO IS CURRENTLY IN TERRITORY CONTROLLED BY" in gearContext),
// which is what drives the regional hostility rules there. This is also
// the hook a future trading system is expected to price off — see
// factionPriceMultiplier below.
//
// Moved the same way npcReputations is — only via factionReputationHits
// (mirroring reputationHits exactly) or faction-tagged quest completion/
// failure/decline (see reconcileQuests) — but at a smaller magnitude than
// the matching NPC deltas, since an entire group's opinion is supposed to
// move slower than one person's.
const FACTION_DEFAULT_REPUTATION = 0;
const FACTION_QUEST_COMPLETE_REPUTATION_DELTA = 8;
const FACTION_QUEST_FAIL_REPUTATION_DELTA = -8;
const FACTION_QUEST_REWARD_DECLINE_BONUS = 5;
const FACTION_INSULT_REPUTATION_DELTA = -6;
const FACTION_HOSTILE_ACT_REPUTATION_DELTA = -15;
const FACTION_KINDNESS_REPUTATION_DELTA = 6;
const FACTION_HELP_REPUTATION_DELTA = 15;
const FACTION_RESENTFUL_REPUTATION_THRESHOLD = 0; // strictly below this (but above HOSTILE), a faction resents the hero
const FACTION_HOSTILE_REPUTATION_THRESHOLD = -50; // at or below this, a faction treats the hero as an open enemy
// Automatic, smaller ripple onto a faction whenever something moves the
// standing of one of ITS tagged members (see findNpcFaction) — applied to
// every reconcileReputationHits delta below, in both directions, with no
// judgment call needed (unlike factionReputationHits, which is the model's
// own call for events that are clearly about the faction as an
// institution, not tied to any one person — the two are independent and
// additive). Helping or wronging a fielded member is assumed to reach the
// group a little every time. Deliberately smaller than a direct
// factionReputationHits entry, and smaller still than a first pass at this
// ratio (0.2) turned out to feel: 10% of whatever the individual NPC's own
// delta was this turn, rounded by magnitude (never zero for any of the
// REPUTATION_HIT_DELTAS magnitudes) — a whole faction's opinion is
// supposed to crawl, not track every personal interaction one-for-one.
const FACTION_NPC_RIPPLE_RATIO = 0.1;

function clampFactionReputation(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return FACTION_DEFAULT_REPUTATION;
  return Math.max(-100, Math.min(100, Math.round(n)));
}

function isFactionHostile(value) {
  return typeof value === 'number' && value <= FACTION_HOSTILE_REPUTATION_THRESHOLD;
}

function isFactionResentful(value) {
  return typeof value === 'number' && value < FACTION_RESENTFUL_REPUTATION_THRESHOLD && value > FACTION_HOSTILE_REPUTATION_THRESHOLD;
}

// Same loose, case-insensitive substring matching as resolveNpcReputationKey,
// for the same reason (the model may phrase a faction's name slightly
// differently turn to turn).
function resolveFactionReputationKey(name, factionReputations) {
  const normalized = name.trim().toLowerCase();
  if (!normalized) return null;
  if (typeof factionReputations[normalized] === 'number') return normalized;
  for (const key of Object.keys(factionReputations)) {
    if (normalized.includes(key) || key.includes(normalized)) return key;
  }
  return null;
}

// Untracked factions read as FACTION_DEFAULT_REPUTATION (true neutral) —
// see the note above on why that differs from DEFAULT_REPUTATION for NPCs.
function findFactionReputation(name, factionReputations) {
  const key = resolveFactionReputationKey(name, factionReputations);
  return key !== null ? factionReputations[key] : FACTION_DEFAULT_REPUTATION;
}

// Foundation for the trading system mentioned as being built separately —
// not called anywhere in this file yet. A pure function turning standing
// into a price multiplier a merchant in that faction's territory would
// charge, so that system has a stable, already-tuned curve to price off of
// instead of reinventing one. Deliberately asymmetric: gouging a hated
// outsider is a bigger swing than the discount a good customer earns —
// up to +75% markup at rock-bottom standing, but only up to -30% off at
// the very top. What a hostile enough merchant does below that floor
// (refuse to sell at all) is the trading system's own call, not this
// function's.
function factionPriceMultiplier(value) {
  const v = typeof value === 'number' ? value : FACTION_DEFAULT_REPUTATION;
  if (v >= 0) return 1 - (Math.min(100, v) / 100) * 0.3;
  return 1 + (Math.min(100, -v) / 100) * 0.75;
}

// Purely cosmetic rank/title a faction would give the hero at their current
// standing — a translation key for CharacterSheet to display next to the
// reputation bar, nothing more; doesn't feed back into any mechanic. Reuses
// the same HOSTILE/RESENTFUL thresholds as isFactionHostile/isFactionResentful
// so the wording never contradicts the ⚔/🚫 markers already shown for those
// two tiers, and adds three more thresholds spanning the friendly half of
// the scale. FACTION_DEFAULT_REPUTATION (0) gets its own "unknown" label
// rather than falling into "acquaintance" — a faction sitting at exactly 0
// is one the hero has never actually interacted with (see
// findFactionReputation's fallback), not one they've had a lukewarm history
// with.
const FACTION_RESPECTED_REPUTATION_THRESHOLD = 25;
const FACTION_ALLY_REPUTATION_THRESHOLD = 50;
const FACTION_HERO_REPUTATION_THRESHOLD = 75;
function factionStandingLabelKey(value) {
  const v = typeof value === 'number' ? value : FACTION_DEFAULT_REPUTATION;
  if (v <= FACTION_HOSTILE_REPUTATION_THRESHOLD) return 'factionRankEnemy';
  if (v < FACTION_RESENTFUL_REPUTATION_THRESHOLD) return 'factionRankOutcast';
  if (v === FACTION_DEFAULT_REPUTATION) return 'factionRankUnknown';
  if (v < FACTION_RESPECTED_REPUTATION_THRESHOLD) return 'factionRankAcquaintance';
  if (v < FACTION_ALLY_REPUTATION_THRESHOLD) return 'factionRankRespected';
  if (v < FACTION_HERO_REPUTATION_THRESHOLD) return 'factionRankAlly';
  return 'factionRankHero';
}

// The equipment paper-doll: fixed slots, each matched against the inventory
// item "slot" type the state model assigns (see EQUIPMENT_SLOT_TYPES).
// Icons are plain emoji placeholders — swapping in real art later is just a
// matter of rendering an <img> instead of the icon span, everything else
// (the grid, the picker, the two-handed rule) stays the same.

// ==============================================================================
// EQUIPMENT SLOTS — config & normalization
// ==============================================================================
const EQUIPMENT_SLOT_CONFIG = [
  { key: 'cloak', matchSlot: 'cloak', icon: '🧥', labelKey: 'equipCloak' },
  { key: 'helmet', matchSlot: 'helmet', icon: '🪖', labelKey: 'equipHelmet' },
  { key: 'amulet', matchSlot: 'amulet', icon: '📿', labelKey: 'equipAmulet' },
  { key: 'weaponRight', matchSlot: 'weapon', icon: '⚔️', labelKey: 'equipWeaponRight' },
  { key: 'armor', matchSlot: 'armor', icon: '🥋', labelKey: 'equipArmor' },
  { key: 'weaponLeft', matchSlot: 'weapon', icon: '🗡️', labelKey: 'equipWeaponLeft' },
  { key: 'backpack', matchSlot: 'backpack', icon: '🎒', labelKey: 'equipBackpack' },
  { key: 'boots', matchSlot: 'boots', icon: '🥾', labelKey: 'equipBoots' },
  { key: 'gloves', matchSlot: 'gloves', icon: '🧤', labelKey: 'equipGloves' },
  { key: 'ringLeft', matchSlot: 'ring', icon: '💍', labelKey: 'equipRingLeft' },
  { key: 'spacer2', spacer: true },
  { key: 'ringRight', matchSlot: 'ring', icon: '💍', labelKey: 'equipRingRight' }
];

const EMPTY_EQUIPMENT = EQUIPMENT_SLOT_CONFIG.filter(slot => !slot.spacer).reduce((acc, slot) => { acc[slot.key] = null; return acc; }, {});

function normalizeEquipment(raw) {
  if (!raw || typeof raw !== 'object') return { ...EMPTY_EQUIPMENT };
  const next = { ...EMPTY_EQUIPMENT };
  for (const slot of EQUIPMENT_SLOT_CONFIG) {
    if (typeof raw[slot.key] === 'string' && raw[slot.key].trim()) next[slot.key] = raw[slot.key];
  }
  return next;
}

// A deliberately deterministic sub-system: once a fight's opponent is
// generated (see buildStateAndEventsSystemPrompt), every exchange is resolved
// locally with the formulas below rather than by another model call, so the
// numbers stay exactly consistent turn to turn and the fight never waits on
// a network round-trip mid-swing. The narrative/state models only see the
// fight before it starts and after it ends (via the [COMBAT RESULT] tag,
// see buildCombatSummaryTag) — never the hit/damage math itself.
// Layout mirrors EQUIPMENT_SLOT_CONFIG: a 3-column grid with spacers so the
// six parts read as a rough humanoid silhouette (head on top, arms flanking
// the torso, legs on the bottom).

// ==============================================================================
// COMBAT — body parts, targeting, and resolution
// ==============================================================================
const BODY_PART_CONFIG = [
  { key: 'spacer1', spacer: true },
  { key: 'head', icon: '🎯', labelKey: 'bodyPartHead', hitChance: 55, shareOfHp: 0.12, vital: true },
  { key: 'spacer2', spacer: true },
  { key: 'leftArm', icon: '🤚', labelKey: 'bodyPartLeftArm', hitChance: 70, shareOfHp: 0.15, vital: false },
  { key: 'torso', icon: '🎽', labelKey: 'bodyPartTorso', hitChance: 85, shareOfHp: 0.28, vital: true },
  { key: 'rightArm', icon: '✋', labelKey: 'bodyPartRightArm', hitChance: 70, shareOfHp: 0.15, vital: false },
  { key: 'leftLeg', icon: '🦵', labelKey: 'bodyPartLeftLeg', hitChance: 70, shareOfHp: 0.15, vital: false },
  { key: 'spacer3', spacer: true },
  { key: 'rightLeg', icon: '🦵', labelKey: 'bodyPartRightLeg', hitChance: 70, shareOfHp: 0.15, vital: false }
];
const BODY_PARTS = BODY_PART_CONFIG.filter(p => !p.spacer);

const DEFENSE_OPTIONS = [
  { key: 'dodge', icon: '💨', labelKey: 'defenseDodgeLabel' },
  { key: 'block', icon: '🛡️', labelKey: 'defenseBlockLabel' },
  { key: 'parry', icon: '⚔️', labelKey: 'defenseParryLabel' }
];

// Every tunable number for combat resolution lives here so balance can be
// adjusted in one place without hunting through the formulas below.
const COMBAT_TUNING = {
  precisionBaseline: 10,      // stat value treated as "ordinary" (matches EMPTY_STATE.stats)
  precisionHitScale: 1.2,     // hit-chance % shift per point of attacker precision above baseline
  minHitChance: 5,
  maxHitChance: 95,
  powerBaseline: 10,
  damageVariance: 0.3,             // +/- fraction of base damage applied as randomness
  weaponPowerModifierScale: 0.02,  // +/-2% weapon damage per point of attacker power above baseline
  weaponPowerModifierFloor: 0.5,   // a very weak attacker still deals at least half the weapon's rating
  enemyDamageBase: 5,          // enemies carry no inventory/rarity, so their damage scales off "power" alone —
  enemyDamagePowerScale: 1.0,  // calibrated so an ordinary enemy (power ~10) hits about as hard as a common one-handed weapon
  hpScale: 10,                 // multiplies narrative health (1-1000, ordinary ~50) into a combat HP pool sized to match weapon damage — see the calibration note above WEAPON_DAMAGE_BY_RARITY
  dodgeBase: 35,
  blockBaseUnarmed: 25,
  blockBaseEquipped: 45,
  parryBaseUnarmed: 10,
  parryBaseWithWeapon: 40,
  defensePrecisionScale: 1.0,
  partialDefenseBand: 20,      // percentage points above the full-success chance that still count as a partial block/parry
  partialDamageFraction: 0.5,  // fraction of a hit's damage that still gets through on a partial block/parry
  fleeBase: 55,               // base % chance to flee an "ordinary" opponent
  fleeDifficultyScale: 1.5,   // % penalty per point enemy power+precision exceeds baseline (combined)
  fleeHpDifficultyScale: 0.8, // % penalty per 10 (narrative-scale) HP the enemy's pool exceeds the ordinary baseline (50)
  fleeAgilityScale: 1.0       // % bonus per point of hero agility above baseline
};

// Weapon damage is deliberately the dominant factor in a hit (see
// computeWeaponDamage) — strength only nudges it. Numbers are per hit,
// one-handed; a two-handed weapon doubles its tier's number (see
// getPlayerWeaponInfo). Unarmed sits outside the ladder since a fist is
// never an inventory item. junk/common/uncommon/rare/unique match the
// numbers asked for directly; epic/mythic extrapolate the same escalating
// jump for the two tiers RARITY_TIERS defines but weren't spelled out —
// they're rarer still, so staying dramatically stronger fits the pattern.
//
// Calibration target: a "fair" fight — a matched weapon tier against an
// ordinarily-statted opponent — should run about 5-20 hits to down a vital
// part. COMBAT_TUNING.hpScale (×10 on narrative health) and
// ARMOR_DEFENSE_BY_RARITY below are both tuned against these numbers: an
// ordinary opponent's torso lands around 140 HP, so a common weapon (15
// dmg) needs roughly 9-13 swings once misses and armor are factored in. A
// badly mismatched fight (great gear vs. a weak foe, or the reverse) is
// expected to run short or be unwinnable rather than get secretly
// rebalanced back toward "fair" — fights should be honest; see the note
// by buildStateAndEventsSystemPrompt.
const UNARMED_DAMAGE = 5;
const WEAPON_DAMAGE_BY_RARITY = {
  junk: 10,
  common: 15,
  uncommon: 20,
  rare: 40,
  unique: 60,
  epic: 100,
  mythic: 160
};

// Worn armor's flat damage reduction per hit, by rarity tier — roughly a
// third of the matching weapon tier's damage, so gearing up meaningfully
// extends a fight without making incoming damage disappear outright (a hit
// always deals at least 1 regardless of armor).
const ARMOR_DEFENSE_BY_RARITY = {
  junk: 2,
  common: 4,
  uncommon: 7,
  rare: 14,
  unique: 22,
  epic: 35,
  mythic: 55
};

// Which body part(s) each armor slot protects. Only slots that are
// physically protective gear are listed — amulet/rings are accessories,
// and neither cloak nor backpack (separate slots; see EQUIPMENT_SLOT_CONFIG)
// count as combat armor either.
const ARMOR_SLOT_PROTECTION = {
  helmet: ['head'],
  armor: ['torso'],
  gloves: ['leftArm', 'rightArm'],
  boots: ['leftLeg', 'rightLeg']
};

// Single source of truth for "how much defense does this item give" — used
// both by combat (getPlayerDefenseForPart) and by the UI (item detail card,
// equipment slot badge) so the displayed number can never drift from what a
// hit actually subtracts. Returns null for a slot type that isn't physical
// armor (weapon, ring, amulet, cloak, backpack, consumable) rather than 0,
// so callers can tell "no defense stat applies here" apart from "defends
// for zero".
function getArmorDefenseForSlot(slotType, rarity) {
  if (!ARMOR_SLOT_PROTECTION[slotType]) return null;
  return ARMOR_DEFENSE_BY_RARITY[rarity] || ARMOR_DEFENSE_BY_RARITY.common;
}

// Same idea as getArmorDefenseForSlot, but for weapon damage — single source
// of truth used by both combat (getPlayerWeaponInfo) and the UI (item detail
// card, equipment slot badge) so the displayed number can never drift from
// what a hit actually deals. Returns null for anything that isn't a weapon
// slot, so callers can tell "no damage stat applies here" apart from
// "deals zero". A two-handed weapon doubles its tier's number, matching
// getPlayerWeaponInfo's combat math exactly.
function getWeaponDamageForSlot(slotType, rarity, twoHanded) {
  if (slotType !== 'weapon') return null;
  const base = WEAPON_DAMAGE_BY_RARITY[rarity] || WEAPON_DAMAGE_BY_RARITY.common;
  return twoHanded ? base * 2 : base;
}

// ------------------------------------------------------------------------
// SET BONUSES — purely local, no model/schema involvement. Two or more
// currently-equipped items whose names share a distinctive word (e.g.
// "Пепельные наручи" + "Пепельный шлем" both carry a "пепельн…" stem) are
// treated as pieces of one matched set. Detection is plain string
// comparison over whatever the model already named the items, filtered
// against GENERIC_ITEM_WORDS so a shared slot-type noun ("шлем"/"helmet")
// never counts on its own — only a shared distinctive word does. Junk-tier
// items never take part (see RARITY_TIERS): vendor filler, never a curated
// set piece, whatever it happens to be named. Actually getting matching
// names to appear in play at all relies on buildNarrativeSystemPrompt's
// dedicated set-naming rule — this layer only detects and scores whatever
// naming the narrative produces, never invents or requires it.
//
// Only the four physical armor slots can ever be part of a set — weapons,
// rings, amulets, cloaks, and backpacks are excluded entirely (see
// SET_ELIGIBLE_SLOTS), both from contributing a bonus and from counting
// toward another piece's match. That caps a set at 4 members, which is
// exactly what the two-tier bonus below is built around: 2-3 matching
// pieces unlock the smaller bonus, all 4 unlock the larger one INSTEAD of
// it (never both at once — see getSetBonusForSlot).
// ------------------------------------------------------------------------
const GENERIC_ITEM_WORDS = new Set([
  'шлем', 'шлема', 'шлему', 'шлемом', 'шлеме', 'доспех', 'доспехи', 'доспеха', 'доспехов', 'броня', 'брони', 'броню',
  'перчатки', 'перчаток', 'перчатка', 'наручи', 'наручей', 'наручах', 'сапоги', 'сапог', 'сапогах', 'ботинки', 'ботинок',
  'поножи', 'поножей', 'поножах', 'плащ', 'плаща', 'плаще', 'накидка', 'накидки', 'рюкзак', 'рюкзака', 'сумка', 'сумки',
  'амулет', 'амулета', 'кулон', 'кулона', 'кольцо', 'кольца', 'перстень', 'перстня',
  'меч', 'меча', 'мечом', 'кинжал', 'кинжала', 'топор', 'топора', 'лук', 'лука', 'посох', 'посоха',
  'щит', 'щита', 'булава', 'булавы', 'копье', 'копьё', 'копья', 'молот', 'молота', 'клинок', 'клинка',
  'helmet', 'armor', 'armour', 'gloves', 'gauntlets', 'vambraces', 'boots', 'greaves', 'cloak', 'cape',
  'backpack', 'pack', 'satchel', 'amulet', 'pendant', 'ring', 'sword', 'dagger', 'axe', 'bow', 'staff',
  'shield', 'mace', 'spear', 'hammer', 'blade'
]);

const SET_STEM_LENGTH = 5;   // loosely tolerates Russian case endings without a real stemmer
const SET_MIN_WORD_LENGTH = 4;

// The only slots that can belong to a set — the four physical armor slots
// tracked by ARMOR_SLOT_PROTECTION. Deliberately the exact same list: a
// set bonus is a defense bonus, so only slots that already carry a defense
// stat are eligible. Weapons, rings, amulets, cloaks, and backpacks are
// excluded outright, whatever their names share.
const SET_ELIGIBLE_SLOTS = ['helmet', 'armor', 'gloves', 'boots'];

// Two fixed tiers, keyed by how many of the (max 4) eligible slots match —
// 2 or 3 pieces unlock the smaller number, all 4 unlock the larger one
// INSTEAD of the smaller one (see getSetBonusForSlot: tiers never stack).
// Each column scales by the matching piece's own rarity, roughly half of
// ARMOR_DEFENSE_BY_RARITY for the 2-piece tier and roughly the full value
// of ARMOR_DEFENSE_BY_RARITY for the 4-piece tier — a complete matched set
// effectively doubles that piece's own defense.
const SET_BONUS_DEFENSE_BY_TIER = {
  2: { junk: 0, common: 2, uncommon: 4, rare: 7, unique: 11, epic: 18, mythic: 28 },
  4: { junk: 0, common: 4, uncommon: 7, rare: 14, unique: 22, epic: 35, mythic: 55 }
};

function extractSetStems(name) {
  if (!name) return [];
  const words = name.toLowerCase().match(/[a-zа-яё]+/g) || [];
  const stems = [];
  for (const w of words) {
    if (w.length < SET_MIN_WORD_LENGTH || GENERIC_ITEM_WORDS.has(w)) continue;
    stems.push(w.slice(0, SET_STEM_LENGTH));
  }
  return stems;
}

// Groups every currently-equipped, non-junk, set-eligible item (see
// SET_ELIGIBLE_SLOTS) by shared name stem (see extractSetStems), keeping
// only groups of 2+ matching slots. A piece touching several qualifying
// groups is assigned to its single largest one only, so it never
// double-counts into two overlapping "sets" at once. Returns
// slotKey -> { size, rarity } for every eligible slot that's part of an
// active set — everything getSetBonusForSlot needs.
function computeActiveEquipmentSets(equipment, inventory, itemRarities) {
  const entries = [];
  for (const slotKey of SET_ELIGIBLE_SLOTS) {
    const name = equipment[slotKey];
    if (!name) continue;
    const rarity = findItemRarity(name, itemRarities) || 'common';
    if (rarity === 'junk') continue;
    entries.push({ slotKey, rarity, stems: extractSetStems(name) });
  }
  const groups = {};
  for (const entry of entries) {
    for (const stem of entry.stems) {
      (groups[stem] = groups[stem] || []).push(entry.slotKey);
    }
  }
  const result = {};
  for (const entry of entries) {
    let best = null;
    for (const stem of entry.stems) {
      const size = groups[stem].length;
      if (size >= 2 && (!best || size > best)) best = size;
    }
    if (best) result[entry.slotKey] = { size: best, rarity: entry.rarity };
  }
  return result;
}

// Extra defense a single equipped slot draws from being part of an active
// set (see computeActiveEquipmentSets) — 0 when it isn't one. Exactly two
// tiers, never stacked: 2-3 matching pieces get the smaller SET_BONUS_
// DEFENSE_BY_TIER[2] number, a full 4-piece match gets the larger [4]
// number INSTEAD of it — a complete set is worth more than "the 2-piece
// bonus plus a bit," not both added together.
function getSetBonusForSlot(slotKey, activeSets) {
  const info = activeSets[slotKey];
  if (!info) return { defense: 0, size: 0 };
  const tier = info.size >= 4 ? 4 : 2;
  return {
    defense: (SET_BONUS_DEFENSE_BY_TIER[tier][info.rarity] || 0),
    size: info.size
  };
}

function clampPercent(n) {
  return Math.max(COMBAT_TUNING.minHitChance, Math.min(COMBAT_TUNING.maxHitChance, n));
}

// Splits a combatant's total HP pool across body parts by their configured
// share, after applying COMBAT_TUNING.hpScale to bring the narrative health
// scale (1-1000, ordinary ~50) up to a range that plays out sensibly
// against weapon-tier damage (see the calibration note above
// WEAPON_DAMAGE_BY_RARITY). partKeys optionally restricts which parts
// exist at all — omit it (or pass the full BODY_PARTS list) for the hero,
// who is always fully humanoid; pass a shorter list for an enemy whose
// anatomy doesn't include every part (see normalizeEnemyBodyParts). Shares
// are renormalized to sum to 1 over just the parts present, so e.g. a
// slime's lone "torso" entry gets 100% of its (scaled) HP rather than the
// 28% it'd get in a full body.
function buildCombatantParts(totalHp, partKeys) {
  const scaledTotal = totalHp * COMBAT_TUNING.hpScale;
  const keys = partKeys && partKeys.length > 0 ? partKeys : BODY_PARTS.map(p => p.key);
  const activeParts = BODY_PARTS.filter(p => keys.includes(p.key));
  const shareSum = activeParts.reduce((sum, p) => sum + p.shareOfHp, 0) || 1;
  const parts = {};
  for (const p of activeParts) {
    const hp = Math.max(1, Math.round(scaledTotal * (p.shareOfHp / shareSum)));
    parts[p.key] = { hp, maxHp: hp, disabled: false };
  }
  return parts;
}

// Validates the model's reply for which body parts an enemy has (e.g. a
// slime might only list ["torso"]). Filters out anything not in BODY_PARTS,
// always keeps "torso" as a minimum so there's never a target-less enemy,
// and falls back to the full humanoid set for missing/invalid data — this
// also covers a save from before this field existed, whose stored
// combatEncounter won't have bodyParts at all.
function normalizeEnemyBodyParts(raw) {
  const validKeys = BODY_PARTS.map(p => p.key);
  if (Array.isArray(raw)) {
    const filtered = raw.filter(k => validKeys.includes(k));
    if (filtered.length > 0) return filtered.includes('torso') ? filtered : [...filtered, 'torso'];
  }
  return validKeys;
}

function computeHitChance(part, attackerPrecision) {
  const modifier = (attackerPrecision - COMBAT_TUNING.precisionBaseline) * COMBAT_TUNING.precisionHitScale;
  return clampPercent(part.hitChance + modifier);
}

// The hero's damage: driven primarily by the equipped weapon's own rating
// (see getPlayerWeaponInfo, which already folds in two-handed doubling and
// dual-wielding), with strength only nudging it up or down — a rusty
// dagger stays a rusty dagger in strong hands, but raw power still helps
// land a harder blow.
function computeWeaponDamage(weaponDamage, attackerPower) {
  const powerModifier = 1 + (attackerPower - COMBAT_TUNING.powerBaseline) * COMBAT_TUNING.weaponPowerModifierScale;
  const base = weaponDamage * Math.max(COMBAT_TUNING.weaponPowerModifierFloor, powerModifier);
  const variance = base * COMBAT_TUNING.damageVariance;
  return Math.max(1, Math.round(base + (Math.random() * 2 - 1) * variance));
}

// An enemy's damage: enemies carry no inventory/rarity, so their hits scale
// directly off their generated "power" stat instead, calibrated so an
// ordinary opponent (power ~10) hits about as hard as a common one-handed
// weapon (see WEAPON_DAMAGE_BY_RARITY).
function computeEnemyDamage(enemyPower) {
  const base = COMBAT_TUNING.enemyDamageBase + enemyPower * COMBAT_TUNING.enemyDamagePowerScale;
  const variance = base * COMBAT_TUNING.damageVariance;
  return Math.max(1, Math.round(base + (Math.random() * 2 - 1) * variance));
}

// hasWeapon covers parry (needs something in hand); hasBlocker is a looser
// check (a weapon OR worn armor counts as something to raise in a block).
function computeDefenseChance(defenseKey, defenderPrecision, hasWeapon, hasBlocker) {
  const agilityBonus = (defenderPrecision - COMBAT_TUNING.precisionBaseline) * COMBAT_TUNING.defensePrecisionScale;
  if (defenseKey === 'dodge') return clampPercent(COMBAT_TUNING.dodgeBase + agilityBonus);
  if (defenseKey === 'block') return clampPercent((hasBlocker ? COMBAT_TUNING.blockBaseEquipped : COMBAT_TUNING.blockBaseUnarmed) + agilityBonus * 0.5);
  if (defenseKey === 'parry') return clampPercent((hasWeapon ? COMBAT_TUNING.parryBaseWithWeapon : COMBAT_TUNING.parryBaseUnarmed) + agilityBonus * 0.7);
  return 0;
}

// Chance of successfully breaking away instead of fighting. Difficulty is
// read straight from the enemy's own generated stats relative to the same
// "ordinary" baselines used everywhere else in combat (enemyTotalHp here is
// the original narrative-scale figure, not the ×hpScale combat pool — see
// where this is called), so an ordinary rat (power/precision ~10, hp ~50)
// is easy to outrun while a boss-tier opponent leaves almost no room to
// flee — exactly the "almost impossible to flee a tough opponent" the flee
// button is meant to model.
function computeFleeChance(enemyPower, enemyPrecision, enemyTotalHp, playerAgility) {
  const powerPrecisionExcess = (enemyPower - COMBAT_TUNING.powerBaseline) + (enemyPrecision - COMBAT_TUNING.precisionBaseline);
  const hpExcess = (enemyTotalHp - 50) / 10;
  const difficultyPenalty = powerPrecisionExcess * COMBAT_TUNING.fleeDifficultyScale + hpExcess * COMBAT_TUNING.fleeHpDifficultyScale;
  const agilityBonus = (playerAgility - COMBAT_TUNING.precisionBaseline) * COMBAT_TUNING.fleeAgilityScale;
  return clampPercent(COMBAT_TUNING.fleeBase - difficultyPenalty + agilityBonus);
}

// The enemy's targeting "AI" for v1: a weighted random pick using the same
// per-part hitChance figures as the difficulty table (bigger/easier targets
// get aimed at more often), skipping parts already disabled unless every
// part is — which shouldn't happen since a disabled vital part ends the
// fight before this is ever called again. Only ever called against the
// hero's parts, which are always the full six, so every key it looks up
// is guaranteed to exist.
function pickEnemyTargetPart(targetParts) {
  const candidates = BODY_PARTS.filter(p => !targetParts[p.key].disabled);
  const pool = candidates.length > 0 ? candidates : BODY_PARTS;
  const totalWeight = pool.reduce((sum, p) => sum + p.hitChance, 0);
  let roll = Math.random() * totalWeight;
  for (const p of pool) {
    roll -= p.hitChance;
    if (roll <= 0) return p.key;
  }
  return pool[pool.length - 1].key;
}

function buildTurns(messages) {
  const turns = [];
  let pendingActions = [];
  for (let i = 0; i < messages.length; i++) {
    const m = messages[i];
    if (m.role === 'narrator') {
      turns.push({ actions: pendingActions, narrator: m, narratorIndex: i });
      pendingActions = [];
    } else {
      pendingActions.push(m);
    }
  }
  return turns;
}

function getTrailingActions(messages) {
  const actions = [];
  for (let i = messages.length - 1; i >= 0; i--) {
    if (messages[i].role === 'narrator') break;
    actions.unshift(messages[i]);
  }
  return actions;
}

function toBase64Utf8(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => { binary += String.fromCharCode(b); });
  return btoa(binary);
}

function fromBase64Utf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function bytesToBase64(bytes) {
  let binary = '';
  bytes.forEach(b => { binary += String.fromCharCode(b); });
  return btoa(binary);
}

function base64ToBytes(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

async function gzipCompress(str) {
  const stream = new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
  const buf = await new Response(stream).arrayBuffer();
  return new Uint8Array(buf);
}

async function gzipDecompress(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const blob = await new Response(stream).blob();
  return await blob.text();
}

// Pulls the first JSON object out of a model response, defensively. The
// prompts all say "ONLY valid JSON, nothing else", but in practice a reply
// can still (a) wrap the object in a stray sentence or code fence despite
// the instruction, or (b) get cut off mid-token when the response runs
// long, since every call through this artifact's API bridge is capped at
// max_tokens: 1000 with no way to raise it per-call. A plain JSON.parse
// throws on either case, and every caller here used to just swallow that
// and fall back to the OLD state/suggestions/items wholesale — which is
// what made the character sheet appear to "freeze" partway through a long
// game (once one turn's state JSON got too big to fit in 1000 tokens,
// every later attempt hit the same wall) and made regenerated turns
// occasionally come back with no suggestions at all.
//
// This walks the text tracking brace/bracket depth and string state so it
// can ignore anything before the first '{' or after its matching '}', and
// — if the object is truncated mid-stream instead of just surrounded by
// noise — close whatever braces/brackets were still open at the cutoff
// point rather than discarding the whole response.
function extractJsonObject(raw) {
  const start = raw.indexOf('{');
  if (start === -1) return null;

  // First pass: find the '}' that balances the first '{' and try parsing
  // exactly that span, ignoring any leading/trailing chatter around it.
  let depth = 0;
  let inString = false;
  let escaped = false;
  let matchEnd = -1;
  for (let i = start; i < raw.length; i++) {
    const c = raw[i];
    if (inString) {
      if (escaped) escaped = false;
      else if (c === '\\') escaped = true;
      else if (c === '"') inString = false;
      continue;
    }
    if (c === '"') { inString = true; continue; }
    if (c === '{' || c === '[') depth++;
    else if (c === '}' || c === ']') {
      depth--;
      if (depth === 0) { matchEnd = i; break; }
    }
  }
  if (matchEnd !== -1) {
    try { return JSON.parse(raw.slice(start, matchEnd + 1)); } catch (e) { /* fall through to repair */ }
  }

  // Second pass: the object never closed (or the balanced span still
  // wouldn't parse) — walk it again, remembering the last position we were
  // safely outside a string, then close every brace/bracket still open at
  // that point instead of giving up.
  const openStack = [];
  inString = false;
  escaped = false;
  let lastSafe = start;
  for (let i = start; i < raw.length; i++) {
    const c = raw[i];
    if (inString) {
      if (escaped) escaped = false;
      else if (c === '\\') escaped = true;
      else if (c === '"') { inString = false; lastSafe = i + 1; }
      continue;
    }
    if (c === '"') { inString = true; continue; }
    if (c === '{' || c === '[') { openStack.push(c); continue; }
    if (c === '}' || c === ']') { openStack.pop(); lastSafe = i + 1; continue; }
    if (c === ',') { lastSafe = i; continue; }
  }
  if (openStack.length === 0) return null;
  let repaired = raw.slice(start, lastSafe).replace(/,\s*$/, '');
  for (let i = openStack.length - 1; i >= 0; i--) repaired += openStack[i] === '{' ? '}' : ']';
  try { return JSON.parse(repaired); } catch (e) { return null; }
}

// Suggestions are only ever shown/used on the latest turn (see rendering
// below), so keeping them on every older message is pure dead weight in an
// export — strip them before serializing. Compression (see buildExportText)
// handles the rest of the size reduction; general-purpose gzip already
// eliminates repeated substrings across turns far better than a bespoke
// diff scheme would, without the correctness risk of assuming the model's
// state fields only ever grow.
function stripEphemeralForExport(messages) {
  return messages.map((m, i) => {
    if (m.role !== 'narrator' || i === messages.length - 1) return m;
    if (!m.suggestions) return m;
    const { suggestions, ...rest } = m;
    return rest;
  });
}

// Folds identically-named inventory entries (spare rings, a matching
// weapon pair, stacked potions) into one display row with a ×count, tied
// back to one representative array index (first occurrence) for whatever
// that row's tap target does. Dropping, viewing, and (see GiftItemModal)
// gifting all act on exactly that one index, so a stack of 3 potions ever
// loses just 1 — shared here so CharacterSheet's inventory list and
// GiftItemModal's item picker group the exact same way.
function groupInventoryByName(inventory) {
  const groups = [];
  const indexByName = new Map();
  inventory.forEach((item, i) => {
    if (indexByName.has(item.name)) {
      groups[indexByName.get(item.name)].count += 1;
    } else {
      indexByName.set(item.name, groups.length);
      groups.push({ item, firstIndex: i, count: 1 });
    }
  });
  return groups;
}
