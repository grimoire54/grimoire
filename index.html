  // weaponLeft is occupied by that same weapon and goes inactive/grayed
  // rather than offering its own picker.

  // ---- EQUIPMENT HANDLERS ----
  function isWeaponLeftDisabled() {
    if (!equipment.weaponRight) return false;
    const item = gameState.inventory.find(it => it.name === equipment.weaponRight);
    return !!(item && item.twoHanded);
  }

  // Candidate inventory items a given equipment slot could hold — a
  // two-handed weapon only shows up as a weaponRight candidate (it displays
  // in the right hand and blocks the left one; see isWeaponLeftDisabled).
  function candidatesForSlot(slotConfig) {
    return gameState.inventory.filter(it => {
      if (it.slot !== slotConfig.matchSlot) return false;
      if (slotConfig.key === 'weaponLeft' && it.twoHanded) return false;
      return true;
    });
  }

  function openEquipPicker(slotKey) {
    setEquipPickerSlot(current => (current === slotKey ? null : slotKey));
  }

  function equipItemInSlot(slotKey, itemName) {
    const item = gameState.inventory.find(it => it.name === itemName);
    const next = { ...equipment, [slotKey]: itemName };
    // A two-handed weapon takes over both hands — clear whatever was in
    // the other weapon slot so it isn't shown as equipped underneath it.
    if (slotKey === 'weaponRight' && item && item.twoHanded) next.weaponLeft = null;
    setEquipment(next);
    setEquipPickerSlot(null);
    // Remembered so the next narrative call can prompt an NPC reaction to
    // this specific item — consumed and cleared once that call happens.
    if (itemName && !pendingJustEquippedRef.current.includes(itemName)) {
      pendingJustEquippedRef.current = [...pendingJustEquippedRef.current, itemName];
    }
    saveGame(messages, gameState, itemRarities, next);
  }

  function unequipSlot(slotKey) {
    const next = { ...equipment, [slotKey]: null };
    setEquipment(next);
    setEquipPickerSlot(null);
    saveGame(messages, gameState, itemRarities, next);
  }

  // Equips straight from the item detail popup (see ItemDetailModal's Equip
  // button) instead of going through the Equipment screen's picker — picks
  // a target slot via pickEquipSlotForItem, then hands off to the exact
  // same equipItemInSlot the Equipment screen itself uses, so it's the
  // identical equip path either way.
  function equipItemFromDetail(index) {
    const item = gameState.inventory[index];
    if (!item) { setItemDetailIndex(null); return; }
    const slotKey = pickEquipSlotForItem(item.slot, equipment);
    if (slotKey) equipItemInSlot(slotKey, item.name);
    setItemDetailIndex(null);
  }

  // Unequips straight from the item detail popup — the counterpart to
  // equipItemFromDetail above. Finds whichever slot currently holds this
  // exact item name and clears it via the same unequipSlot the Equipment
  // screen uses. If the name happens to occupy two slots at once (a
  // matching pair of rings), this clears just the first match; the note in
  // ItemDetailModal would still read "equipped" for the other one, and a
  // second tap clears that too.
  function unequipItemFromDetail(index) {
    const item = gameState.inventory[index];
    if (!item) { setItemDetailIndex(null); return; }
    const slotKey = Object.keys(equipment).find(key => equipment[key] === item.name);
    if (slotKey) unequipSlot(slotKey);
    setItemDetailIndex(null);
  }

  // Manually removes an item the player chose to drop (see DropConfirmModal
  // — this only ever runs after that confirmation). Removes by array index,
  // not name, so dropping one of a pair of identically-named items (a spare
  // ring, a dual-wielded blade) never takes both at once. If the item
  // happened to be equipped, the reconciliation effect above clears that
  // slot on the next render the same way it already does when the
  // narrative model itself drops an item from the inventory list.
  function dropItem(index) {
    if (!gameState.inventory[index]) { setDropConfirmIndex(null); return; }
    const nextInventory = gameState.inventory.filter((_, i) => i !== index);
    const nextState = { ...gameState, inventory: nextInventory };
    setGameState(nextState);
    saveGame(messages, nextState, itemRarities, equipment);
    setDropConfirmIndex(null);
  }

  // Consumes a "consumable" item (see ItemDetailModal's Use button): rolls
  // a heal amount off its rarity, adds it to health capped at the hero's
  // actual limit (1000 — see clampVital), and removes the item, all in one
  // step. No confirmation gate here unlike dropItem: using is a beneficial,
  // deliberately-chosen action, not a destructive one.
  function useConsumable(index) {
    const item = gameState.inventory[index];
    if (!item) { setItemDetailIndex(null); return; }
    const rarity = findItemRarity(item.name, itemRarities);
    const healAmount = rollHealAmount(rarity);
    const nextInventory = gameState.inventory.filter((_, i) => i !== index);
    const nextState = { ...gameState, health: Math.min(1000, gameState.health + healAmount), inventory: nextInventory };
    setGameState(nextState);
    if (!pendingJustUsedRef.current.includes(item.name)) {
      pendingJustUsedRef.current = [...pendingJustUsedRef.current, item.name];
    }
    saveGame(messages, nextState, itemRarities, equipment);
    setItemDetailIndex(null);
  }

  // ---- GIFT ITEM TO NPC ----
  // Hands one inventory item to a character sharing the hero's current
  // location (see the sheet's gift link, gated on presentNow, and
  // GiftItemModal, which is the only caller). Removes the item by array
  // index exactly like dropItem — never by name, so gifting one of a pair
  // of identical items never takes both — and nudges that character's
  // reputation by a fixed amount keyed to the item's rarity tier (see
  // GIFT_REPUTATION_BY_RARITY). Computes the updated npcReputations value
  // itself, rather than going through the async setNpcReputations updater
  // in applyReputationDeltas, purely so the very same value can be handed
  // to saveGame in this same call — an explicit, standalone action like
  // this deserves the same immediate-persistence treatment dropItem and
  // useConsumable already get, rather than waiting on some later turn's
  // save to happen to pick up the fresh reputation number.
  function giftItemToNpc(npcName, index) {
    const item = gameState.inventory[index];
    const key = typeof npcName === 'string' ? npcName.trim().toLowerCase() : '';
    if (!item || !key) { setGiftTargetNpc(null); return; }
    const rarity = findItemRarity(item.name, itemRarities);
    const delta = GIFT_REPUTATION_BY_RARITY[rarity] || GIFT_REPUTATION_BY_RARITY.common;
    const nextInventory = gameState.inventory.filter((_, i) => i !== index);
    const nextState = { ...gameState, inventory: nextInventory };
    const currentReputation = typeof npcReputations[key] === 'number' ? npcReputations[key] : DEFAULT_REPUTATION;
    const nextNpcReputations = { ...npcReputations, [key]: clampReputation(currentReputation + delta) };
    setGameState(nextState);
    setNpcReputations(nextNpcReputations);
    rippleGiftToFaction(npcName, delta);
    saveGame(messages, nextState, itemRarities, equipment, itemWeights, nextNpcReputations);
    setGiftTargetNpc(null);
  }

  // Shared by giftItemToNpc and giftCurrencyToNpc below: the same automatic
  // FACTION_NPC_RIPPLE_RATIO ripple reconcileReputationHits applies to a
  // reputationHit, extended to gifts too — helping an individual is helping
  // an individual whichever form the gesture takes, and a tagged member's
  // faction was already meant to feel every one of those a little.
  function rippleGiftToFaction(npcName, delta) {
    const faction = findNpcFaction(npcName, gameState.npcs);
    if (!faction) return;
    const factionKey = faction.trim().toLowerCase();
    const rippleDelta = Math.sign(delta) * Math.round(Math.abs(delta) * FACTION_NPC_RIPPLE_RATIO);
    if (rippleDelta !== 0) applyFactionReputationDeltas({ [factionKey]: rippleDelta });
  }

  // Money has no rarity tier to key off, and currency's absolute scale is
  // entirely setting-defined (10 gold in one campaign, 10,000 credits in
  // another) — so its weight as a gift is read as a FRACTION of what the
  // hero had to give, not an absolute amount, on the same 1..14 scale as
  // GIFT_REPUTATION_BY_RARITY (junk..mythic). Handing over everything you
  // own reads as generously as the top item tier; a token handful barely
  // registers, same floor as gifting junk.
  function giftCurrencyReputationDelta(amount, currencyBefore) {
    const total = Math.max(1, currencyBefore);
    const fraction = Math.max(0, Math.min(1, amount / total));
    return Math.max(GIFT_REPUTATION_BY_RARITY.junk, Math.round(GIFT_REPUTATION_BY_RARITY.junk + fraction * (GIFT_REPUTATION_BY_RARITY.mythic - GIFT_REPUTATION_BY_RARITY.junk)));
  }

  function giftCurrencyToNpc(npcName, amount) {
    const key = typeof npcName === 'string' ? npcName.trim().toLowerCase() : '';
    const amt = Math.round(Number(amount));
    if (!key || !Number.isFinite(amt) || amt <= 0 || amt > gameState.currency) { setGiftTargetNpc(null); return; }
    const delta = giftCurrencyReputationDelta(amt, gameState.currency);
    const nextState = { ...gameState, currency: gameState.currency - amt };
    const currentReputation = typeof npcReputations[key] === 'number' ? npcReputations[key] : DEFAULT_REPUTATION;
    const nextNpcReputations = { ...npcReputations, [key]: clampReputation(currentReputation + delta) };
    setGameState(nextState);
    setNpcReputations(nextNpcReputations);
    rippleGiftToFaction(npcName, delta);
    saveGame(messages, nextState, itemRarities, equipment, itemWeights, nextNpcReputations);
    setGiftTargetNpc(null);
  }

  // Single entry point GiftItemModal calls once the player actually
  // confirms a gift of either kind — dispatches to the matching handler
  // above and, if "don't show this again" was ticked, persists that so
  // future gifts skip straight past the confirmation screen (mirrors
  // confirmEditWarning's own dontShowAgain persistence exactly).
  async function confirmGift(payload, dontShowAgainChecked) {
    if (dontShowAgainChecked && !skipGiftConfirm) {
      setSkipGiftConfirm(true);
      try {
        await window.storage.set(GIFT_CONFIRM_SKIP_KEY, 'on', false);
      } catch (e) {
        // preference just won't persist across sessions
      }
    }
    if (payload.type === 'currency') {
      giftCurrencyToNpc(giftTargetNpc, payload.amount);
    } else {
      giftItemToNpc(giftTargetNpc, payload.index);
    }
  }


  // ---- COMBAT HANDLERS ----
  function startCombat(narratorIndex) {
    const narratorMsg = messages[narratorIndex];
    const encounter = narratorMsg && narratorMsg.combatEncounter;
    if (!encounter) return;
    const enemyBodyParts = normalizeEnemyBodyParts(encounter.bodyParts);
    setCombat({
      sourceNarratorIndex: narratorIndex,
      enemyName: encounter.enemyName,
      enemyDescription: encounter.enemyDescription,
      enemyWeapon: encounter.weaponDescription || t('combatUnarmedEnemyLabel'),
      enemyPower: encounter.power,
      enemyPrecision: encounter.precision,
      enemyTier: encounter.tier || 'average',
      // Kept at the original narrative scale (1-1000, not ×hpScale) purely
      // for computeFleeChance, which is calibrated against that scale —
      // see the note on it.
      enemyTotalHp: encounter.totalHp,
      playerParts: buildCombatantParts(gameState.health),
      enemyParts: buildCombatantParts(encounter.totalHp, enemyBodyParts),
      turn: 'player',
      pendingEnemyAttack: null,
      log: [],
      result: null,
      loot: null
    });
    setCombatModalOpen(true);
  }

  // Fires exactly once per fight, the moment combat.result flips to
  // 'victory' — generates the post-fight loot (see generateCombatLoot) and
  // stashes it on combat.loot so CombatModal can render it instead of
  // jumping straight to the close button. Guarded by `!prev.loot` so it
  // never re-fires while the request is in flight or after it lands.
  // Skipped entirely (loot: { status: 'none', ... }) when the player has
  // turned off item interaction altogether — same convenience toggle that
  // gates ordinary scene item offers.
  useEffect(() => {
    if (!combat || combat.result !== 'victory' || combat.loot) return;
    if (!itemInteractionEnabled) {
      setCombat(prev => (prev && prev.result === 'victory' && !prev.loot ? { ...prev, loot: { status: 'none', items: [], resolutions: {} } } : prev));
      return;
    }
    const finalCombat = combat;
    setCombat(prev => (prev && prev.result === 'victory' && !prev.loot ? { ...prev, loot: { status: 'loading', items: [], resolutions: {} } } : prev));
    (async () => {
      let items = [];
      try {
        items = await generateCombatLoot(finalCombat);
      } catch (e) {
        items = [];
      }
      setCombat(prev => (prev && prev.result === 'victory' ? { ...prev, loot: { status: 'ready', items, resolutions: {} } } : prev));
    })();
  }, [combat, itemInteractionEnabled]);

  // Toggles whether a single looted item is taken (true) or left behind
  // (false) — same ✓/✗ shape as toggleItemSelection, but simpler: loot
  // items are independent, never grouped as mutually-exclusive alternatives.
  function toggleLootSelection(itemId, takeValue) {
    setCombat(prev => {
      if (!prev || !prev.loot) return prev;
      return { ...prev, loot: { ...prev.loot, resolutions: { ...prev.loot.resolutions, [itemId]: takeValue } } };
    });
  }

  // Everything the player actually checked ✓ on in the loot panel, read
  // once at the moment combat closes — see endCombatAndClose.
  function collectTakenLoot(finalCombat) {
    if (!finalCombat.loot || finalCombat.loot.status !== 'ready') return [];
    const resolutions = finalCombat.loot.resolutions || {};
    return finalCombat.loot.items.filter(it => resolutions[it.id] === true);
  }

  // What the hero is actually swinging right now: equipped weapon(s) by
  // rarity tier (see WEAPON_DAMAGE_BY_RARITY), doubled for a two-handed
  // weapon, summed if two one-handers are dual-wielded (isWeaponLeftDisabled
  // already prevents anything being equipped alongside a two-hander, so
  // that case never double-counts here) — or a bare fist if both hands are
  // empty. label is what the combat log shows in parentheses next to a hit.
  function getPlayerWeaponInfo() {
    const weaponNames = [equipment.weaponRight, equipment.weaponLeft].filter(Boolean);
    if (weaponNames.length === 0) {
      return { damage: UNARMED_DAMAGE, label: t('combatUnarmedLabel') };
    }
    let damage = 0;
    const labels = [];
    for (const name of weaponNames) {
      const item = gameState.inventory.find(it => it.name === name);
      const rarity = findItemRarity(name, itemRarities) || 'common';
      const base = WEAPON_DAMAGE_BY_RARITY[rarity] || WEAPON_DAMAGE_BY_RARITY.common;
      damage += (item && item.twoHanded) ? base * 2 : base;
      labels.push(name);
    }
    return { damage, label: labels.join(' + ') };
  }

  // Flat damage reduction for a hit landing on a given part, from whichever
  // armor slot(s) protect it (see ARMOR_SLOT_PROTECTION), by that item's
  // rarity tier (see ARMOR_DEFENSE_BY_RARITY). An unarmored part returns 0
  // — armor mitigates, it never grants immunity (a hit always deals at
  // least 1; see where this is subtracted).
  function getPlayerDefenseForPart(partKey) {
    const activeSets = computeActiveEquipmentSets(equipment, gameState.inventory, itemRarities);
    let defense = 0;
    for (const slotKey of Object.keys(ARMOR_SLOT_PROTECTION)) {
      if (!ARMOR_SLOT_PROTECTION[slotKey].includes(partKey)) continue;
      const itemName = equipment[slotKey];
      if (!itemName) continue;
      const rarity = findItemRarity(itemName, itemRarities) || 'common';
      defense += (getArmorDefenseForSlot(slotKey, rarity) || 0) + getSetBonusForSlot(slotKey, activeSets).defense;
    }
    return defense;
  }

  // The hero's attack: resolves hit/miss and damage against the chosen
  // enemy part, then immediately has the enemy pick its own target on the
  // hero (announced in the log right away) so the player can choose a
  // defense next — see resolveDefense.
  function resolvePlayerAttack(partKey) {
    setCombat(prev => {
      if (!prev || prev.turn !== 'player' || prev.result) return prev;
      const part = BODY_PARTS.find(p => p.key === partKey);
      const targetState = prev.enemyParts[partKey];
      if (!part || !targetState || targetState.disabled) return prev;
      const partLabel = t(part.labelKey);
      const hitChance = computeHitChance(part, gameState.stats.agility);
      const hit = Math.random() * 100 < hitChance;
      let log = prev.log;
      let enemyParts = prev.enemyParts;
      let result = null;

      if (hit) {
        const weaponInfo = getPlayerWeaponInfo();
        const dmg = computeWeaponDamage(weaponInfo.damage, gameState.stats.strength);
        const newHp = Math.max(0, targetState.hp - dmg);
        const justDisabled = newHp === 0 && !targetState.disabled;
        enemyParts = { ...prev.enemyParts, [partKey]: { ...targetState, hp: newHp, disabled: newHp === 0 } };
        log = [...log, { text: t('combatLogHitTag') + ' (' + weaponInfo.label + '): ' + partLabel + ' −' + dmg + ' HP', kind: 'hit' }];
        if (justDisabled) {
          if (part.vital) {
            log = [...log, { text: partLabel + ' ' + t('combatVitalHitSuffix'), kind: 'vital' }];
            result = 'victory';
          } else {
            log = [...log, { text: partLabel + ': ' + t('combatPartDisabledSuffix'), kind: 'disabled' }];
          }
        }
      } else {
        log = [...log, { text: t('combatLogMissTag') + ': ' + partLabel, kind: 'miss' }];
      }

      if (result === 'victory') {
        return { ...prev, enemyParts, log, result, turn: 'player', pendingEnemyAttack: null };
      }
      const enemyTargetKey = pickEnemyTargetPart(prev.playerParts);
      const enemyTargetPart = BODY_PARTS.find(p => p.key === enemyTargetKey);
      log = [...log, { text: prev.enemyName + ' ' + t('combatLogEnemyAimsVerb') + ' ' + t(enemyTargetPart.labelKey + 'Acc'), kind: 'incoming' }];
      return { ...prev, enemyParts, log, turn: 'enemy', pendingEnemyAttack: { part: enemyTargetKey } };
    });
  }

  // The hero's chosen response to the enemy's already-announced attack.
  // defenseKey is one of DEFENSE_OPTIONS' keys, or 'none' to just take the
  // hit outright (no roll — v1 has no resource cost to defending, so this
  // exists purely so the player can narratively choose to just eat a blow
  // rather than being forced into a dodge/block/parry attempt every time).
  // Block and parry can also land as a partial success — a roll just above
  // the full-success chance softens the blow (partialDamageFraction)
  // instead of stopping it outright; dodge stays all-or-nothing, since
  // "partly" getting out of the way doesn't read the same way.
  function resolveDefense(defenseKey) {
    setCombat(prev => {
      if (!prev || prev.turn !== 'enemy' || !prev.pendingEnemyAttack || prev.result) return prev;
      const partKey = prev.pendingEnemyAttack.part;
      const part = BODY_PARTS.find(p => p.key === partKey);
      const targetState = prev.playerParts[partKey];
      const partLabel = t(part.labelKey);
      const hasWeapon = !!(equipment.weaponRight || equipment.weaponLeft);
      const hasBlocker = hasWeapon || !!equipment.armor;
      let log = prev.log;
      let playerParts = prev.playerParts;
      let result = null;
      let outcome = 'fail'; // 'full' | 'partial' | 'fail'

      if (defenseKey !== 'none') {
        const chance = computeDefenseChance(defenseKey, gameState.stats.agility, hasWeapon, hasBlocker);
        const roll = Math.random() * 100;
        if (roll < chance) {
          outcome = 'full';
        } else if ((defenseKey === 'block' || defenseKey === 'parry') && roll < chance + COMBAT_TUNING.partialDefenseBand) {
          outcome = 'partial';
        }
      }

      if (outcome === 'full') {
        const successKey = defenseKey === 'dodge' ? 'combatLogDodgeSuccessText' : defenseKey === 'block' ? 'combatLogBlockSuccessText' : 'combatLogParrySuccessText';
        log = [...log, { text: t(successKey), kind: 'defended' }];
      } else {
        const rawDmg = computeEnemyDamage(prev.enemyPower);
        const softenedDmg = outcome === 'partial' ? rawDmg * COMBAT_TUNING.partialDamageFraction : rawDmg;
        const defense = getPlayerDefenseForPart(partKey);
        const dmg = Math.max(1, Math.round(softenedDmg - defense));
        const newHp = Math.max(0, targetState.hp - dmg);
        const justDisabled = newHp === 0 && !targetState.disabled;
        playerParts = { ...prev.playerParts, [partKey]: { ...targetState, hp: newHp, disabled: newHp === 0 } };
        let tag;
        if (outcome === 'partial') {
          tag = defenseKey === 'block' ? t('combatLogBlockPartialText') : t('combatLogParryPartialText');
        } else {
          tag = defenseKey === 'none' ? t('combatLogNoDefenseTag') : t('combatLogDefenseFailTag');
        }
        log = [...log, { text: tag + ' (' + prev.enemyWeapon + '): ' + partLabel + ' −' + dmg + ' HP', kind: 'hit' }];
        if (justDisabled) {
          if (part.vital) {
            log = [...log, { text: partLabel + ' ' + t('combatVitalHitSuffix'), kind: 'vital' }];
            result = 'death';
          } else {
            log = [...log, { text: partLabel + ': ' + t('combatPartDisabledSuffix'), kind: 'disabled' }];
          }
        }
      }

      if (result === 'death') {
        return { ...prev, playerParts, log, result, pendingEnemyAttack: null };
      }
      return { ...prev, playerParts, log, turn: 'player', pendingEnemyAttack: null };
    });
  }

  // The "leave combat" option, available on the hero's own turn as an
  // alternative to attacking. Success ends the fight immediately (result:
  // 'fled'); failure means the enemy gets an unopposed hit on a random part
  // (fleeing forfeits any chance to dodge/block/parry, though armor still
  // helps) and the turn stays with the player, who can attack or try to
  // flee again — exactly the "keep trying until you get lucky or you die"
  // loop that was asked for. Difficulty scales with the enemy's own
  // generated stats, so an easy opponent is simple to outrun and a tough
  // one is nearly impossible to.
  function resolveFleeAttempt() {
    setCombat(prev => {
      if (!prev || prev.turn !== 'player' || prev.result) return prev;
      const chance = computeFleeChance(prev.enemyPower, prev.enemyPrecision, prev.enemyTotalHp, gameState.stats.agility);
      const succeeded = Math.random() * 100 < chance;
      let log = prev.log;

      if (succeeded) {
        log = [...log, { text: t('combatLogFleeSuccessText'), kind: 'defended' }];
        return { ...prev, log, result: 'fled' };
      }

      const partKey = pickEnemyTargetPart(prev.playerParts);
      const part = BODY_PARTS.find(p => p.key === partKey);
      const partLabel = t(part.labelKey);
      const targetState = prev.playerParts[partKey];
      const rawDmg = computeEnemyDamage(prev.enemyPower);
      const defense = getPlayerDefenseForPart(partKey);
      const dmg = Math.max(1, Math.round(rawDmg - defense));
      const newHp = Math.max(0, targetState.hp - dmg);
      const justDisabled = newHp === 0 && !targetState.disabled;
      const playerParts = { ...prev.playerParts, [partKey]: { ...targetState, hp: newHp, disabled: newHp === 0 } };
      log = [...log, { text: t('combatLogFleeFailTag') + ' (' + prev.enemyWeapon + '): ' + partLabel + ' −' + dmg + ' HP', kind: 'hit' }];
      let result = null;
      if (justDisabled) {
        if (part.vital) {
          log = [...log, { text: partLabel + ' ' + t('combatVitalHitSuffix'), kind: 'vital' }];
          result = 'death';
        } else {
          log = [...log, { text: partLabel + ': ' + t('combatPartDisabledSuffix'), kind: 'disabled' }];
        }
      }
      return { ...prev, playerParts, log, result, turn: 'player', pendingEnemyAttack: null };
    });
  }

  // English, hidden-prompt-style summary attached to the next player
  // action's itemTag (merged alongside the item-decision tag — see
  // sendBatch) so the narrative model learns the outcome without ever
  // having to re-derive numbers it never computed in the first place. Only
  // really consumed when the player keeps playing straight through a
  // 'death' without using DeathModal's rewind/resurrection options — those
  // paths replace or discard this message's forward history before it
  // would ever apply.
  function buildCombatSummaryTag(finalCombat) {
    let outcome;
    if (finalCombat.result === 'victory') {
      outcome = `The hero defeated ${finalCombat.enemyName} in a fight.`;
    } else if (finalCombat.result === 'fled') {
      outcome = `The hero fled from a fight with ${finalCombat.enemyName}, taking some injuries in the process.`;
    } else {
      outcome = `The hero was killed by ${finalCombat.enemyName} in a fight.`;
    }
    const disabledParts = BODY_PARTS.filter(p => !p.vital && finalCombat.playerParts[p.key].disabled).map(p => p.key);
    const disabledNote = disabledParts.length > 0
      ? ` The hero's ${disabledParts.join(', ')} took disabling damage during the fight and should be reflected as injured/impaired for now.`
      : '';
    const takenLoot = collectTakenLoot(finalCombat);
    const lootNote = takenLoot.length > 0
      ? ` The hero searched the body afterward and took: ${takenLoot.map(it => it.label).join(', ')}.`
      : '';
    return `[COMBAT RESULT]: ${outcome}${disabledNote}${lootNote}`;
  }

  // Reconciles the fight back into the tracked game state — health scaled
  // by the fraction of total part HP the hero has left for a win or an
  // escape, or dropped to a real 0 (plus a "death" effect) for an actual
  // death, since a destroyed vital part is meant to be lethal, not just a
  // bad scrape — and any disabled limb recorded as an effect. Marks the
  // source turn resolved so its "⚔ Fight" button doesn't reappear. Only
  // reachable once combat.result is set; see CombatModal, which only
  // renders a close control at that point. A death additionally opens
  // DeathModal — see the three options wired there (close / go back a
  // couple of turns / try an already-established resurrection).
  function endCombatAndClose() {
    if (!combat) return;
    const isDeath = combat.result === 'death';
    const totalMaxHp = BODY_PARTS.reduce((sum, p) => sum + combat.playerParts[p.key].maxHp, 0);
    const totalHp = BODY_PARTS.reduce((sum, p) => sum + combat.playerParts[p.key].hp, 0);
    const ratio = totalMaxHp > 0 ? totalHp / totalMaxHp : 1;
    const newHealth = isDeath ? 0 : Math.max(1, Math.round(gameState.health * ratio));
    const newEffects = [...gameState.effects];
    for (const p of BODY_PARTS) {
      if (!p.vital && combat.playerParts[p.key].disabled) {
        const effectText = t('combatEffectDisabledPrefix') + t(p.labelKey);
        if (!newEffects.includes(effectText)) newEffects.push(effectText);
      }
    }
    if (isDeath && !newEffects.includes(t('combatDeathEffectLabel'))) {
      newEffects.push(t('combatDeathEffectLabel'));
    }
    // Whatever the player checked ✓ on in the loot panel gets added to the
    // inventory directly, the same way dropItem/useConsumable mutate it
    // client-side without waiting on the narrative model — the item's
    // slot/twoHanded and rolled rarity are already fully known locally, so
    // there's nothing for the model to reconcile. Rarity is merged in
    // before saveGame the same way handleStart seeds startingRarities, so
    // the save reflects it immediately instead of trailing a render behind.
    const takenLoot = collectTakenLoot(combat);
    const nextInventory = takenLoot.length > 0
      ? [...gameState.inventory, ...takenLoot.map(it => ({ name: it.label, slot: it.slot, twoHanded: it.twoHanded }))]
      : gameState.inventory;
    let nextItemRarities = itemRarities;
    if (takenLoot.length > 0) {
      nextItemRarities = { ...itemRarities };
      for (const it of takenLoot) {
        const key = it.label.trim().toLowerCase();
        if (!nextItemRarities[key]) nextItemRarities[key] = it.rarity;
      }
      setItemRarities(nextItemRarities);
    }
    const nextState = { ...gameState, health: newHealth, effects: newEffects, inventory: nextInventory };
    const summaryTag = buildCombatSummaryTag(combat);
    const sourceNarratorIndex = combat.sourceNarratorIndex;
    const updatedMessages = messages.map((m, i) =>
      i === sourceNarratorIndex ? { ...m, combatResolved: true, combatSummaryTag: summaryTag } : m
    );
    setGameState(nextState);
    setMessages(updatedMessages);
    saveGame(updatedMessages, nextState, nextItemRarities, equipment);
    setCombat(null);
    setCombatModalOpen(false);
    if (isDeath) {
      setDeathSourceNarratorIndex(sourceNarratorIndex);
      setResurrectionDenied(false);
      setDeathModalOpen(true);
    }
  }

  // DeathModal's "go back a few turns" option. Jumps the view to a couple
  // of turns before the fight that killed the hero and closes the death
  // screen — from there the player uses the existing ‹ › navigation and
  // "↻ Regenerate" (already available on every turn, not just the latest)
  // to send events down a different path. Deliberately doesn't trigger a
  // regenerate itself: which exact turn to rewrite, or whether to go back
  // even further, is the player's call.

  // ---- DEATH & RESURRECTION HANDLERS ----
  function goBackFromDeath() {
    const fatalTurnIndex = turns.findIndex(turn => turn.narratorIndex === deathSourceNarratorIndex) + 1;
    const target = Math.max(1, (fatalTurnIndex > 0 ? fatalTurnIndex : totalTurns) - 2);
    goToTurn(target);
    setDeathModalOpen(false);
    setResurrectionDenied(false);
  }

  // DeathModal's "attempt to be revived" option. Asks the model to check
  // the story so far for an already-established way back (see
  // buildResurrectionCheckSystemPrompt) — this never invents a new one.
  // Success appends a fresh narrator message continuing the story and
  // clears the "death" effect; failure (including a technical error, which
  // is treated the same as an honest "no" rather than left ambiguous) just
  // surfaces the denial text and leaves the close/go-back options standing.
  async function tryResurrection() {
    setResurrectionChecking(true);
    try {
      const result = await generateResurrectionCheck(gameState);
      if (result) {
        const revivedEffects = gameState.effects.filter(e => e !== t('combatDeathEffectLabel'));
        const nextState = { ...gameState, health: result.healthAfter, effects: revivedEffects };
        const revivalMessage = {
          role: 'narrator',
          text: result.resurrectionNarrative,
          secrets: '',
          suggestions: FALLBACK_SUGGESTIONS[uiLang] || FALLBACK_SUGGESTIONS.ru,
          itemOffers: [],
          questOffers: [],
          rewardOffers: [],
          combatEncounter: null,
          stateBefore: gameState,
          tokenUsage: 0
        };
        const updatedMessages = [...messages, revivalMessage];
        setGameState(nextState);
        setMessages(updatedMessages);
        saveGame(updatedMessages, nextState, itemRarities, equipment);
        setDeathModalOpen(false);
        setResurrectionDenied(false);
      } else {
        setResurrectionDenied(true);
      }
    } catch (e) {
      setResurrectionDenied(true);
    } finally {
      setResurrectionChecking(false);
    }
  }

  // The state model re-derives the inventory fresh each turn (see
  // generateStateAndEvents) rather than tracking persistent item identity, so an
  // equipped item can simply vanish from the list turn to turn (lost, used
  // up, taken away in the story). Exact name match is intentionally strict
  // here — equipping is a deliberate choice, so if the name no longer
  // matches at all, treat the slot as empty rather than guessing.

  // ---- INVENTORY UPKEEP EFFECTS — unequip removed items; backfill rarity/weight ----
  useEffect(() => {
    setEquipment(prev => {
      let changed = false;
      const next = { ...prev };
      for (const slotKey of Object.keys(next)) {
        if (next[slotKey] && !gameState.inventory.some(it => it.name === next[slotKey])) {
          next[slotKey] = null;
          changed = true;
        }
      }
      return changed ? next : prev;
    });
  }, [gameState.inventory]);

  // Rarity is normally rolled when an item is offered and accepted (see
  // toggleItemSelection), but plenty of inventory entries arrive some other
  // way — starting gear, something the narrative just describes the hero
  // picking up. Every item shown on the sheet should have a color, so
  // anything with no rarity match yet gets one rolled here the first time
  // it's seen.
  useEffect(() => {
    const unrolled = gameState.inventory.filter(it => !findItemRarity(it.name, itemRarities));
    if (unrolled.length === 0) return;
    setItemRarities(prev => {
      const next = { ...prev };
      let changed = false;
      for (const it of unrolled) {
        const key = it.name.trim().toLowerCase();
        if (!next[key]) {
          next[key] = rollItemRarity();
          changed = true;
        }
      }
      return changed ? next : prev;
    });
  }, [gameState.inventory]);

  // Same idea, for weight: every inventory item needs a cached number for
  // the carry total to mean anything, and unlike rarity a weight can only
  // be rolled once the item's "slot" is known — which only exists once it's
  // actually in gameState.inventory (an offer is just an id/label with no
  // slot yet until then) — so this catch-up effect is the
  // one and only place weight ever gets rolled.
  useEffect(() => {
    const unrolled = gameState.inventory.filter(it => !findItemWeight(it.name, itemWeights));
    if (unrolled.length === 0) return;
    setItemWeights(prev => {
      const next = { ...prev };
      let changed = false;
      for (const it of unrolled) {
        const key = it.name.trim().toLowerCase();
        if (!next[key]) {
          next[key] = rollItemWeight(it.slot, it.twoHanded);
          changed = true;
        }
      }
      return changed ? next : prev;
    });
  }, [gameState.inventory]);


  // ---- TURN SUBMISSION ----
  async function handleStart() {
    if (!worldSetting.trim() || !heroName.trim()) {
      setError(t('missingFieldsError'));
      return;
    }
    if (!geminiApiKey.trim()) {
      setError(t('missingApiKeyError'));
      return;
    }
    setError(null);
    setLoading(true);
    setStage('playing');
    requestWakeLock();
    try {
      const stateBefore = EMPTY_STATE;
      const opening = { role: 'player', text: OPENING_TRIGGER };
      const result = await callGameMaster([opening], stateBefore, true);
      const openingMessages = [{ role: 'narrator', text: result.narrative, secrets: result.secrets, suggestions: result.suggestions, itemOffers: result.itemOffers, questOffers: result.questOffers, rewardOffers: result.rewardOffers, travelOffer: result.travelOffer, combatEncounter: result.combatEncounter, appliedReputationDeltas: result.reputationDeltas, appliedFactionReputationDeltas: result.factionReputationDeltas, appliedKindnessCooldownNpcs: result.kindnessCooldownNpcs, appliedKindnessCooldownTurn: result.turnIndex, stateBefore, tokenUsage: result.tokenUsage }];
      const startingEquipment = autoEquipStartingGear(result.state.inventory);
      const startingRarities = { ...itemRarities };
      for (const item of result.state.inventory) {
        const key = item.name.trim().toLowerCase();
        if (!startingRarities[key]) startingRarities[key] = rollStartingItemRarity();
      }
      setItemRarities(startingRarities);
      setMessages(openingMessages);
      setGameState(result.state);
      setEquipment(startingEquipment);
      setLastTokenUsage(result.tokenUsage);
      applyReputationDeltas(result.reputationDeltas);
      applyFactionReputationDeltas(result.factionReputationDeltas);
      applyKindnessCooldowns(result.kindnessCooldownNpcs, result.turnIndex);
      migrateNpcReputations(result.npcRenames);
      migrateNpcKindnessCooldowns(result.npcRenames);
      saveGame(openingMessages, result.state, startingRarities, startingEquipment);
      updateNarrativeSummary(openingMessages, result.state).catch(() => {});
    } catch (e) {
      setError(describeError(e, 'startFailedPrefix'));
      setStage('setup');
    } finally {
      setLoading(false);
      setStreamingText('');
      releaseWakeLock();
    }
  }

  // Sends whatever new non-narrator messages (a director note and/or a
  // player action) as a single batch and generates one narrator response
  // covering all of them together — a note never generates a turn by
  // itself.
  async function sendBatch(newActionMessages) {
    const unresolved = [...getUnresolvedItemOffers(), ...getUnresolvedQuestOffers(), ...getUnresolvedTravelOffer()];
    if (unresolved.length > 0) {
      setError(t('resolveItemsErrorPrefix') + '«' + unresolved[0].label + '»');
      return;
    }
    if (loading || newActionMessages.length === 0) return;
    const precedingNarrator = messages.length > 0 && messages[messages.length - 1].role === 'narrator'
      ? messages[messages.length - 1]
      : null;
    const itemTag = buildItemResolutionTag(precedingNarrator);
    const combatTag = precedingNarrator && precedingNarrator.combatSummaryTag ? precedingNarrator.combatSummaryTag : '';
    const combinedTag = [combatTag, itemTag].filter(Boolean).join('\n\n');
    if (combinedTag) newActionMessages[0] = { ...newActionMessages[0], itemTag: combinedTag };

    const newMessages = [...messages, ...newActionMessages];
    const stateBefore = gameState;
    setMessages(newMessages);
    setLoading(true);
    setError(null);
    requestWakeLock();
    try {
      const result = await callGameMaster(newMessages, stateBefore, false);
      const updatedMessages = [...newMessages, { role: 'narrator', text: result.narrative, secrets: result.secrets, suggestions: result.suggestions, itemOffers: result.itemOffers, questOffers: result.questOffers, rewardOffers: result.rewardOffers, travelOffer: result.travelOffer, combatEncounter: result.combatEncounter, appliedReputationDeltas: result.reputationDeltas, appliedFactionReputationDeltas: result.factionReputationDeltas, appliedKindnessCooldownNpcs: result.kindnessCooldownNpcs, appliedKindnessCooldownTurn: result.turnIndex, stateBefore, tokenUsage: result.tokenUsage }];
      setMessages(updatedMessages);
      setGameState(result.state);
      setLastTokenUsage(result.tokenUsage);
      applyReputationDeltas(result.reputationDeltas);
      applyFactionReputationDeltas(result.factionReputationDeltas);
      applyKindnessCooldowns(result.kindnessCooldownNpcs, result.turnIndex);
      migrateNpcReputations(result.npcRenames);
      migrateNpcKindnessCooldowns(result.npcRenames);
      saveGame(updatedMessages, result.state);
      updateNarrativeSummary(updatedMessages, result.state).catch(() => {});
    } catch (e) {
      setError(describeError(e, 'sendFailedPrefix'));
    } finally {
      setLoading(false);
      setStreamingText('');
      releaseWakeLock();
    }
  }

  async function handleSend() {
    if (!input.trim() || loading || gameState.health <= 0) return;
    const text = input.trim();
    const note = pendingNote.trim();
    if (editingTurnIndex !== null) {
      const turnIndex = editingTurnIndex;
      setEditingTurnIndex(null);
      setInput('');
      setPendingNote('');
      await regenerateTurnWithEdits(turnIndex, text, note);
      return;
    }
    const unresolved = [...getUnresolvedItemOffers(), ...getUnresolvedQuestOffers(), ...getUnresolvedTravelOffer()];
    if (unresolved.length > 0) {
      setError(t('resolveItemsErrorPrefix') + '«' + unresolved[0].label + '»');
      return;
    }
    setInput('');
    setPendingNote('');
    setPendingMapTravel(null);
    const batch = [];
    if (note) batch.push({ role: 'director', text: note });
    batch.push({ role: 'player', text });
    await sendBatch(batch);
  }

  function useSuggestion(text) {
    setInput(text);
  }


  // ---- DIRECTOR NOTE HANDLERS ----
  function openDirectorModal() {
    setDirectorInput(pendingNote);
    setDirectorModalOpen(true);
  }

  function saveDirectorNote() {
    setPendingNote(directorInput.trim());
    setDirectorInput('');
    setDirectorModalOpen(false);
  }

  // Editing a past action or director note re-opens the same composer UI used
  // to write it (see beginEditingTurn), pre-filled — both the action AND the
  // note field get restored together regardless of which one the pencil was
  // clicked on, so editing just one never drops the other. Submitting goes
  // through handleSend -> regenerateTurnWithEdits above, exactly like the
  // existing "Retry" button except with the edited text standing in for the
  // turn's original action/note.

  // ---- EDIT TURN HANDLERS ----
  function requestEditTurn(turnIndex) {
    if (loading || anyEditActive) return;
    if (skipEditWarning) {
      beginEditingTurn(turnIndex);
    } else {
      setEditWarningDontShowAgain(false);
      setEditWarningTarget(turnIndex);
    }
  }

  function beginEditingTurn(turnIndex) {
    const turn = turns[turnIndex - 1];
    if (!turn) return;
    const directorMsg = turn.actions.find(a => a.role === 'director');
    const playerMsg = turn.actions.find(a => a.role === 'player');
    setPendingNote(directorMsg ? directorMsg.text : '');
    setInput(playerMsg ? playerMsg.text : '');
    setEditingTurnIndex(turnIndex);
  }

  async function confirmEditWarning() {
    const turnIndex = editWarningTarget;
    if (editWarningDontShowAgain) {
      setSkipEditWarning(true);
      try {
        await window.storage.set(EDIT_WARNING_SKIP_KEY, 'on', false);
      } catch (e) {
        // preference just won't persist across sessions
      }
    }
    setEditWarningTarget(null);
    beginEditingTurn(turnIndex);
  }

  function cancelEditWarning() {
    setEditWarningTarget(null);
    setEditWarningDontShowAgain(false);
  }

  function cancelEditingTurn() {
    setEditingTurnIndex(null);
    setInput('');
    setPendingNote('');
  }

  // Editing the master's own narrative text is a plain in-place rewrite —
  // no regeneration, no confirmation, it just replaces that message's text.
  function startEditingNarrator(narratorIndex, currentText) {
    if (loading || anyEditActive) return;
    setEditingNarratorIndex(narratorIndex);
    setNarratorEditDraft(currentText);
  }

  function cancelEditingNarrator() {
    setEditingNarratorIndex(null);
    setNarratorEditDraft('');
  }

  function saveEditingNarrator() {
    const narratorIndex = editingNarratorIndex;
    const newText = narratorEditDraft;
    const updated = messages.map((m, i) => (i === narratorIndex ? { ...m, text: newText } : m));
    setMessages(updated);
    saveGame(updated, gameState);
    setEditingNarratorIndex(null);
    setNarratorEditDraft('');
  }

  // Regenerating turnIndex replaces its response and discards every turn
  // after it (their context depended on the version being replaced) — the
  // confirmation dialog warns about this whenever it isn't the latest turn.

  // ---- REGENERATE HANDLERS ----
  async function regenerateTurn(turnIndex) {
    setRegenerateTarget(null);
    if (loading) return;
    const turn = turns[turnIndex - 1];
    if (!turn) return;
    const stateBefore = turn.narrator.stateBefore || EMPTY_STATE;
    const isOpeningTurn = turnIndex === 1;
    const historyUpToAction = isOpeningTurn
      ? [{ role: 'player', text: OPENING_TRIGGER }]
      : messages.slice(0, turn.narratorIndex);
    setLoading(true);
    setError(null);
    requestWakeLock();
    try {
      undoReputationDeltas(turn.narrator.appliedReputationDeltas);
      undoFactionReputationDeltas(turn.narrator.appliedFactionReputationDeltas);
      undoKindnessCooldowns(turn.narrator.appliedKindnessCooldownNpcs, turn.narrator.appliedKindnessCooldownTurn);
      const result = await callGameMaster(historyUpToAction, stateBefore, isOpeningTurn);
      const updatedMessages = [...historyUpToAction, { role: 'narrator', text: result.narrative, secrets: result.secrets, suggestions: result.suggestions, itemOffers: result.itemOffers, questOffers: result.questOffers, rewardOffers: result.rewardOffers, travelOffer: result.travelOffer, combatEncounter: result.combatEncounter, appliedReputationDeltas: result.reputationDeltas, appliedFactionReputationDeltas: result.factionReputationDeltas, appliedKindnessCooldownNpcs: result.kindnessCooldownNpcs, appliedKindnessCooldownTurn: result.turnIndex, stateBefore, tokenUsage: result.tokenUsage }];
      setMessages(updatedMessages);
      setGameState(result.state);
      setLastTokenUsage(result.tokenUsage);
      applyReputationDeltas(result.reputationDeltas);
      applyFactionReputationDeltas(result.factionReputationDeltas);
      applyKindnessCooldowns(result.kindnessCooldownNpcs, result.turnIndex);
      migrateNpcReputations(result.npcRenames);
      migrateNpcKindnessCooldowns(result.npcRenames);
      saveGame(updatedMessages, result.state);
    } catch (e) {
      setError(describeError(e, 'sendFailedPrefix'));
    } finally {
      setLoading(false);
      setStreamingText('');
      releaseWakeLock();
    }
  }

  // Same idea as regenerateTurn, but substitutes the edited action/note text
  // for that turn's originals instead of resending them unchanged. The
  // preceding turn's item-decision tag (if any) is carried over unchanged —
  // it describes what happened in the PRIOR turn, so editing this turn's own
  // text shouldn't drop it.
  async function regenerateTurnWithEdits(turnIndex, actionText, noteText) {
    if (loading) return;
    const turn = turns[turnIndex - 1];
    if (!turn) return;
    const stateBefore = turn.narrator.stateBefore || EMPTY_STATE;
    const actionsStartIndex = turn.narratorIndex - turn.actions.length;
    const historyBeforeActions = messages.slice(0, actionsStartIndex);
    const newActionMessages = [];
    if (noteText) newActionMessages.push({ role: 'director', text: noteText });
    newActionMessages.push({ role: 'player', text: actionText });
    const originalItemTag = turn.actions[0] && turn.actions[0].itemTag;
    if (originalItemTag) newActionMessages[0] = { ...newActionMessages[0], itemTag: originalItemTag };
    const historyUpToAction = [...historyBeforeActions, ...newActionMessages];
    const isOpeningTurn = turnIndex === 1;
    setLoading(true);
    setError(null);
    requestWakeLock();
    try {
      undoReputationDeltas(turn.narrator.appliedReputationDeltas);
      undoFactionReputationDeltas(turn.narrator.appliedFactionReputationDeltas);
      undoKindnessCooldowns(turn.narrator.appliedKindnessCooldownNpcs, turn.narrator.appliedKindnessCooldownTurn);
      const result = await callGameMaster(historyUpToAction, stateBefore, isOpeningTurn);
      const updatedMessages = [...historyUpToAction, { role: 'narrator', text: result.narrative, secrets: result.secrets, suggestions: result.suggestions, itemOffers: result.itemOffers, questOffers: result.questOffers, rewardOffers: result.rewardOffers, travelOffer: result.travelOffer, combatEncounter: result.combatEncounter, appliedReputationDeltas: result.reputationDeltas, appliedFactionReputationDeltas: result.factionReputationDeltas, appliedKindnessCooldownNpcs: result.kindnessCooldownNpcs, appliedKindnessCooldownTurn: result.turnIndex, stateBefore, tokenUsage: result.tokenUsage }];
      setMessages(updatedMessages);
      setGameState(result.state);
      setLastTokenUsage(result.tokenUsage);
      applyReputationDeltas(result.reputationDeltas);
      applyFactionReputationDeltas(result.factionReputationDeltas);
      applyKindnessCooldowns(result.kindnessCooldownNpcs, result.turnIndex);
      migrateNpcReputations(result.npcRenames);
      migrateNpcKindnessCooldowns(result.npcRenames);
      saveGame(updatedMessages, result.state);
    } catch (e) {
      setError(describeError(e, 'sendFailedPrefix'));
    } finally {
      setLoading(false);
      setStreamingText('');
      releaseWakeLock();
    }
  }


  // ---- EXPORT HANDLERS ----
  async function buildExportText() {
    const payload = {
      worldSetting, heroName, heroConcept,
      messages: stripEphemeralForExport(messages),
      gameState,
      itemRarities,
      itemWeights,
      npcReputations,
      npcKindnessCooldowns,
      factionReputations,
      equipment,
      narrativeSummary: narrativeSummaryRef.current,
      summarizedUpTo: summarizedUpToRef.current
    };
    const json = JSON.stringify(payload);
    if (typeof CompressionStream !== 'undefined') {
      try {
        const compressed = await gzipCompress(json);
        return SAVE_PREFIX_V2 + bytesToBase64(compressed);
      } catch (e) {
        // fall through to the uncompressed format below
      }
    }
    return SAVE_PREFIX + toBase64Utf8(json);
  }

  function openExportModal() {
    setExportModalOpen(true);
    setExportGenerating(true);
    buildExportText().then(text => {
      setExportText(text);
      setExportGenerating(false);
    });
  }

  async function copyExportText() {
    try {
      await navigator.clipboard.writeText(exportText);
      setCopyFeedback(true);
      setTimeout(() => setCopyFeedback(false), 2000);
    } catch (e) {
      // clipboard unavailable — the player can still copy manually from the textarea
    }
  }

  function downloadExportText() {
    if (!exportText) return;
    try {
      const blob = new Blob([exportText], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const datePart = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `grimoire-save-${heroName ? heroName.replace(/[^\p{L}\p{N}]+/gu, '-') + '-' : ''}${datePart}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) {
      // download not supported here — copy/paste remains available
    }
  }


  // ---- IMPORT HANDLER ----
  async function handleImportSave() {
    setImportError(null);
    const trimmed = importText.trim();
    try {
      let decoded;
      if (trimmed.startsWith(SAVE_PREFIX_V2)) {
        const bytes = base64ToBytes(trimmed.slice(SAVE_PREFIX_V2.length));
        const json = await gzipDecompress(bytes);
        decoded = JSON.parse(json);
      } else if (trimmed.startsWith(SAVE_PREFIX)) {
        decoded = JSON.parse(fromBase64Utf8(trimmed.slice(SAVE_PREFIX.length)));
      } else {
        setImportError(t('importPrefixError'));
        return;
      }
      setWorldSetting(decoded.worldSetting || '');
      setHeroName(decoded.heroName || '');
      setHeroConcept(decoded.heroConcept || '');
      setMessages(decoded.messages || []);
      const normalizedState = normalizeGameState(decoded.gameState);
      setGameState(normalizedState);
      setItemRarities(decoded.itemRarities || {});
      setItemWeights(decoded.itemWeights || {});
      setNpcReputations(decoded.npcReputations || {});
      setNpcKindnessCooldowns(decoded.npcKindnessCooldowns || {});
      setFactionReputations(decoded.factionReputations || {});
      const normalizedEquipment = normalizeEquipment(decoded.equipment);
      setEquipment(normalizedEquipment);
      narrativeSummaryRef.current = decoded.narrativeSummary || '';
      summarizedUpToRef.current = decoded.summarizedUpTo || 0;
      saveGame(decoded.messages || [], normalizedState, decoded.itemRarities || {}, normalizedEquipment, decoded.itemWeights || {}, decoded.npcReputations || {}, decoded.factionReputations || {}, decoded.npcKindnessCooldowns || {});
      setImportModalOpen(false);
      setImportText('');
      if (decoded.messages && decoded.messages.length > 0) setStage('playing');
    } catch (e) {
      setImportError(t('importParseError'));
    }
  }

  // ---- FILE UPLOAD HANDLERS ----
  async function handleFileUpload(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setFileError(null);
    setFileLoading(true);
    try {
      const name = file.name.toLowerCase();
      let text = '';
      if (name.endsWith('.docx')) {
        const arrayBuffer = await file.arrayBuffer();
        const result = await mammoth.extractRawText({ arrayBuffer });
        text = result.value;
      } else if (name.endsWith('.txt') || name.endsWith('.md')) {
        text = await file.text();
      } else {
        throw new Error('unsupported');
      }
      text = text.trim();
      if (!text) throw new Error('empty');
      let truncated = false;
      if (text.length > MAX_UPLOAD_CHARS) {
        text = text.slice(0, MAX_UPLOAD_CHARS);
        truncated = true;
      }
      setWorldSetting(text);
      setUploadedFileName(file.name + (truncated ? ' · truncated to fit the limit' : ''));
    } catch (err) {
      setFileError(t('fileUnsupportedError'));
      setUploadedFileName('');
    } finally {
      setFileLoading(false);
      if (fileInputRef.current) fileInputRef.current.value = '';
    }
  }

      {restartConfirmOpen && <RestartConfirmModal onConfirm={confirmRestart} onCancel={() => setRestartConfirmOpen(false)} t={t} />}
      {regenerateTarget !== null && (
        <RegenerateConfirmModal
          withLoss={regenerateTarget !== totalTurns}
          onConfirm={() => regenerateTurn(regenerateTarget)}
          onCancel={() => setRegenerateTarget(null)}
          t={t}
        />
      )}
      {editWarningTarget !== null && (
        <EditConfirmModal
          withLoss={editWarningTarget !== totalTurns}
          dontShowAgain={editWarningDontShowAgain}
          onDontShowAgainChange={setEditWarningDontShowAgain}
          onConfirm={confirmEditWarning}
          onCancel={cancelEditWarning}
          t={t}
        />
      )}
    </div>
  );
}

  .sheet-overlay-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem; border-bottom: 1px solid var(--stone-800); }
  .icon-btn { background: none; border: none; color: var(--stone-400); font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; cursor: pointer; }
  .icon-btn:hover { color: var(--amber-500); }
  @media (min-width: 1024px) { .sidebar { display: block; } .sheet-overlay { display: none; } }
`;


  // ---- Mount ----
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
