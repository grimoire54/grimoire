name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install

      - name: Add the Android native project
        run: npx cap add android

        name: Set version code
      run: |
        sed -i 's/versionCode 1/versionCode 2/' android/app/build.gradle
        sed -i 's/versionName "1.0"/versionName "1.0.1"/' android/app/build.gradle

      - name: Register the AdMob App ID
        run: |
          python3 - <<'PY'
          import re
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              manifest = f.read()
          meta_data = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id" />'
          manifest = re.sub(r'(<application\b[^>]*>)', r'\1\n ' + meta_data, manifest, count=1)
          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(manifest)
          strings_path = 'android/app/src/main/res/values/strings.xml'
          with open(strings_path, 'r', encoding='utf-8') as f:
              strings = f.read()
          admob_string = ' <string name="admob_app_id">ca-app-pub-6984929241398787~9526945696</string>\n'
          strings = strings.replace('</resources>', admob_string + '</resources>')
          with open(strings_path, 'w', encoding='utf-8') as f:
              f.write(strings)
          PY

      - name: Apply the app icon
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0c0a09' --iconBackgroundColorDark '#0c0a09'

      - name: Copy the game files into the native project
        run: npx cap sync android

      - name: Decode keystore and detect alias
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/grimoire.keystore
          ALIAS=$(keytool -list -keystore android/grimoire.keystore \
            -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
            | grep "PrivateKeyEntry\|SecretKeyEntry\|trustedCertEntry" \
            | head -1 | awk -F',' '{print $1}' | xargs)
          echo "Detected alias: $ALIAS"
          echo "KEY_ALIAS_DETECTED=$ALIAS" >> $GITHUB_ENV

      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/grimoire.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="${{ env.KEY_ALIAS_DETECTED }}" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: Upload AAB for Play Store
        uses: actions/upload-artifact@v4
        with:
          name: grimoire-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: grimoire-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
