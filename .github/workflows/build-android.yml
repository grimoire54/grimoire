name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add the Android native project
        run: npx cap add android

      - name: Register the AdMob App ID
        run: |
          sed -i '/<application/a\    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id" />' android/app/src/main/AndroidManifest.xml
          sed -i 's#</resources>#    <string name="admob_app_id">ca-app-pub-6984929241398787~9526945696</string>\n</resources>#' android/app/src/main/res/values/strings.xml

      - name: Apply the app icon
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0c0a09' --iconBackgroundColorDark '#0c0a09'

      - name: Copy the game files into the native project
        run: npx cap sync android

      - name: Build a debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: grimoire-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
