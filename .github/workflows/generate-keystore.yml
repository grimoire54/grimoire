name: Generate Keystore

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Пароль (тот же что раньше)'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      
name: Generate keystore
      run: |
        keytool -genkeypair \-alias grimoire \-keypass ${{ github.event.inputs.password }} \-storepass ${{ github.event.inputs.password }} \-keystore grimoire.keystore \-keyalg RSA -keysize 2048 -validity 10000 \-dname "CN=GrimoireRPG, OU=GrimoireRPG, O=GrimoireRPG, L=Unknown, S=Unknown, C=DE"
        base64 grimoire.keystore > keystore_base64.txt
        echo "Alias check:"
        keytool -list -keystore grimoire.keystore -storepass ${{ github.event.inputs.password }}

      
name: Upload keystore files
      uses: actions/upload-artifact@v4
      with:
        name: keystore-files
        path: |
          grimoire.keystore
          keystore_base64.txt
